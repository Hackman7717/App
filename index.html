<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trainingsbuch</title>
<meta name="description" content="Training, Gewohnheiten, Ernährung, Schlaf und Fortschritt an einem Ort. Alle Daten bleiben auf deinem Gerät.">
<meta name="theme-color" content="#E4E9E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F0C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trainingsbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="app-version" content="1.6.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
@font-face{font-family:'Saira Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/saira-condensed-600.woff) format('woff')}
@font-face{font-family:'Saira Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/saira-condensed-700.woff) format('woff')}
@font-face{font-family:'Saira Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/saira-condensed-800.woff) format('woff')}
@font-face{font-family:'Public Sans';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/public-sans.woff) format('woff')}
</style>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Farben wie Hantelscheiben: Waldgrün (10-kg-Scheibe) als Akzent, Gelb (15-kg-Scheibe) für Rekorde.
   Layout: App-Rahmen mit fester Kopfleiste und Tab-Leiste, nur der Inhalt dazwischen scrollt. Flächen laufen randlos, alle Ecken hart. */
:root{
  --bg:#E4E9E5; --surface:#FFFFFF; --soft:#DAE2DC; --field:#F1F5F2; --ink:#0F1612; --muted:#58635B;
  --line:#C8D1CA; --line-2:#8C998F;
  --accent:#1E5134; --accent-ink:#FFFFFF; --accent-fg:#1E5134; --accent-soft:#DAE8DE;
  --pr:#9A6800; --pr-soft:#F4E9C8; --good:#377D27; --bad:#B23A22;
  --m-kh:#B98500; --m-ei:#1E5134; --m-fe:#3F6B8E;
  --press:rgba(15,22,18,.07); --scrim:rgba(10,16,12,.16); --knurl:rgba(255,255,255,.13);
  --f-display:'Saira Condensed','Arial Narrow',sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px),calc((100% - 560px) / 2));
  --gr:max(16px,env(safe-area-inset-right,0px),calc((100% - 560px) / 2));
  --bleed:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0F0C; --surface:#121A15; --soft:#1A241E; --field:#0E1511; --ink:#E2E9E4; --muted:#8C9A90;
  --line:#25312A; --line-2:#4A5A4F;
  --accent:#2E7149; --accent-ink:#FFFFFF; --accent-fg:#7FC59A; --accent-soft:#1A2E21;
  --pr:#E0AC2C; --pr-soft:#3A2E10; --good:#7CC35B; --bad:#EE6A52;
  --m-kh:#D19A1A; --m-ei:#5FAF7E; --m-fe:#6F9CC4;
  --press:rgba(255,255,255,.07); --scrim:rgba(0,0,0,.45); --knurl:rgba(255,255,255,.12); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A0F0C; --surface:#121A15; --soft:#1A241E; --field:#0E1511; --ink:#E2E9E4; --muted:#8C9A90;
  --line:#25312A; --line-2:#4A5A4F;
  --accent:#2E7149; --accent-ink:#FFFFFF; --accent-fg:#7FC59A; --accent-soft:#1A2E21;
  --pr:#E0AC2C; --pr-soft:#3A2E10; --good:#7CC35B; --bad:#EE6A52;
  --m-kh:#D19A1A; --m-ei:#5FAF7E; --m-fe:#6F9CC4;
  --press:rgba(255,255,255,.07); --scrim:rgba(0,0,0,.45); --knurl:rgba(255,255,255,.12); color-scheme:dark }

/* ---------- Grundlagen ---------- */
*{box-sizing:border-box}
html{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance;margin:0;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.up{color:var(--good)} .down{color:var(--bad)}
.err{color:var(--bad);font-size:13.5px;font-weight:600}

/* ---------- App-Rahmen ---------- */
.app{height:100%;display:flex;flex-direction:column}
header.top{flex:none;position:relative;z-index:6;display:flex;align-items:center;gap:12px;min-height:58px;padding-block:8px;
  padding-left:var(--gl);padding-right:var(--gr);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-size:clamp(24px,7.6vw,30px);font-weight:800;white-space:nowrap;min-width:0}
.brand span{color:var(--accent-fg)}
.hdr-t{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1 1 auto}
.hdr-t h1{font-size:24px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-t .eyebrow{line-height:1.1}
.back{flex:none;width:42px;height:42px;display:grid;place-items:center;padding:0;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.back svg{width:22px;height:22px}
.back:active{background:var(--soft)}
.hdr-r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.hdr-r .sub{font-size:12px;color:var(--muted);line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.demob{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 9px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);
  font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.demob svg{width:14px;height:14px;flex:none}
.demob.on{background:var(--pr-soft);border-color:var(--pr);color:var(--pr)}

.stage{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:var(--bg)}
main.scr{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:16px;padding-block:16px 32px;padding-left:var(--gl);padding-right:var(--gr);
  background:var(--bg);box-shadow:-1px 0 0 var(--line-2);outline:none;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
main.scr > *{flex-shrink:0}
main.scr.under{visibility:hidden;pointer-events:none}
.dimmer{position:absolute;inset:0;z-index:2;background:var(--scrim);pointer-events:none}
.toasts{position:absolute;left:0;right:0;bottom:16px;z-index:8;display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.toast{pointer-events:auto;max-width:100%;background:var(--ink);color:var(--bg);border-left:4px solid var(--accent-fg);padding:11px 16px;font-size:14px;font-weight:600}
.toast.act{display:flex;align-items:center;gap:12px;padding:7px 7px 7px 14px}
.toast.act button{border:0;background:var(--bg);color:var(--ink);min-height:34px;padding:0 12px;font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}

.tabbar{flex:none;position:relative;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  padding-left:max(env(safe-area-inset-left,0px),calc((100% - 600px) / 2));padding-right:max(env(safe-area-inset-right,0px),calc((100% - 600px) / 2));
  background:var(--surface);border-top:1px solid var(--line-2);box-shadow:0 env(safe-area-inset-bottom,0px) 0 var(--surface)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:58px;padding:8px 2px 6px;
  border:0;background:none;color:var(--muted);font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1.25}
.tab svg{width:24px;height:24px;flex:none}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.tab.on{color:var(--accent-fg)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--accent)}
.tab:active{background:var(--press)}
.tab .live{position:absolute;top:6px;left:calc(50% + 7px);width:9px;height:9px;background:var(--good);box-shadow:0 0 0 2px var(--surface)}
body.sheet .tabbar,body.kb .tabbar{display:none}

/* ---------- Flächen ---------- */
.card{background:var(--surface);border:1px solid var(--line);padding:14px 16px}
.section{display:flex;flex-direction:column;gap:12px}
.section > h2{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800}
.section > h2::before{content:"";flex:none;width:10px;height:10px;background:var(--accent)}
.section > h2.big{font-size:36px}
.section > h2.big::before{width:14px;height:14px}
.eyebrow{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--pr-soft);border:1px solid var(--pr);padding:10px 16px;font-size:13px;line-height:1.35}
/* Flächen laufen auf dem Handy bis an den Rand */
.scr > .card,.scr > .section > .card,.scr > .banner,.scr > .section > .banner,.home > .banner,.grp > .goalcard{margin-inline:calc(-1 * var(--bleed));padding-inline:var(--bleed);border-inline-width:0}
.scr > .fold,.grp > .navlist{margin-inline:calc(-1 * var(--bleed));border-inline-width:0}
.grp > .goalcard{width:auto}
@media (min-width:600px){
  .scr > .card,.scr > .section > .card,.scr > .banner,.scr > .section > .banner,.home > .banner,.grp > .goalcard,.scr > .fold,.grp > .navlist{border-inline-width:1px}
}

/* ---------- Bedienelemente ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;text-align:center}
.btn:active{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:active{background:var(--accent);filter:brightness(.86)}
.btn.ghost{background:transparent}
.btn.ghost:active{background:var(--press)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:19px;letter-spacing:.06em}
.btn.primary.big{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.btn.primary.big:focus-visible{clip-path:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.subtle{border-color:transparent;background:transparent;color:var(--muted);min-height:40px;font-size:14px}
.iconbtn{width:36px;height:36px;padding:0;border:1px solid transparent;background:transparent;color:var(--muted);display:inline-grid;place-items:center;flex:none;font-size:16px}
.iconbtn:active{background:var(--press)}
.iconbtn.pen svg{width:18px;height:18px}
.iconbtn.pen.on{color:var(--accent-fg);border-color:var(--accent-fg)}

label.field,.field{display:flex;flex-direction:column;gap:5px;min-width:0}
input.in,select.in,textarea.in{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line-2);background:var(--field);color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none}
select.in{padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%;background-size:6px 6px;background-repeat:no-repeat}
textarea.in{min-height:96px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
input[type="date"].in{min-width:0;display:block;text-align:left}
.in:focus,select.wh:focus{outline:none;border-color:var(--accent-fg);box-shadow:inset 0 0 0 1px var(--accent-fg)}
.field > .in + .in{margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > *{flex:1 1 130px}
.lbl-row{display:flex;align-items:center;gap:8px;min-height:24px}

.seg{display:flex;border:1px solid var(--line-2);background:var(--surface)}
.seg button{flex:1 1 0;min-width:0;min-height:40px;padding:0 6px;border:0;border-left:1px solid var(--line-2);background:none;color:var(--muted);
  font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:first-child{border-left:0}
.seg button:active{background:var(--press)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.sm button{min-height:32px;font-size:13.5px}
.seg.mini{flex:none}
.seg.mini button{flex:0 0 auto;min-height:30px;padding:0 9px;font-size:13px}
.modesw button{min-height:36px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.chip:active{background:var(--press)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.nudge{flex:none;width:28px;min-height:42px;padding:0;border:1px solid var(--line-2);background:var(--soft);color:var(--accent-fg);font-weight:800;font-size:18px}
.nudge:active{background:var(--line)}
select.wh{-webkit-appearance:none;appearance:none;width:100%;min-width:0;min-height:42px;padding:6px 2px;border:1px solid var(--line-2);background:var(--field);
  font-size:16px;text-align:center;text-align-last:center}
.kgc{display:flex;gap:4px;min-width:0}
.bwc{gap:6px}
.bwc .nudge{width:44px;font-size:20px}
.bwc select{flex:1;min-width:0;text-align:center;text-align-last:center}

.switch{flex:none;position:relative;width:52px;height:30px;padding:0;border:1px solid var(--line-2);background:var(--soft)}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;background:var(--surface);border:1px solid var(--line-2);transition:left .15s}
.switch.on{background:var(--good);border-color:var(--good)}
.switch.on span{left:25px;border-color:var(--good)}

.info{width:24px;height:24px;padding:0;border:1.5px solid var(--accent-fg);background:transparent;color:var(--accent-fg);font:800 14px/1 var(--f-display);display:grid;place-items:center;flex:none}
.info.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.infobox{background:var(--soft);border-left:3px solid var(--accent-fg);padding:10px 12px;font-size:13.5px;line-height:1.45}
.infobox p{margin:0 0 6px}.infobox p:last-child{margin-bottom:0}
.infobox ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.note{font-size:13px;line-height:1.4;background:var(--pr-soft);border-left:3px solid var(--pr);padding:8px 10px}
.cnt{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);padding:2px 7px;letter-spacing:0;text-transform:none;vertical-align:3px}
.empty{text-align:center;padding:26px 14px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.syncnote{text-align:center;font-size:12px;color:var(--muted)}

/* ---------- Start ---------- */
.home{display:flex;flex-direction:column;gap:16px}
.grp{display:flex;flex-direction:column;gap:8px}
.hero{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:116px;padding:18px 18px 18px 20px;border:0;overflow:hidden;
  background:var(--accent);color:var(--accent-ink);text-align:left;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.hero::after{content:"";position:absolute;top:0;bottom:0;right:0;width:42%;pointer-events:none;
  background-image:repeating-linear-gradient(45deg,var(--knurl) 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,var(--knurl) 0 1px,transparent 1px 7px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%)}
.hero > *{position:relative;z-index:1}
.hero > svg:first-child{width:46px;height:46px;flex:none}
.hero > svg:last-child{width:26px;height:26px;flex:none}
.hero-t{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.hero-t b{font-family:var(--f-display);font-size:clamp(25px,7.6vw,31px);font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.hero-t span{font-size:13.5px;opacity:.88}
.hero:active{filter:brightness(.88)}
.hero:focus-visible{clip-path:none}
.quick{display:flex;flex-direction:column;gap:8px}
.qchips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;
  margin-inline:calc(-1 * var(--bleed));padding-inline:var(--bleed);scroll-padding-inline:var(--bleed)}
.qchips::-webkit-scrollbar{display:none}
.qchip{flex:none;scroll-snap-align:start;white-space:nowrap;max-width:72vw;overflow:hidden;text-overflow:ellipsis;min-height:42px;padding:0 14px;
  border:1px solid var(--accent-fg);background:var(--surface);color:var(--accent-fg);font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.qchip:active{background:var(--accent-soft)}
.qchip.qempty{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line-2);color:var(--muted);background:transparent;font-size:14px}
.qchip.qempty svg{width:15px;height:15px;flex:none}
.goalcard{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.goalcard:active{background:var(--soft)}
.goalcard b{font-family:var(--f-display);font-size:25px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.goalcard.met{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.goalcard.met b{color:var(--good)}
.gc-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.gc-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.gc-link{font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-fg)}
.gdots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:120px}
.gdots i{display:block;width:14px;height:14px;border:2px solid var(--line-2)}
.gdots i.on{background:var(--accent);border-color:var(--accent)}
.goalcard.met .gdots i.on{background:var(--good);border-color:var(--good)}
.navlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line)}
.navrow{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left}
.navrow:first-child{border-top:0}
.navrow:active{background:var(--press)}
.navrow > svg:first-child{width:24px;height:24px;flex:none;color:var(--accent-fg)}
.navrow > svg:last-child{width:18px;height:18px;flex:none;color:var(--muted)}
.nr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nr-t b{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.nr-t span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nr-tag{flex:none;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-fg);border:1px solid var(--accent-fg);padding:3px 7px}

/* ---------- Training ---------- */
.setup{gap:16px}
.feel{display:flex;gap:6px}
.feel button{flex:1;min-height:52px;border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px 0}
.feel button b{font-family:var(--f-display);font-size:20px;font-weight:800}
.feel button span{font-size:11px;color:var(--muted)}
.feel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.feel button[aria-pressed="true"] span{color:var(--accent-ink)}
.restset{display:flex;align-items:center;gap:12px}
.restset .rs-l{flex:1;min-width:0;display:flex;flex-direction:column}
.restset .rs-l b{font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.goalc{display:flex;align-items:center;gap:8px;margin-top:4px}
.goalc b{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}
.goalc .nudge{min-height:36px;width:36px}
.restset .goalc{margin-top:0}
.restset .goalc b{font-size:22px;min-width:42px;text-align:center}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--bleed));padding-inline:var(--bleed)}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;min-height:36px;padding:0 12px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);
  font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.step.done{color:var(--good);border-color:var(--good)}
.step.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.add{border-style:dashed;color:var(--accent-fg)}
.step.add.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-style:solid}
.ex{display:flex;flex-direction:column;gap:12px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-head h3{font-size:27px;font-weight:800}
.ex-head .eyebrow{display:block;margin-bottom:3px}
.ex.alldone h3 .cnt{background:var(--good);color:var(--surface)}
.last{font-size:12.5px;color:var(--muted);margin-top:4px}
.pred{display:block;font-size:12.5px;color:var(--muted);padding-left:38px;margin-top:-2px;font-variant-numeric:tabular-nums}
.pred b{color:var(--accent-fg);font-weight:700}
.pred.top b{color:var(--pr)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;gap:6px;align-items:center}
.set-head{display:grid;gap:6px;font-family:var(--f-display);font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.set-head > span:nth-child(n+2){text-align:center}
.set .x{text-align:center;color:var(--muted)}
.set.kraft,.set-head.kraft{grid-template-columns:34px minmax(0,1.15fr) 10px minmax(0,1fr);gap:4px}
.set.one,.set-head.one{grid-template-columns:34px minmax(0,1fr);gap:6px}
.set.timer,.set-head.timer{grid-template-columns:34px minmax(0,1fr) 46px 32px;gap:4px}
.set.dist{grid-template-columns:34px minmax(0,1fr) 46px 32px;gap:6px 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.set.dist .dkm{grid-column:2 / 5}
.set-head.dist{grid-template-columns:34px minmax(0,1fr);gap:4px}
.chk{width:34px;height:34px;padding:0;border:2px solid var(--line-2);background:var(--surface);color:var(--muted);font-family:var(--f-display);font-weight:800;font-size:17px;display:grid;place-items:center;flex:none}
.chk:active{background:var(--soft)}
.chk.on{background:var(--good);border-color:var(--good);color:var(--surface);font-size:19px}
.set.done .wh,.set.done .tdisp{border-color:color-mix(in srgb,var(--good) 55%,var(--line));background:color-mix(in srgb,var(--good) 9%,var(--field))}
.set.done button:disabled,.set.done select:disabled{opacity:.5;cursor:default}
.set.done .tdisp:disabled{opacity:.75}
.tdisp{min-height:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);background:var(--field);
  font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.02em}
button.tdisp{width:100%;min-width:0;padding:0 4px;color:inherit;cursor:pointer}
.set .tdisp{font-size:21px}
.set.dist .tdisp{font-size:19px}
.tdisp.run{border-color:var(--accent-fg);color:var(--accent-fg)}
button.tdisp.edit{border-color:var(--accent-fg);box-shadow:inset 0 0 0 1px var(--accent-fg)}
.tbtn{min-height:42px;padding:0;border:0;background:var(--accent);color:var(--accent-ink);font-size:16px}
.tbtn:active{filter:brightness(.86)}
.tbtn.stop{background:var(--bad);color:var(--surface)}
.tedit{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px;background:var(--soft);padding:10px}
.te-row{display:flex;align-items:flex-end;justify-content:center;gap:6px}
.te-row b{font-family:var(--f-display);font-size:24px;padding-bottom:8px}
.te-f{display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.te-f select{font-size:18px}
.te-btns{display:flex;justify-content:flex-end;gap:8px}
.setbtns{display:flex;gap:8px}
.stepnav{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.stepnav .btn{min-height:50px}
.stepnav .grow{flex:1;min-width:0;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:48px}
.stepnav .btn.ghost{width:52px;padding:0;font-size:22px}
.endstep h3{font-size:26px;margin-top:2px}
.durbox{display:flex;flex-direction:column;gap:8px}
.tbtn-tile{text-align:left;font:inherit;color:inherit;cursor:pointer}
.tbtn-tile:active{background:var(--soft)}
.tbtn-tile.on{border-color:var(--accent-fg);border-top-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-fg)}
.hdr-live{position:relative;margin-left:auto;flex:0 1 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px;min-width:0;max-width:60%;
  text-align:right;line-height:1.25;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-right:4px solid var(--accent);padding:5px 26px 5px 10px}
.hdr-live:active{background:var(--soft)}
.hdr-live .hl-1{max-width:100%;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-live .hl-2{max-width:100%;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-live .hl-pen{position:absolute;right:7px;top:50%;width:13px;height:13px;margin-top:-6.5px;color:var(--muted)}

/* Pausentimer: Leiste direkt über der Tab-Leiste */
.restbar{background:var(--accent);color:var(--accent-ink)}
.rb-prog{height:4px;background:color-mix(in srgb,currentColor 22%,transparent)}
.rb-prog i{display:block;height:100%;width:100%;background:currentColor;transition:width .2s linear}
.rb-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px 10px;padding-left:var(--gl);padding-right:var(--gr)}
.rb-l{display:flex;flex-direction:column;line-height:1}
.rb-l .eyebrow{color:inherit;opacity:.8}
.rb-l b{font-family:var(--f-display);font-size:38px;font-weight:800;margin-top:2px}
.rb-btns{display:flex;gap:6px}
.restbar .btn{background:transparent;color:inherit;border-color:color-mix(in srgb,currentColor 45%,transparent);min-width:44px;padding:0 10px}
.restbar .btn:active{background:color-mix(in srgb,currentColor 14%,transparent)}
.restbar .btn.primary{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--accent)}
.restbar.over{background:var(--good);color:var(--surface)}
.restbar.over .rb-prog i{background:transparent}
.restbar.over .btn.primary{background:var(--surface);border-color:var(--surface);color:var(--good)}

/* ---------- Verlauf ---------- */
.goalbox{cursor:pointer;display:flex;flex-direction:column;gap:10px}
.goalbox:active{background:var(--soft)}
.gb-lbl{display:inline-flex;align-items:center;gap:8px}
.gb-cal{display:inline-grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--accent-fg);color:var(--accent-fg);transition:background .15s,color .15s}
.gb-cal svg{width:15px;height:15px}
.gb-cal.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal{gap:12px}
.cal-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.goal-stat{display:flex;flex-direction:column;align-items:flex-end}
.goal-stat b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1}
.cal-nav{display:flex;align-items:center;justify-content:space-between}
.cal-nav b{font-family:var(--f-display);font-size:20px;font-weight:800;text-transform:uppercase}
.cal-nav .iconbtn{font-size:22px;color:var(--ink);border-color:var(--line-2)}
.cal-nav .iconbtn:disabled{opacity:.3}
.cw{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:3px;align-items:center;padding:2px}
.cw.met{background:color-mix(in srgb,var(--good) 16%,transparent)}
.cw.head{padding-block:0}
.kw{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.kw b{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.kw span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cw.met .kw b,.cw.met .kw span{color:var(--good)}
.cw.met .kw span{font-weight:800;font-size:13px}
.cd{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.cd.h{aspect-ratio:auto;font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cd.out{opacity:.35}
.cd.tr span{display:grid;place-items:center;width:30px;height:30px;max-width:100%;background:var(--accent);color:var(--accent-ink);font-weight:700}
.cw.met .cd.tr span{background:var(--good);color:var(--surface)}
.cd.today span{display:grid;place-items:center;width:30px;height:30px;max-width:100%;outline:2px solid var(--ink);outline-offset:1px}
.fold{background:var(--surface);border:1px solid var(--line)}
.fold-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:0 16px;border:0;background:none;color:var(--ink);text-align:left;
  font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.fold-h:active{background:var(--press)}
.fold-h .cnt{margin-left:6px}
.fold-h .chev{width:22px;height:22px;flex:none;color:var(--muted);transition:transform .15s}
.fold-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fold-b{padding:12px 16px 16px;border-top:1px solid var(--line)}
.fold-stack{display:flex;flex-direction:column;gap:22px}
.fold-stack .card{border:0;padding:0;background:none}
.scr > .fold + .fold{margin-top:-17px}
.nf-h{display:flex;flex-direction:column;min-width:0}
.nf-h small{font-family:var(--f-body);font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.fold-b.sesslist{display:flex;flex-direction:column;padding:0}
.sesslist .hint{padding:10px 16px}
.hist-month{position:sticky;top:0;z-index:1;padding:7px 16px;background:var(--soft);border-top:1px solid var(--line);
  font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sess{position:relative;display:flex;gap:14px;align-items:center;width:100%;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;transition:background .15s}
.sess:active{background:var(--soft)}
.sess.sel{background:var(--accent-soft)}
.sess .day{flex:none;align-self:stretch;width:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px solid var(--ink);padding-right:12px}
.sess .day b{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1}
.sess .day span{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sess .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.sess .line{font-size:13.5px;overflow-wrap:anywhere}
.sess .line b{font-weight:600}
.sess .meta{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.spen{position:absolute;right:16px;top:50%;width:44px;height:44px;margin-top:-22px;padding:0;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  opacity:0;transform:translateX(12px);pointer-events:none;transition:opacity .16s ease,transform .2s ease}
.spen svg{width:20px;height:20px;flex:none}
.sess.sel .spen{opacity:1;transform:none;pointer-events:auto}
.warnchip{color:var(--bad);font-weight:700}

/* ---------- Fortschritt und Analyse ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{min-width:0;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);padding:10px 12px 12px}
.tile .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .v small{font-size:16px;color:var(--muted);font-weight:600;margin-left:2px}
.tile .k{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.3}
.tiles.t3 .tile .v{font-size:27px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:10.5px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent-fg);stroke-width:2.4;stroke-linejoin:miter;stroke-linecap:square}
.chart .ar{fill:var(--accent-fg);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent-fg);stroke-width:1.8}
.chart .end{fill:var(--accent-fg)}
.chart .pr{fill:var(--pr);stroke:var(--surface);stroke-width:1.5}
.chart .bar{fill:var(--accent)}
.chart .bar.cur,.chart .bar2{fill:var(--pr)}
.chart .dt{fill:var(--accent-fg);opacity:.35}
.chart .lbl{fill:var(--ink);font-weight:700}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.legend .lg-k{background:var(--accent)}
.legend .lg-a{background:var(--pr)}
.legend .lg-dt{background:var(--accent-fg);opacity:.4}
.legend .lg-ln{background:var(--accent-fg);height:3px;vertical-align:3px}
.prog-list{display:flex;flex-direction:column}
.prog-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prog-item:last-child{border-bottom:0}
.pill{font-size:12.5px;font-weight:700;padding:3px 8px;background:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.up{background:color-mix(in srgb,var(--good) 18%,transparent)}
.pill.down{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.prbadge{display:inline-block;margin-left:8px;padding:1px 5px;border:1px solid var(--pr);color:var(--pr);font-family:var(--f-body);font-size:10.5px;font-weight:800;letter-spacing:.06em;vertical-align:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{padding:8px 10px;background:var(--soft);color:var(--muted);text-align:left;white-space:nowrap;font-family:var(--f-display);font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{white-space:nowrap;color:var(--muted)}
.tbl .r{text-align:right;white-space:nowrap}
.tbl tr.pr td{background:color-mix(in srgb,var(--pr) 11%,transparent)}
.tbl .star{color:var(--pr)}
.ana-nav{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.kv{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.kv b{font-family:var(--f-display);font-size:42px;font-weight:800;line-height:1}
.kv small{font-size:13px;font-weight:600;color:var(--muted)}
.status{font-size:14px;font-weight:700}
.status.low{color:var(--muted)}.status.ok{color:var(--good)}.status.mid{color:var(--pr)}.status.high{color:var(--bad)}
.gauge-w{position:relative;padding:4px 0 18px}
.gauge{display:flex;gap:2px;height:10px;overflow:hidden}
.gauge i{display:block;height:100%}
.g-low{background:color-mix(in srgb,var(--muted) 30%,var(--soft))}
.g-ok{background:color-mix(in srgb,var(--good) 60%,var(--soft))}
.g-mid{background:color-mix(in srgb,var(--pr) 65%,var(--soft))}
.g-high{background:color-mix(in srgb,var(--bad) 60%,var(--soft))}
.gauge-mk{position:absolute;top:0;width:4px;height:18px;margin-left:-2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.gauge-lb span{position:absolute;top:22px;transform:translateX(-50%);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hm{display:grid;gap:2px;align-items:center}
.hm + .hm{margin-top:10px}
.hm span{font-size:9px;line-height:1.1;color:var(--muted);white-space:nowrap;overflow:visible;min-width:0}
.hm i,.hm-leg i{display:block;aspect-ratio:1;background:var(--soft)}
.hm i.l1,.hm-leg i.l1{background:color-mix(in srgb,var(--accent-fg) 30%,var(--soft))}
.hm i.l2,.hm-leg i.l2{background:color-mix(in srgb,var(--accent-fg) 55%,var(--soft))}
.hm i.l3,.hm-leg i.l3{background:color-mix(in srgb,var(--accent-fg) 80%,var(--soft))}
.hm i.l4,.hm-leg i.l4{background:var(--accent-fg)}
.hm i.f{background:transparent}
.hm i.td{box-shadow:0 0 0 1.5px var(--ink)}
.hm-leg{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.hm-leg i{width:10px;height:10px;display:inline-block}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:92px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px}
.hbar > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{position:relative;height:12px;background:var(--soft);overflow:hidden}
.hbar .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 28%,transparent)}
.hbar .fill{position:absolute;left:0;top:0;bottom:0}
.hbar .fill.lo{background:color-mix(in srgb,var(--accent-fg) 70%,var(--soft))}
.hbar .fill.ok{background:var(--good)}
.hbar .fill.hi{background:var(--pr)}
.hbar .v{text-align:right;font-weight:700}
.recs{display:flex;flex-direction:column}
.rec{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec:first-child{padding-top:0}
.rec:last-child{border-bottom:0;padding-bottom:0}
.rec-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rec-c{min-width:0}
.rec-c b{display:block;font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-c b small{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted)}
.rec-c span{display:block;font-size:11.5px;line-height:1.3;color:var(--muted)}
.warnbox{border-color:var(--bad);border-top-width:3px}
.warnbox > div > b{color:var(--bad)}
.hintbox{border-color:var(--pr);border-top-width:3px}
.iss-btns{display:flex;flex-direction:column;gap:6px;flex:none}
.trend.up{color:var(--good)}
.trend.down{color:var(--bad)}

/* ---------- Pläne und Übungen ---------- */
.plan > .btn.primary{min-height:48px}
.pl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pl li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.pl li:last-child{border-bottom:0}
.plist{display:flex;flex-direction:column}
.pitem{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pitem .nm{flex:1;min-width:0}.pitem .nm b{display:block;overflow-wrap:anywhere}
.pmove{display:flex;flex-direction:column}.pmove .iconbtn{height:24px;width:28px}.pmove .iconbtn:disabled{opacity:.25}
.pitem .goalc{margin-top:0;gap:6px}.pitem .goalc b{font-size:22px;min-width:18px;text-align:center}
.pitem .nudge{width:30px;min-height:34px}
.bmk{flex:none;width:40px;height:40px;padding:0;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.bmk svg{width:20px;height:20px;fill:none}
.bmk.on{color:var(--pr);border-color:var(--pr);background:var(--pr-soft)}
.bmk.on svg{fill:currentColor}
.exlist{display:flex;flex-direction:column}
.exrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .nm{flex:1;min-width:0}
.exrow .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.exrow .nm span{display:block;font-size:12.5px;color:var(--muted)}
.exrow.edit{flex-direction:column;align-items:stretch;gap:10px}
.catgrp + .catgrp{margin-top:16px}
.cat-h{display:flex;align-items:center;gap:6px;padding-bottom:5px;border-bottom:2px solid var(--accent);color:var(--accent-fg);
  font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

/* ---------- Ernährung ---------- */
.m-kh{--m:var(--m-kh)} .m-ei{--m:var(--m-ei)} .m-fe{--m:var(--m-fe)}
.nk-v{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin-top:4px}
.nk-v b{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:.95}
.nk-v small{font-size:14px;font-weight:600;color:var(--muted)}
.mbar{display:flex;gap:2px;height:12px;overflow:hidden}
.mbar i{display:block;min-width:0;background:var(--m)}
.mbar.mini{width:76px;height:8px;flex:none}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto auto auto;column-gap:10px}
.mac{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:3px;align-content:start;min-width:0;border-top:4px solid var(--m);padding-top:8px}
.mac b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.mac b small{font-size:15px;color:var(--muted);font-weight:600;margin-left:2px}
.mac-n{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nswap{display:flex;flex-direction:column;gap:10px;cursor:pointer}
.nsw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line-2);background:var(--surface)}
.nsw button{min-height:36px;padding:0 4px;border:0;background:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s;
  font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.nsw button + button{border-left:1px solid var(--line-2)}
.nsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nwhy{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.nwhy b{color:var(--ink);font-weight:600}
.irow{display:flex;flex-wrap:wrap;gap:8px 16px;border-top:1px solid var(--line);padding-top:10px}
.ichip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.iboxes{display:flex;flex-direction:column;gap:6px}
.iboxes:empty{display:none}
.nl li > span:first-child{display:flex;flex-direction:column;min-width:0}
.nl li > span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.nl small{font-size:12px;color:var(--muted)}
.nl li.tot{font-weight:700;border-bottom:2px solid var(--ink)}
.nl li.sum{font-weight:800;font-size:15px}
.ntbl{font-size:13px}
.ntbl th,.ntbl td{padding:8px 6px}
.ntbl th{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:12px;vertical-align:bottom}
.ntbl td:first-child{white-space:normal;hyphens:manual}
.ntbl th:first-child,.ntbl td:first-child{padding-left:10px}
.ntbl th:last-child,.ntbl td:last-child{padding-right:10px}
.ntbl th span{display:block;font-size:11px;font-weight:500}
.ntbl .hl{background:color-mix(in srgb,var(--accent-fg) 9%,transparent)}
.ntbl th.hl{background:color-mix(in srgb,var(--accent-fg) 16%,var(--soft))}
.ntbl tr.kc td{font-weight:700;color:var(--ink)}
.ntbl td:first-child i{display:inline-block;width:8px;height:8px;background:var(--m);margin-right:6px;vertical-align:1px}

/* ---------- Heute und die Lebensbereiche ---------- */
.scr > .navlist{margin-inline:calc(-1 * var(--bleed));border-inline-width:0}
.grp > .card{margin-inline:calc(-1 * var(--bleed));padding-inline:var(--bleed);border-inline-width:0}
@media (min-width:600px){.scr > .navlist,.grp > .card{border-inline-width:1px}}
.hdr-nav{display:flex;gap:6px;flex:none}
.back:disabled{opacity:.3;cursor:default}
.pane{display:flex;flex-direction:column;gap:12px}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
.pane-h .eyebrow{display:flex;align-items:center;gap:7px}
.pane-h .eyebrow .cnt{vertical-align:0}
.pane > .btn.small{align-self:flex-start}
.lnk{flex:none;border:0;background:none;padding:6px 0;margin:-6px 0;color:var(--accent-fg);text-align:right;
  font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.lnk:active{opacity:.6}
.hr-l .lnk{align-self:flex-start;text-align:left;margin:0;padding:4px 0 0;font-size:13px}
.lnk-bad{color:var(--bad)}

/* Check-in */
.ci-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ci-l{display:flex;flex-direction:column;gap:1px;min-width:0}
.ci-l b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.ci-row .goalc{margin-top:0;gap:5px;flex:none}
.ci-row .nudge{width:40px;min-height:44px}
button.val{min-width:88px;min-height:44px;padding:0 8px;border:1px solid var(--line-2);background:var(--field);color:var(--ink);
  font-family:var(--f-display);font-size:25px;font-weight:800;line-height:1}
button.val small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
button.val.ph{color:var(--muted);border-style:dashed;background:transparent}
button.val:active{background:var(--soft)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.scale button{min-width:0;min-height:52px;padding:4px 0;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.scale button b{font-family:var(--f-display);font-size:20px;font-weight:800}
.scale button span{max-width:100%;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--muted)}
.scale button:active{background:var(--press)}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale button[aria-pressed="true"] span{color:var(--accent-ink)}

/* Gewohnheiten */
.hlist{display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0;padding-top:0}
.hrow:last-child{padding-bottom:0}
.hr-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hr-l b{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.hr-l > span{font-size:12.5px;color:var(--muted)}
.hrow.done .hr-l b{color:var(--good)}
.hchk{flex:none;width:44px;height:44px;padding:0;border:2px solid var(--line-2);background:var(--surface);color:transparent;display:grid;place-items:center}
.hchk svg{width:24px;height:24px}
.hchk:active{background:var(--soft)}
.hchk.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.hsq{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.hsq i{display:block;width:13px;height:13px;border:1.5px solid var(--line-2)}
.hsq i.on{background:var(--accent);border-color:var(--accent)}
.hrow.done .hsq i.on{background:var(--good);border-color:var(--good)}
.pbar{height:8px;background:var(--soft);overflow:hidden;margin-top:2px}
.pbar i{display:block;height:100%;background:var(--accent)}
.hrow.done .pbar i,.gitem.done .pbar i{background:var(--good)}
.pbar.over i{background:var(--pr)}
.hamt{flex:none;display:flex;align-items:center;gap:4px}
.hamt .nudge{width:40px;min-height:44px}
.nudge.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nudge.plus:active{background:var(--accent);filter:brightness(.86)}
input.hin{width:56px;min-width:0;min-height:44px;padding:4px;border:1px solid var(--line-2);background:var(--field);color:var(--ink);
  font-family:var(--f-display);font-size:21px;font-weight:700;text-align:center;-webkit-appearance:none;appearance:none}
input.hin::placeholder{color:var(--muted);opacity:.75}
input.hin:focus{outline:none;border-color:var(--accent-fg);box-shadow:inset 0 0 0 1px var(--accent-fg)}
input.hin.wv{width:84px}
.qcount{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.qcount b{font-family:var(--f-display);font-size:34px;font-weight:800}
.qcount span{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{min-height:38px;padding:0 12px;border:1px dashed var(--accent-fg);background:transparent;color:var(--accent-fg);
  font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sugg button:active{background:var(--accent-soft)}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wdays button{min-width:0;min-height:40px;padding:0;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);
  font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.wdays button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tdone{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:4px solid var(--good)}
.tdone b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}

/* Ziele */
.glist{display:flex;flex-direction:column}
.gitem{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.gitem:first-child{border-top:0;padding-top:0}
.gitem:last-child{padding-bottom:0}
.gitem .pbar{height:10px}
.goal-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal-h b{font-weight:700;overflow-wrap:anywhere}
.goal-h .num{flex:none;font-family:var(--f-display);font-size:21px;font-weight:800}
.gitem.done .goal-h .num{color:var(--good)}
.goal-n{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.goal-up{display:flex;align-items:center;justify-content:space-between;gap:10px}
.goal-up .hin{width:96px}
.goal-cur{display:flex;align-items:center;gap:8px}
.goal-up .lnk{margin-left:auto}

/* Notizen und Formulare */
textarea.in.jnote{min-height:84px;font-family:var(--f-body);font-size:16px;line-height:1.45;resize:vertical}
.chkrow{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14.5px;font-weight:600}
.chkrow input{width:22px;height:22px;margin:0;accent-color:var(--accent)}

/* Ernährungstagebuch */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.daynav b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.daynav .iconbtn{width:46px;height:42px;font-size:22px;color:var(--ink);border-color:var(--line-2);background:var(--surface)}
.daynav .iconbtn:disabled{opacity:.3}
.kc-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px}
.kc-big b{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:.95}
.kc-big span{font-size:13.5px;font-weight:600;color:var(--muted)}
.mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mcell{min-width:0;display:flex;flex-direction:column;gap:3px;border-top:4px solid var(--m);padding-top:7px}
.mcell b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.mcell b small{font-size:13px;color:var(--muted);font-weight:600}
.mcell .pbar i{background:var(--m)}
.flist{display:flex;flex-direction:column}
.frow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left}
.flist > :first-child{border-top:0;padding-top:0}
button.frow:active{background:var(--press)}
.frow .ft{flex:none;width:40px;font-size:12.5px;color:var(--muted)}
.frow .fn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.frow .fn b{font-weight:600;overflow-wrap:anywhere}
.frow .fn span{font-size:12px;color:var(--muted)}
.frow .fk{flex:none;font-family:var(--f-display);font-size:21px;font-weight:800}
.frow.fav{padding-block:2px}
.frow.fav .fn{border:0;background:none;color:inherit;text-align:left;padding:8px 0}
.fedit{display:flex;flex-direction:column;gap:10px;padding:12px;margin-block:4px;background:var(--soft);border-left:3px solid var(--accent)}
.flist > .fedit:first-child{margin-top:0}
.f4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.f4 label{display:flex;flex-direction:column;gap:4px;min-width:0;font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.f4 .in{min-width:0;padding:6px 4px;text-align:center}
.fedit .row > *{flex:1 1 auto}
.qchip.fchip{max-width:82vw}
.photo-prev{display:block;width:100%;max-height:320px;object-fit:cover;border:1px solid var(--line);margin-bottom:6px}
.filebtn{cursor:pointer}
.busy-btn{opacity:.6;pointer-events:none}
.busy{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 6px 0 14px;border:1px solid var(--line-2);background:var(--surface)}
.busy > span{flex:1;font-weight:600}
.busy > i{flex:none;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent-fg);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mres{border-top:3px solid var(--accent)}

/* Körper */
.meas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.meas .field:last-child:nth-child(odd){grid-column:1 / -1}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.pgrid button{position:relative;padding:0;border:0;aspect-ratio:3 / 4;background:var(--soft);overflow:hidden}
.pgrid img{display:block;width:100%;height:100%;object-fit:cover}
.pgrid span{position:absolute;left:0;bottom:0;padding:2px 6px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700}
img.broken{visibility:hidden}
.pcomp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pcomp figure{margin:0;display:flex;flex-direction:column;gap:4px}
.pcomp img{display:block;width:100%;aspect-ratio:3 / 4;object-fit:cover;background:var(--soft)}
.pcomp figcaption{font-size:12px;color:var(--muted);text-align:center}
#overlayHost:empty{display:none}
.light{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#050806;color:#fff;
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.light-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.light-h b{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.light .iconbtn{width:44px;height:44px;color:#fff;border-color:rgba(255,255,255,.45);font-size:20px}
.light img{flex:1;min-height:0;width:100%;object-fit:contain}
.light-f{display:flex;justify-content:center;min-height:46px;padding-top:10px}
.light .btn.danger{color:#FF8A75;border-color:#FF8A75}

/* Journal und Atemübung */
.jlist{display:flex;flex-direction:column}
.jitem{padding:10px 0;border-top:1px solid var(--line)}
.jitem:first-child{border-top:0;padding-top:0}
.jh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.jh b{font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.jitem p{margin:4px 0 0;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.brpick{display:flex;flex-direction:column;gap:6px}
.brp{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:12px 14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);text-align:left}
.brp b{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.brp span{font-size:13px;color:var(--muted)}
.brp:active{background:var(--press)}
.brp.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 5px 0 0 var(--accent)}
.br-wrap{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.br-stage{width:min(70vw,280px);aspect-ratio:1;margin:6px auto 0;display:grid;place-items:center;border:1px dashed var(--line-2)}
.br-sq{width:100%;height:100%;background:var(--accent);transform:scale(.32);will-change:transform}
.br-ph{text-align:center;font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.br-cnt{text-align:center;font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;color:var(--accent-fg)}

/* Fortschritt */
.banner.ok{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:var(--good)}
.fchips{margin-inline:calc(-1 * var(--bleed));padding-inline:var(--bleed)}
.tiles.fit > .tile:last-child:nth-child(odd){grid-column:1 / -1}
.tile .dlt{display:block;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.inss{display:flex;flex-direction:column}
.ins{display:flex;flex-direction:column;gap:7px;padding:12px 0;border-top:1px solid var(--line)}
.ins:first-child{border-top:0;padding-top:0}
.ins > b{font-weight:700}
.ins-b{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:12.5px}
.ins-b > span:not(.ins-t){color:var(--muted);white-space:nowrap}
.ins-t{height:12px;background:var(--soft);overflow:hidden}
.ins-t i{display:block;height:100%;background:var(--accent)}
.ins-t.b i{background:var(--line-2)}
.ins-b > b{font-family:var(--f-display);font-size:17px;font-weight:800;text-align:right;white-space:nowrap}
.hgrid2{display:grid;gap:3px}
.hgrid2 i{display:block;aspect-ratio:1;background:var(--soft)}
.hgrid2 i.on{background:var(--good)}
.hgrid2 i.part{background:color-mix(in srgb,var(--good) 40%,var(--soft))}
.hgrid2 i.na{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hgrid2 i.td{outline:1.5px solid var(--ink);outline-offset:1px}

function exNorm(s){return String(s||'').toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss').replace(/[^a-z]/g,'').replace(/(en|es|e|n|s)$/,'')}
function exParts(n){const m=String(n||'').match(/^(.*?)\(([^)]*)\)\s*$/);return m?[exNorm(m[1]),exNorm(m[2])]:[exNorm(n),'']}

/* Welche Standardübung meint eine eigene Übung? Gleiche Art der Werte vorausgesetzt.
   „Bizeps Curls“ ohne Gerät = die übliche Variante, „Bizeps Curls (Kabel)“ = die Kabelzug-Variante. */
function libMatch(x,lib,cover){const ok=lib.filter(c=>!cover.has(c.id)&&c.kind===x.kind);if(!ok.length)return null;
  const full=exNorm(x.name),hit=ok.find(c=>exNorm(c.name)===full);if(hit)return hit;
  const [xb,xv]=exParts(x.name),fam=ok.filter(c=>exParts(c.name)[0]===xb);
  if(fam.length){if(!xv)return fam.find(c=>!exParts(c.name)[1])||fam[0];
    const v=fam.find(c=>varOk(xv,exParts(c.name)[1]));if(v)return v;
    return fam.length===1&&!exParts(fam[0].name)[1]&&lib.filter(c=>exParts(c.name)[0]===xb).length===1?fam[0]:null}
  /* Anderer Name („Latziehen“ = Latzug, „Plank“ = Unterarmstütz): nur wenn genau eine Standardübung passt */
  const syn=ok.filter(c=>(LIB_SYN[libId(c.id)]||'').split(',').some(w=>w&&exNorm(w)===full));
  return syn.length===1?syn[0]:null}
/* Einmal pro Katalog-Version: fehlende Standardübungen ergänzen. Gelöschte kommen danach nicht wieder.
   Eigene Übungen und alle Einträge bleiben, wie sie sind. Nur ein fehlender MET-Wert wird ergänzt. */
function exLibUp(){if(num(S.libV)>=EX_LIB_V)return;if(!Array.isArray(S.exercises))S.exercises=[];
  const L=S.exercises,lib=libAll(),cover=new Set(),done=new Set(),lc=s=>String(s||'').trim().toLowerCase(),hasName=(n,not)=>L.some(e=>e&&e!==not&&lc(e.name)===lc(n));
  /* Vorlagen e1–e5, solange sie noch so heißen wie früher: Name mit Gerät, MET-Wert mit Quelle */
  for(const c of lib){const old=LIB_OLD[c.id];if(!old)continue;const x=L.find(e=>e&&e.id===c.id);
    if(!x||x.kind!==c.kind||(x.name!==old&&x.name!==c.name))continue;
    if(x.name===old&&!hasName(c.name,x))x.name=c.name;
    if(c.met&&(x.met===undefined||x.met===LIB_OLDMET[c.id]||num(x.met)===c.met)){x.met=c.met;x.metRef=c.metRef}
    if(!x.cat)x.cat=c.cat;cover.add(c.id);done.add(x.id)}
  /* Eigene Übungen, die einer Standardübung entsprechen: keine zweite anlegen */
  let m=0;for(const x of L){if(!x||done.has(x.id))continue;const c=libMatch(x,lib,cover);if(!c)continue;cover.add(c.id);done.add(x.id);m++;
    if(c.met&&x.met===undefined&&(x.kind!=='distanz'||x.sport==='andere')){x.met=c.met;x.metRef=c.metRef}

  for(const c of lib){if(cover.has(c.id)||gone.has(c.id)||hasName(c.name))continue;if(ids.has(c.id))c.id='k-'+c.id;if(ids.has(c.id))continue;L.push(c);ids.add(c.id);n++}

/* Kalorien: MET × Körpergewicht (kg) × Stunden. Werte aus dem Compendium of Physical Activities 2024.

const MET_DEF={kraft:3.5,wdh:3.8,zeit:3.8,andere:6};

const T_RUN=[[6.6,6.5],[7.3,7.8],[8.2,8.5],[9.1,9],[9.9,9.3],[10.8,10.5],[11.3,11],[12.1,11.8],[12.9,12],[13.8,12.5],[14.5,13],[15.2,14.8],[16.1,14.8],[17.7,16.8],[19.3,18.5],[20.9,19.8],[22.5,23]];
const T_WALK=[[2.4,2.3],[3.5,2.8],[4,3],[5,3.8],[6,4.8],[6.8,5.5],[7.6,7]];
const T_BIKE=[[8.9,3.5],[15.1,5.8],[17.6,6.8],[20.8,8],[24.1,10],[28.2,12],[33,16.8]];
function interp(t,v){if(v<=t[0][0])return t[0][1];for(let i=1;i<t.length;i++){if(v<=t[i][0]){const [x0,y0]=t[i-1],[x1,y1]=t[i];return y0+(y1-y0)*(v-x0)/(x1-x0)}}return t[t.length-1][1]}

function ticks(min,max,n){
  if(min===max){min-=1;max+=1}
  const raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),e=raw/mag;
  const st=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;

  let dots='';pts.forEach((p,i)=>{if(i===bi)return;dots+=mk(i===pts.length-1?'end':'pt',x(i),y(p.v),i===pts.length-1?4:2.8)});

}

/* Wiederholungs-Prognose: Epley umgestellt, Wdh = 30 × (1RM ÷ Gewicht − 1).

function e1rmOf(sets){let m=0;for(const st of sets||[]){const w=num(st.a),r=num(st.b);if(w>0&&r>0){const e=r===1?w:w*(1+r/30);if(e>m)m=e}}return m}
function curRm(exId,d){
  const ref=dayN(d&&d.date?d.date:today());let m=0,old=false;
  for(const x of S.sessions){if(d&&x.id===d.id)continue;const dd=ref-dayN(x.date);if(dd<0||dd>42)continue;
    for(const en of x.entries)if(en.exId===exId)m=Math.max(m,e1rmOf(en.sets))}
  if(d)for(const en of d.entries)if(en.exId===exId)m=Math.max(m,e1rmOf(en.sets.filter(st=>st.done)));

    for(let i=0;i<7;i++){const d=new Date(w);d.setDate(d.getDate()+i);const k=ymd(d);
      const out=d.getMonth()!==first.getMonth();

    rows+=`<div class="cw${met?' met':''}"><div class="kw"><b>KW ${isoWeek(w)}</b><span>${met?'✓':cnt+'/'+goal}</span></div>${cells}</div>`;
  }
  const cw=ymd(monday(now));const cc=wd[cw]?wd[cw].size:0;
  let streak=0;const m=monday(now);if(!((wd[cw]?wd[cw].size:0)>=goal))m.setDate(m.getDate()-7);
  while(wd[ymd(m)]&&wd[ymd(m)].size>=goal){streak++;m.setDate(m.getDate()-7)}
  const head=`<div class="card goalbox" data-act="calToggle" role="button" tabindex="0" aria-expanded="${!!openFold.cal}" aria-label="Kalender ${openFold.cal?'ausblenden':'anzeigen'}">
    <div class="cal-top"><div class="goal"><span class="eyebrow gb-lbl">Wochenziel<span class="gb-cal${openFold.cal?' on':''}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span></span>
      <div class="goalc"><button class="nudge" data-act="goal" data-d="-1" aria-label="Ziel verringern">−</button><b class="num">${goal}× </b><span class="small muted">pro Woche</span><button class="nudge" data-act="goal" data-d="1" aria-label="Ziel erhöhen">+</button></div></div>
      <div class="goal-stat"><b class="num">${Math.min(cc,goal)}/${goal}</b><span class="small muted">diese Woche</span></div></div></div>`;
  if(!openFold.cal)return head;
  return head+`<div class="card section cal">
    <div class="cal-nav"><button class="iconbtn" data-act="cal" data-d="-1" aria-label="Voriger Monat">‹</button><b>${MON[first.getMonth()]} ${first.getFullYear()}</b><button class="iconbtn" data-act="cal" data-d="1" aria-label="Nächster Monat"${calOff>=0?' disabled':''}>›</button></div>
    <div class="cw head"><div></div>${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="cd h">${x}</div>`).join('')}</div>
    ${rows}
    <div class="small muted">${streak?`Ziel ${streak} ${streak===1?'Woche':'Wochen'} in Folge erreicht. `:''}Grüne Woche = Ziel geschafft. Ausgefüllter Kreis = Trainingstag.</div>
  </div>`;
}

/* ---------- Plausibilität: unrealistische Einträge erkennen ---------- */
const DUR_MAX=600;
function bwOk(v){v=num(v);return v>=30&&v<=250}
function isAusd(ex){return !!ex&&(ex.kind==='distanz'||ex.cat==='Ausdauer')}
function durTxt(m){const s=Math.round(m*60);if(s<60)return s+' Sek.';if(s<3600)return Math.floor(s/60)+':'+pad(s%60)+' Min';return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+' Std'}
function absIssue(ex,st){
  if(!ex||!st)return '';
  if(ex.kind==='distanz'){const km=num(st.a),m=setMin(ex,st),sp=ex.sport||'laufen';
    if(km>0&&m>0){const kmh=km/(m/60);const lim=sp==='rad'?(km>=1?70:100):sp==='laufen'?(km>=0.5?25:45):100;
      if(kmh>lim)return `${fmt(km)} km in ${durTxt(m)} (≈ ${fmt(kmh,0)} km/h)`}
    if(m>DUR_MAX)return `${durTxt(m)} für eine Strecke`;
    if(km>(sp==='rad'?500:250))return `${fmt(km)} km am Stück`;
    return ''}
  if(ex.kind==='zeit'){const m=setMin(ex,st);return m>DUR_MAX?`${durTxt(m)} in einem Satz`:''}
  if(ex.kind==='kraft'){if(num(st.a)>500)return `${fmt(num(st.a))} kg in einem Satz`;if(num(st.b)>100)return `${fmt(num(st.b))} Wiederholungen in einem Satz`;return ''}
  if(ex.kind==='wdh')return num(st.a)>300?`${fmt(num(st.a))} Wiederholungen in einem Satz`:'';
  return '';
}
function setIssue(ex,st){if(!ex||!st||st.ok)return '';return absIssue(ex,st)||(relF&&relF.get(st))||''}
/* Vergleich mit deinen eigenen Bestwerten: Kraft über 30 % über dem bisherigen 1RM, Wiederholungen/Zeit über 50 % */
let relF=null;
function relVal(ex,st){if(ex.kind==='kraft'){const w=num(st.a),r=num(st.b);return w>0&&r>0?(r===1?w:w*(1+r/30)):0}if(ex.kind==='wdh')return num(st.a);if(ex.kind==='zeit')return setMin(ex,st);return 0}
function relRefresh(){const m=new WeakMap(),hist={};
  for(const x of sortedSessions()){const upd={},seen=new Set();
    for(const e of x.entries||[]){const ex=exById(e.exId);if(!ex||ex.kind==='distanz')continue;seen.add(ex.id);const h=hist[ex.id]||{best:0,n:0};
      for(const st of e.sets||[]){if(st.ok||absIssue(ex,st))continue;const v=relVal(ex,st);if(!(v>0))continue;
        const kr=ex.kind==='kraft',lim=h.best*(kr?1.3:1.5),gap=ex.kind==='zeit'?1:5;
        if(h.n>=2&&h.best>0&&v>lim&&(kr||v-h.best>=gap)){const pc=Math.round((v/h.best-1)*100);
          m.set(st,kr?`${fmt(num(st.a),2)} kg × ${fmt(num(st.b))} liegt ${pc} % über deinem bisherigen Bestwert (1RM ${fmt(h.best,1)} kg)`
            :ex.kind==='zeit'?`${durTxt(v)} liegt ${pc} % über deinem bisherigen Bestwert (${durTxt(h.best)})`
            :`${fmt(v)} Wdh. liegen ${pc} % über deinem bisherigen Bestwert (${fmt(h.best)})`);continue}
        upd[ex.id]=Math.max(upd[ex.id]||0,v)}}
    for(const id of seen){const h=hist[id]=hist[id]||{best:0,n:0};h.n++;if(upd[id])h.best=Math.max(h.best,upd[id])}}
  relF=m}
function bwUse(x){return num(x.bw)>0&&(bwOk(x.bw)||!!x.ok)}
function cleanSets(ex,sets){return (sets||[]).filter(st=>!setIssue(ex,st))}
function cleanEntry(ex,e){return {...e,sets:cleanSets(ex,e.sets)}}
function durOk(x){const d=num(x.dur);return d>0&&(d<=DUR_MAX||!!x.ok)}
function sessIssues(x){const o=[];
  for(const e of x.entries||[]){const ex=exById(e.exId);if(!ex)continue;for(const st of e.sets||[]){const r=setIssue(ex,st);if(r)o.push(esc(ex.name)+': '+r)}}
  if(!x.ok&&num(x.dur)>DUR_MAX)o.push('Dauer '+durTxt(num(x.dur)));
  if(!x.ok&&x.date>today())o.push('Datum liegt in der Zukunft');
  if(!x.ok&&num(x.bw)&&!bwOk(x.bw))o.push('Körpergewicht '+fmt(num(x.bw))+' kg');
  return o}
function issuesCard(){
  const rows=[];for(const x of sortedSessions().reverse()){const is=sessIssues(x);if(is.length)rows.push({x,is})}
  if(!rows.length)return '';
  return `<div class="card section warnbox"><div><b>${WARN_IC}${rows.length===1?'Ein Training sieht':rows.length+' Trainings sehen'} unrealistisch aus</b>
    <div class="small muted">Diese Werte zählen nicht für Kalorien, Bestwerte und Auswertungen, bis du sie korrigierst oder mit „Stimmt so“ bestätigst.</div></div>
    <div class="plist">${rows.slice(0,8).map(({x,is})=>`<div class="pitem"><div class="nm"><b>${dLong(x.date)}</b><span class="small muted">${is.join(' · ')}</span></div><div class="iss-btns"><button class="btn small" data-act="edit" data-id="${x.id}">Bearbeiten</button><button class="btn small ghost" data-act="okIssue" data-id="${x.id}">Stimmt so</button></div></div>`).join('')}</div></div>`}

/* ---------- Analyse (Analysis-Ansicht) ---------- */
const A_TABS=[['ueb','Übersicht'],['kraft','Kraft'],['ausd','Ausdauer'],['koerper','Körper']];
const A_RANGES=[['4w','4 Wochen'],['3m','3 Monate'],['1j','1 Jahr'],['all','Alles']];
const MON3=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const dayN=s=>{const [y,m,d]=String(s).split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const nDate=n=>{const d=new Date(Math.round(n)*864e5);return d.getUTCDate()+'.'+(d.getUTCMonth()+1)+'.'};
const dmy=s=>{const d=parseD(s);return d.getDate()+'.'+(d.getMonth()+1)+'.'+(d.getFullYear()!==new Date().getFullYear()?String(d.getFullYear()).slice(2):'')};
const dLong=s=>{const d=parseD(s);return WD[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)};
const avgOf=a=>a.length?a.reduce((t,v)=>t+v,0)/a.length:0;
const sgnF=(v,d=1)=>(Math.abs(v)<Math.pow(10,-d)/2?'±':v>0?'+':'−')+fmt(Math.abs(v),d);
const tabTitle=t=>t==='fortschritt'&&perf()?'Analyse':(TABS.find(x=>x[0]===t)||['',''])[1];
const inBk=(b,date)=>date>=b.s&&date<=b.e;
let kcC=null;
function kcd(x){if(!kcC)return sessKcalDetail(x);let v=kcC.get(x);if(!v){v=sessKcalDetail(x);kcC.set(x,v)}return v}
function sessMin(x){return durOk(x)?num(x.dur):Math.round(kcd(x).min||0)}
function paceTxt(p){const s=Math.round(p*60);return Math.floor(s/60)+':'+pad(s%60)}
function weekStreak(){const td=today(),keys=new Set(S.sessions.filter(s=>s.date<=td).map(s=>ymd(monday(parseD(s.date)))));let n=0;const m=monday(parseD(td));if(!keys.has(ymd(m)))m.setDate(m.getDate()-7);while(keys.has(ymd(m))){n++;m.setDate(m.getDate()-7)}return n}
function anaRange(){
  const key=A_RANGES.some(r=>r[0]===S.ui.anaRange)?S.ui.anaRange:'3m';
  const td=today(),now=parseD(td);let start;const bk=[];
  if(key==='4w'||key==='3m'){const n=key==='4w'?4:13;const m=monday(now);m.setDate(m.getDate()-7*(n-1));start=ymd(m);
    for(let i=0;i<n;i++){const a=new Date(m);a.setDate(a.getDate()+7*i);const b=new Date(a);b.setDate(b.getDate()+6);bk.push({s:ymd(a),e:ymd(b),label:'KW'+isoWeek(a)})}}
  else{let f;if(key==='1j')f=new Date(now.getFullYear(),now.getMonth()-11,1);
    else{const l=sortedSessions().filter(x=>x.date<=td);const d0=l.length?parseD(l[0].date):now;f=new Date(d0.getFullYear(),d0.getMonth(),1)}
    start=ymd(f);
    for(let d=new Date(f);d<=now;d=new Date(d.getFullYear(),d.getMonth()+1,1)){const e=new Date(d.getFullYear(),d.getMonth()+1,0);bk.push({s:ymd(d),e:ymd(e),label:MON3[d.getMonth()]+(d.getMonth()===0&&bk.length?' '+String(d.getFullYear()).slice(2):'')})}}
  const days=Math.max(1,dayN(td)-dayN(start)+1);
  return {key,start,end:td,days,weeks:Math.max(1,days/7),bk,weekly:key==='4w'||key==='3m',list:sortedSessions().filter(x=>x.date>=start&&x.date<=td)};
}

/* Diagramme mit Zeitachse und gestapelte Balken */
function tChart(series,opt={}){
  const W=340,H=opt.h||180,L=opt.l||42,R=12,T=14,B=26;
  const all=series.flatMap(s=>s.pts);if(!all.length)return '';
  let lo,hi,tk;
  if(opt.min!=null){lo=opt.min;hi=opt.max;tk=opt.ticks}

  const t0=Math.min(...all.map(p=>p.t)),t1=Math.max(...all.map(p=>p.t)),sp=Math.max(1,t1-t0);
  const x=t=>t1===t0?L+(W-L-R)/2:L+(W-L-R)*(t-t0)/sp;

  const fy=opt.fy||(v=>fmt(v));const X=v=>x(v).toFixed(1),Y=v=>y(v).toFixed(1);
  let g='';for(const v of tk)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${fy(v)}</text>`;
  const xs=t1===t0?[[t0,'middle']]:sp>=14?[[t0,'start'],[(t0+t1)/2,'middle'],[t1,'end']]:[[t0,'start'],[t1,'end']];
  const xl=xs.map(([t,a])=>`<text x="${X(t)}" y="${H-8}" text-anchor="${a}">${nDate(t)}</text>`).join('');
  let b='';
  for(const s of series){const p=[...s.pts].sort((a,c)=>a.t-c.t);
    if(s.line!==false&&p.length>1){const d=p.map((q,i)=>(i?'L':'M')+X(q.t)+' '+Y(q.v)).join(' ');
      if(s.area&&!opt.invert)b+=`<path class="ar" d="${d} L${X(p[p.length-1].t)} ${H-B} L${X(p[0].t)} ${H-B} Z"/>`;
      b+=`<path class="${s.cls||'ln'}" d="${d}"/>`}
    if(s.dots)for(const q of p)b+=mk(s.dcls||'pt',x(q.t),y(q.v),(s.r||3)*.92)}
  if(opt.last)b+=mk('end',x(opt.last.t),y(opt.last.v),4);
  if(opt.best)b+=mk('pr',x(opt.best.t),y(opt.best.v),4.8,true);

}
function sBars(items,opt={}){
  const W=340,H=opt.h||170,L=40,R=8,T=14,B=26;
  const tot=items.map(it=>it.parts.reduce((a,v)=>a+v,0));
  const {hi,t}=ticks(0,Math.max(opt.minMax||1,opt.ref||0,...tot),4);
  const n=items.length,bw=(W-L-R)/n,y=v=>T+(H-T-B)*(1-v/(hi||1)),fy=opt.fy||(v=>fmt(v));
  const every=Math.max(1,Math.ceil(32/bw));
  let g='';for(const v of t)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${fy(v)}</text>`;
  let b='';items.forEach((it,i)=>{const w=Math.max(2,bw*.62),bx=L+i*bw+(bw-w)/2;let acc=0;
    it.parts.forEach((v,k)=>{if(v<=0)return;const y1=y(acc+v),y0=y(acc);b+=`<rect class="${(opt.cls||['bar'])[k]}${opt.cur&&i===n-1?' cur':''}" x="${bx.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,y0-y1).toFixed(1)}"/>`;acc+=v});
    if((n-1-i)%every===0)b+=`<text x="${(bx+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${it.label}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'')}">${g}${b}${opt.ref?`<line class="ref" x1="${L}" x2="${W-R}" y1="${y(opt.ref).toFixed(1)}" y2="${y(opt.ref).toFixed(1)}"/>`:''}</svg>`;
}

function heatmap(){

  for(const x of L){const v=useK?kcd(x).kcal:sessMin(x);load[x.date]=(load[x.date]||0)+Math.max(1,v)}
  const vals=Object.values(load).sort((a,b)=>a-b),q=p=>vals[Math.min(vals.length-1,Math.floor(p*(vals.length-1)))];
  const lv=v=>!v?0:vals.length<4?3:v<=q(.25)?1:v<=q(.5)?2:v<=q(.75)?3:4;
  const strip=(w0,n)=>{let h='<span></span>';
    for(let w=0;w<n;w++){const a=new Date(st);a.setDate(a.getDate()+7*(w0+w));let lab='';for(let i=0;i<7;i++){const c=new Date(a);c.setDate(c.getDate()+i);if(c.getDate()===1){lab=MON3[c.getMonth()];break}}h+=`<span>${lab}</span>`}

function plateaus(){const tn=dayN(today()),o=[];

    let best=-Infinity,bi=-1;sr.forEach((p,i)=>{if(p.v>best){best=p.v;bi=i}});

function recordsFor(ex,L){const o=[];
  if(ex.kind==='kraft'){let rm=null,hv=null,rp=null;
    for(const x of L)for(const e of x.entries){if(e.exId!==ex.id)continue;for(const st of cleanSets(ex,e.sets)){const w=num(st.a),r=num(st.b);if(r<=0)continue;
      if(w>0){const e1=r===1?w:w*(1+r/30);if(!rm||e1>rm.v)rm={v:e1,d:x.date,s:fmt(w,2)+' kg × '+fmt(r)};if(!hv||w>hv.v||(w===hv.v&&r>hv.r))hv={v:w,r,d:x.date}}

    for(const x of L)for(const e of x.entries){if(e.exId!==ex.id)continue;let sum=0;const ss=cleanSets(ex,e.sets);for(const st of ss){const v=val(st);sum+=v;if(v>0&&(!s1||v>s1.v))s1={v,d:x.date}}if(sum>0&&(!s2||sum>s2.v))s2={v:sum,d:x.date,n:ss.length}}
