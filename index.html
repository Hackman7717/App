function viewExPick(){if(!exPick)return '<div class="card empty"><b>Keine Auswahl offen</b>Geh zurück.</div>';
  return `<input class="in" type="search" id="exPQ" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="Suchen, z. B. Bizeps oder Plank" value="${esc(exPick.q)}" aria-label="Übung suchen">
   ${catChips(exPick.cat,'pick')}
   <div id="exPList" class="exwrap">${exPickBody()}</div>
   <button class="btn block" data-act="exPickNew">+ Neue Übung anlegen</button>`}
function exToDraft(id){ensureDraft();const lt=lastFor(id,S.draft.id),kd=(exById(id)||{}).kind;
  const sets=kd==='zeit'?[{a:'',b:'',sec:0}]:kd==='distanz'?[{a:lt&&lt.e.sets.length?lt.e.sets[lt.e.sets.length-1].a:'',b:'',sec:0,tk:'b'}]:lt?lt.e.sets.map(s=>({a:s.a,b:s.b})):[{a:'',b:''}];
  S.draft.entries.push({exId:id,sets});S.draft.cur=S.draft.entries.length-1}
function exToPlan(id){if(planEdit)planEdit.items.push({exId:id,sets:(exById(id)||{}).kind==='distanz'?1:3})}
/* ---------- Vorschläge im Training: passend zur Kategorie der bisherigen Übungen ----------
   Reihenfolge innerhalb einer Kategorie: oft trainiert, zuletzt trainiert, üblich (Katalog), Name. Nichts ist zufällig. */
let sug={key:'',cat:null};
function sessCats(entries){const out=[];for(let i=(entries||[]).length-1;i>=0;i--){const ex=exById(entries[i].exId),c=ex&&ex.cat;if(c&&!out.includes(c))out.push(c)}return out}
/* Kategorien in der Reihenfolge des Trainings. „und“ statt „&“, weil „Bauch & Core“ selbst ein & enthält. */
function entCats(entries){const out=[];for(const e of entries||[]){const ex=exById(e.exId),c=ex&&ex.cat;if(c&&!out.includes(c))out.push(c)}return out}
function catsJoin(L){return L.length>1?L.slice(0,-1).join(', ')+' und '+L[L.length-1]:L[0]||''}
function catsTxt(entries,sep){const out=entCats(entries);return sep?out.join(sep):catsJoin(out)}
/* Reihenfolge: zuerst, was du oft und zuletzt trainiert hast, dann die übliche Reihenfolge im Studio (EX_SUG), eigene Übungen danach.
   Varianten einer Übung, die schon im Training ist, rutschen nach hinten (nach Bankdrücken mit der Langhantel nicht als Nächstes
   Bankdrücken mit Kurzhanteln, sondern eine andere Bewegung). */
const SUG_ORD=new Map(EX_SUG.map((id,i)=>[id,i]));
function famKey(e){const p=exVar(e);return (p?p.base:e.name).toLowerCase()}
function exRanker(st,inn){const so=e=>{const i=SUG_ORD.get(libId(e.id));return i==null?999:i},fams=new Set();
  for(const id of inn){const e=exById(id);if(e)fams.add(famKey(e))}
  return (a,b)=>{const na=st.c[a.id]||0,nb=st.c[b.id]||0;if(!na!==!nb)return na?-1:1;if(na!==nb)return nb-na;
    const r=(st.l[b.id]||'').localeCompare(st.l[a.id]||'');if(r)return r;
    const fa=fams.has(famKey(a))?1:0,fb=fams.has(famKey(b))?1:0;if(fa!==fb)return fa-fb;
    return so(a)-so(b)||a.name.localeCompare(b.name,'de')}}
function catSug(cat,inn,n,st){return S.exercises.filter(e=>e.cat===cat&&!inn.has(e.id)).sort(exRanker(st,inn)).slice(0,n)}
/* Passend: je Kategorie des Trainings (zuletzt benutzte zuerst) die besten Übungen */
function fitSug(cats,inn,st,n){const C=cats.slice(0,3),per=Math.max(2,Math.ceil(n/C.length));return C.map(c=>({c,L:catSug(c,inn,per,st)})).filter(g=>g.L.length)}
const exChip=e=>`<button class="chip exchip" data-act="addEntry" data-id="${e.id}">${esc(e.name)}</button>`;
function exQuick(d){const inn=new Set(d.entries.map(e=>e.exId)),st=exStats(),cats=sessCats(d.entries);
  const key=(d.id||d.startAt||'neu')+':'+d.entries.length;if(sug.key!==key){sug.key=key;sug.cat=null}
  const all=allCats().filter(c=>S.exercises.some(e=>e.cat===c)),first=cats.length?['*','Passend']:Object.keys(st.l).length?['~','Zuletzt']:null;
  const sel=sug.cat||(first?first[0]:''),chips=(first?[first]:[]).concat(all.map(c=>[c,c]));let body;
  if(sel==='*'){const G=fitSug(cats,inn,st,6);
    body=G.length?G.map(g=>`<div class="sugrow"><span class="sug-c">${esc(g.c)}</span><div class="chips wrap">${g.L.map(exChip).join('')}</div></div>`).join('')
      :'<div class="small muted">Aus diesen Kategorien ist schon alles im Training. Wähl oben eine andere.</div>'}
  else if(sel==='~'){const L=exRecent(inn,8);body=L.length?`<div class="chips wrap">${L.map(exChip).join('')}</div>`:''}
  else if(sel){const L=catSug(sel,inn,10,st);body=L.length?`<div class="chips wrap">${L.map(exChip).join('')}</div>`:'<div class="small muted">Alle Übungen dieser Kategorie sind schon im Training.</div>'}
  else body='<div class="small muted">Wähl eine Kategorie, dann erscheinen die passenden Übungen.</div>';
  return `<div class="field sugbox" id="sugBox"><span class="eyebrow">${d.entries.length?'Weitere Übung':'Übung wählen'}</span>
   <div class="chips excats sugcats" role="group" aria-label="Vorschläge nach Kategorie">${chips.map(([v,l])=>`<button class="chip" data-act="sugCat" data-v="${esc(v)}" aria-pressed="${sel===v}">${esc(l)}</button>`).join('')}</div>
   <div class="sugbody">${body}</div>
   <button class="btn block" data-act="exPick" data-to="session">Alle Übungen …</button></div>`}

/* ---------- Training als Plan speichern: auf „Abschließen“ per Schalter, im Verlauf per Knopf ----------
   Übungen in der Reihenfolge des Trainings, Sätze wie abgehakt. Name aus den Kategorien. Neue Pläne sind angeheftet,
   damit sie unter „Mit Plan starten“ stehen. Gibt es schon einen Plan mit genau diesen Übungen und Sätzen, entsteht kein zweiter. */
function planItemsFrom(entries){return (entries||[]).filter(e=>exById(e.exId)&&(e.sets||[]).length).map(e=>({exId:e.exId,sets:Math.min(10,Math.max(1,e.sets.length))}))}
function planSameItems(a,b){return a.length===b.length&&a.every((x,i)=>x.exId===b[i].exId&&num(x.sets)===num(b[i].sets))}
function planNameSuggest(entries){const C=entCats(entries),m=C.filter(c=>c!=='Ausdauer');
  return (m.length>=4?'Ganzkörper'+(C.includes('Ausdauer')?' und Ausdauer':''):catsJoin(C)||'Mein Training').slice(0,50)}
function planNameFree(n){const lc=x=>String(x||'').trim().toLowerCase();let m=n,i=2;while(S.plans.some(p=>lc(p.name)===lc(m))){m=n.slice(0,46)+' '+i;i++}return m}
function planSave(entries,name){const items=planItemsFrom(entries);if(!items.length)return null;
  const same=S.plans.find(p=>planSameItems(p.items||[],items));if(same)return {pl:same,dup:true};
  const pl={id:uid(),name:planNameFree(String(name||'').trim().slice(0,50)||planNameSuggest(entries)),items,pinned:true};S.plans.push(pl);return {pl,dup:false}}
function doneEntries(d){return d.entries.map(e=>({exId:e.exId,sets:e.sets.filter(s=>s.done&&setFilled(s))})).filter(e=>e.sets.length)}
function asPlanCard(d){if(d.id)return '';const done=doneEntries(d);if(!done.length)return '';
  const from=d.planId&&S.plans.find(p=>p.id===d.planId);if(from&&planSameItems(from.items||[],planItemsFrom(done)))return '';
  const on=!!d.asPlan;
  return `<div class="card pane asplan"><div class="ci-row"><div class="ci-l"><b>Als Trainingsplan speichern</b><span class="small muted">${on?'Mit diesen Übungen und Sätzen, angeheftet unter „Mit Plan starten“':'Übungen und Sätze fürs nächste Mal merken'}</span></div>
    <button class="switch${on?' on':''}" data-act="asPlan" role="switch" aria-checked="${on}" aria-label="Als Trainingsplan speichern"><span></span></button></div>
   ${on?`<label class="field"><span class="eyebrow">Name des Plans</span><input class="in" id="apName" data-ap="1" maxlength="50" autocomplete="off" value="${esc(d.asPlanName!=null?d.asPlanName:planNameSuggest(done))}"></label>`:''}</div>`}
function toastAct(msg,label,act,id){const h=document.getElementById('toastHost');if(!h)return;
  h.innerHTML=`<div class="toast act" role="status"><span>${esc(msg)}</span><button data-act="${act}"${id?` data-id="${esc(id)}"`:''}>${esc(label)}</button></div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{h.innerHTML=''},6000)}

/* Ziel für eine Übung: trainierte Kraft- und Wiederholungsübungen als Chips, alle anderen über die Auswahl */
function goalExChoices(selId){const {l}=exStats(),sel=selId?S.exercises.find(e=>e.id===selId&&goalKind(e)):null;
  const L=S.exercises.filter(e=>goalKind(e)&&l[e.id]).sort((a,b)=>l[b.id].localeCompare(l[a.id])).slice(0,8);
  if(sel&&!L.includes(sel))L.unshift(sel);
  if(L.length<6)for(const e of exRecent(new Set(L.map(x=>x.id)),60))if(goalKind(e)&&L.length<6)L.push(e);
  return L}

/* ---------- Training starten: Plan als Chips, Körpergewicht als Zahl ---------- */
function setupPlanChips(d){return `<div class="field"><span class="eyebrow">Trainingsplan</span><div class="chips wrap" role="group" aria-label="Trainingsplan">${[['','Ohne Plan']].concat(S.plans.map(p=>[p.id,p.name])).map(([id,n])=>`<button class="chip" data-act="setupPlan" data-id="${id}" aria-pressed="${(d.planId||'')===id}">${esc(n)}</button>`).join('')}</div></div>`}
function bwInput(d){
  return `<div class="kgc bwc"><button class="nudge" data-act="bwNudge" data-d="-0.1" aria-label="0,1 kg weniger">−</button><input class="in num bwin" type="text" inputmode="decimal" autocomplete="off" id="f-bw" data-f="bw" value="${vIn(d.bw)}" placeholder="nicht gewogen" aria-label="Körpergewicht in kg"><button class="nudge plus" data-act="bwNudge" data-d="0.1" aria-label="0,1 kg mehr">+</button></div>`}

/* ---------- Aktionen und Eingaben ---------- */
function trainAct(a,el,ck){const ds=el&&el.dataset||{};switch(a){
  /* Übungen neu geöffnet: ohne Suche und Filter vom letzten Mal */
  case 'tab':if(ds.v==='uebungen'){exQ='';exCatF=''}return false;
  case 'histOpen':histN=40;push('verlauf');render();return true;
  case 'histMore':histN+=60;render();return true;
  case 'exNew':exEditOpen(null,null,exQ.trim()&&!exFilt(exMatch(exQ),exCatF).length?exQ.trim():'',exCatF);render();return true;
  case 'exCatF':{const v=ds.v||'',pick=ds.to==='pick';if(pick&&!exPick)return true;
    if(pick)exPick.cat=exPick.cat===v?'':v;else exCatF=exCatF===v?'':v;
    const cur=pick?exPick.cat:exCatF,row=document.getElementById(pick?'pickCats':'listCats');
    if(row)for(const b of row.querySelectorAll('button'))b.setAttribute('aria-pressed',String((b.dataset.v||'')===cur));
    const box=document.getElementById(pick?'exPList':'exList');if(box)box.innerHTML=pick?exPickBody():exListBody();else render();return true}
  case 'libNoteOk':delete S.libNote;render();return true;
  case 'asPlan':{const d=S.draft;if(!d)return true;d.asPlan=!d.asPlan;if(d.asPlan&&d.asPlanName==null)d.asPlanName=planNameSuggest(doneEntries(d));save();render();return true}
  case 'sessPlan':{const x=S.sessions.find(s=>s.id===ds.id);if(!x)return true;const r=planSave(x.entries,planNameSuggest(x.entries));
    if(!r){toast('In diesem Training ist keine Übung mehr vorhanden');return true}
    render();toastAct(r.dup?'Diesen Plan gibt es schon: '+r.pl.name:'Plan „'+r.pl.name+'“ gespeichert','Ansehen','plansOpen',r.pl.id);return true}
  case 'plansOpen':{const h=document.getElementById('toastHost');if(h)h.innerHTML='';planEdit=null;if(curView()!=='plaene')push('plaene');render();
    /* zum gespeicherten Plan springen und ihn kurz hervorheben */
    const m=document.getElementById('main'),b=ds.id&&m&&[...m.querySelectorAll('[data-act="startPlan"]')].find(x=>x.dataset.id===ds.id),c=b&&b.closest('.plan');
    if(c){c.classList.add('hl');m.scrollTop+=c.getBoundingClientRect().top-m.getBoundingClientRect().top-Math.max(16,(m.clientHeight-c.offsetHeight)/2)}
    return true}
  case 'sugCat':{const v=ds.v||'';sug.cat=sug.cat===v?null:v;const b=document.getElementById('sugBox');
    if(b&&S.draft){b.outerHTML=exQuick(S.draft);chipSync()}else render();return true}
  case 'libRestore':{const n=libRestore();toast(n?(n===1?'Eine Standardübung':n+' Standardübungen')+' zurückgeholt':'Die Übungen gibt es schon unter gleichem Namen');render();return true}
  case 'exOpen':exEditOpen(ds.id);render();return true;
  case 'exKind':if(exEdit&&!(exEdit.id&&exUsed(exEdit.id))){exEdit.kind=ds.v;flash=''}render();return true;
  case 'exCat':if(exEdit){exEdit.cat=!exEdit.catNew&&exEdit.cat===ds.v?'':ds.v;exEdit.catNew=false}render();return true;
  case 'exCatNew':if(exEdit){exEdit.catNew=!exEdit.catNew;if(exEdit.catNew)exEdit.cat=''}render();if(exEdit&&exEdit.catNew){const i=document.getElementById('exCatN');if(i)i.focus()}return true;
  case 'exSport':if(exEdit)exEdit.sport=SPORTS[ds.v]?ds.v:'laufen';render();return true;
  case 'exSave':{const f=exEdit;if(!f)return true;const n=String(f.name||'').trim().slice(0,60);
    const fail=m=>{flash=m;render();return true};
    if(!n)return fail('Gib der Übung einen Namen.');
    if(S.exercises.some(e=>e.id!==f.id&&e.name.toLowerCase()===n.toLowerCase()))return fail('Diese Übung gibt es schon.');
    const cat=f.catNew?String(f.catName||'').trim().slice(0,30):f.cat;if(f.catNew&&!cat)return fail('Gib der neuen Kategorie einen Namen oder wähl eine aus.');
    const mt=num(f.met);let e=f.id?exById(f.id):null;const isNew=!e;
    if(isNew){e={id:uid(),name:n,kind:KINDS[f.kind]?f.kind:'kraft'};S.exercises.push(e)}else{e.name=n;if(!exUsed(e.id)&&KINDS[f.kind])e.kind=f.kind}
    if(cat)e.cat=cat;else delete e.cat;
    if(perf()&&(e.kind!=='distanz'||f.sport==='andere')){if(mt>0)e.met=Math.min(25,mt);else delete e.met}
    if(f.ref&&MET_REF[f.ref]&&num(e.met)===MET_REF[f.ref][0])e.metRef=f.ref;else delete e.metRef;
    if(e.kind==='distanz')e.sport=perf()?f.sport:(e.sport||(/rad|bike|cycl|velo/i.test(n)?'rad':'laufen'));else delete e.sport;
    const then=f.then;exEdit=null;flash='';pop();
    if(then&&curView()==='exwahl'){if(then==='plan')exToPlan(e.id);else if(then==='goal'){if(goalEdit&&goalKind(e))goalEdit.exId=e.id}else exToDraft(e.id);exPick=null;pop();if(then==='session')toTop()}
    toast(isNew?n+' angelegt':'Gespeichert');render();return true}
  case 'exDel':{const id=ds.id;libGoneAdd(id);S.exercises=S.exercises.filter(e=>e.id!==id);
    for(const s of S.sessions)s.entries=s.entries.filter(e=>e.exId!==id);S.sessions=S.sessions.filter(s=>s.entries.length);
    for(const p of S.plans)p.items=p.items.filter(it=>it.exId!==id);
    if(S.draft){S.draft.entries=S.draft.entries.filter(e=>e.exId!==id);if(S.draft.cur>S.draft.entries.length)S.draft.cur=S.draft.entries.length}
    exEdit=null;flash='';pop();toast('Übung gelöscht');render();return true}
  case 'exPick':exPickOpen(ds.to==='plan'||ds.to==='goal'?ds.to:'session');render();return true;
  case 'exPickDo':{if(!exPick)return true;const to=exPick.to,id=ds.id,x=exById(id);if(!x)return true;
    if(to==='plan')exToPlan(id);else if(to==='goal'){if(goalEdit&&goalKind(x))goalEdit.exId=id}else exToDraft(id);exPick=null;pop();if(to==='session')toTop();render();return true}
  case 'exPickNew':if(exPick)exEditOpen(null,exPick.to,exPick.q.trim(),exPick.cat);render();return true;
  case 'setupPlan':ensureDraft();if(ds.id)S.draft.planId=ds.id;else delete S.draft.planId;render();return true;
  case 'gfPick':if(goalEdit&&(ds.f==='exId'||ds.f==='habitId'))goalEdit[ds.f]=ds.v;render();return true;
  case 'nPal':{const n=nut();if(N_PAL.some(p=>p[0]===ds.v))n.pal=ds.v;delete n._demo;WL=null;render();return true}}
  return false}
function trainInput(T){const ds=T.dataset||{},id=T.id;
  if(ds.f==='set'){ensureDraft();const en=S.draft.entries[+ds.e],st=en&&en.sets[+ds.s];
    if(st){const v=String(T.value).trim();st[ds.k]=v===''?'':Math.max(0,num(v))}
    if(en&&ds.k==='a'){const pe=document.getElementById('pred-'+ds.e+'-'+ds.s),ex=exById(en.exId);if(pe&&ex)pe.innerHTML=predHtml(curRm(ex.id,S.draft),num(T.value))}
    save();return true}
  if(ds.ap){if(S.draft){S.draft.asPlanName=String(T.value).slice(0,50);save()}return true}
  if(ds.f==='bw'){ensureDraft();const v=String(T.value).trim();S.draft.bw=v===''?'':String(num(v));save();return true}
  if(id==='durH'||id==='durM'){durFromInputs();return true}
  if(ds.xf){if(exEdit){exEdit[ds.xf]=T.value;if(ds.xf==='met')metSrcUpd()}return true}
  if(id==='exQ'){exQ=T.value;exListUpd();return true}
  if(id==='exPQ'){if(exPick){exPick.q=T.value;const el=document.getElementById('exPList');if(el)el.innerHTML=exPickBody()}return true}
  return false}
/* Dauer beim Tippen mitrechnen, ohne neu zu zeichnen: sonst ginge der Tipp ins nächste Feld verloren */
function durFromInputs(){if(!S.draft)return;const h=num((document.getElementById('durH')||{}).value),m=num((document.getElementById('durM')||{}).value);
  const dur=Math.max(0,Math.round(Math.min(24,h)*60+Math.min(59,m)));S.draft.dur=dur;S.draft.durSet=true;userActed=true;
  const t=document.querySelector('.tbtn-tile .v');if(t)t.innerHTML=dur>=60?Math.floor(dur/60)+':'+pad(dur%60)+'<small>h</small>':(dur||'–')+'<small>Min</small>';save()}
function trainChange(T){const id=T.id;
  if(id==='durH'||id==='durM'){durFromInputs();return true}
  const d=T.dataset||{};if(d.f==='set'||d.xf||d.ap||id==='exQ'||id==='exPQ')return true;
  return false}
/* ======================= Heute: Check-in mit Übersicht, Training mit Kategorien =======================
   Check-in: Die Schlafdauer ändert sich nur noch über − und +. Ein Tipp auf den Wert übernimmt ihn nur, solange noch nichts
   eingetragen ist (vorher hat ein Tipp den Wert gelöscht). Sind Schlaf, Schlafqualität und Stimmung ausgefüllt, zeigt die Karte
   eine Übersicht in derselben Größe mit den letzten sieben Tagen. „Ändern“ öffnet die Eingabe wieder. */
let ciEdit=null;
function ciDone(k){const D=dayGet(k),sl=D.sleep||{};return num(sl.h)>0&&num(sl.q)>0&&num(D.mood)>0}
function days7(k){const d=parseD(k),out=[];for(let i=6;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);out.push(ymd(x))}return out}
function ciBars(vals,max,lbl){const n=vals.length;
  return `<div class="cis-bars" role="img" aria-label="${esc(lbl)}">${vals.map((v,i)=>`<i class="${i===n-1?'td':''}${v>0?'':' no'}" style="height:${v>0?Math.max(8,Math.min(100,v/max*100)).toFixed(0):6}%"></i>`).join('')}</div>`}
function ciSummary(k){const D=dayGet(k),sl=D.sleep||{},h=num(sl.h),q=num(sl.q),mo=num(D.mood),ds=days7(k);
  const hs=ds.map(x=>num((dayGet(x).sleep||{}).h)),qs=ds.map(x=>num((dayGet(x).sleep||{}).q)),ms=ds.map(x=>num(dayGet(x).mood));
  const avg=a=>{const v=a.filter(x=>x>0);return v.length>1?v.reduce((t,x)=>t+x,0)/v.length:0};
  const ah=avg(hs),aq=avg(qs),am=avg(ms),hmax=Math.max(9,...hs);
  const row=(lbl,big,sub,bars)=>`<div class="cis-row"><div class="cis-l"><span class="eyebrow">${lbl}</span><b>${big}</b><span class="small muted num">${sub}</span></div>${bars}</div>`;
  return `<div class="card pane cisum" data-date="${k}"><div class="pane-h"><span class="eyebrow cis-ok">${ICONS.check}Check-in erledigt</span><button class="lnk" data-act="ciEdit" data-date="${k}">Ändern</button></div>
   ${row('Schlaf',`<span class="num">${fmtH(h)}</span><small>h</small>`,ah?'Ø 7 Tage '+fmtH(ah)+' h':'Noch kein Vergleich',ciBars(hs,hmax,'Schlafdauer der letzten 7 Tage'))}
   ${row('Schlafqualität',`${esc(SLQ[q-1]||'')}<small class="num">${q}/5</small>`,aq?'Ø 7 Tage '+fmt(aq,1):'Noch kein Vergleich',ciBars(qs,5,'Schlafqualität der letzten 7 Tage'))}
   ${row('Stimmung',`${esc(MOOD[mo-1]||'')}<small class="num">${mo}/5</small>`,am?'Ø 7 Tage '+fmt(am,1):'Noch kein Vergleich',ciBars(ms,5,'Stimmung der letzten 7 Tage'))}</div>`}
function checkinCard(k){return ciDone(k)&&ciEdit!==k?ciSummary(k):ciEditor(k)}
/* Die Übersicht bekommt genau die Höhe, die die Eingabe an dieser Stelle hätte: unsichtbar messen, dann als Mindesthöhe setzen */
function ciFit(){const s=document.querySelector('#main .cisum'),m=s&&s.parentNode;if(!m)return;
  const t=document.createElement('template');t.innerHTML=ciEditor(s.dataset.date).trim();const e=t.content.firstElementChild;if(!e)return;

function brLoop(){if(!br.run)return;const el=document.getElementById('brSq');if(!el){brFinish(true);return}

function demoLife(sessions){
  let seed=11;const R=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  const t=today(),D=n=>offFrom(t,n),days={},day=k=>days[k]||(days[k]={});
  const habits=[{id:'h1',name:'Wasser',kind:'count',target:8,unit:'Gläser',created:D(-60)},
    {id:'h2',name:'Lesen',kind:'amount',target:20,unit:'Seiten',step:5,created:D(-60)},
    {id:'h3',name:'Kein Zucker',kind:'quit',start:D(-40),since:D(-17),created:D(-40)},
    {id:'h4',name:'Dehnen',kind:'check',days:[1,3,5],created:D(-60)}];
  const trained=new Set(sessions.map(s=>s.date));
  const notes=['Gut geschlafen, das Training lief locker.','Viel Stress bei der Arbeit, abends lange spazieren gewesen.','Die Kniebeugen fühlten sich heute schwer an.','Früh ins Bett, morgen ist Beintag.','Entspannter Tag, viel gelesen.','Neuer Bestwert beim Bankdrücken.','Wenig geschlafen und entsprechend müde.'];
  for(let i=41;i>=0;i--){const k=D(-i),x=day(k),tr=trained.has(k),wd=parseD(k).getDay();
    const sl=Math.round((6+R()*2.4+(wd===0||wd===6?.5:0))*4)/4;
    x.sleep={h:sl,q:Math.max(1,Math.min(5,Math.round(sl-3.9+R()*1.6)))};
    const h={h1:Math.min(9,Math.round(4+R()*5))};
    if(R()<.7)h.h2=Math.round((10+R()*20)/5)*5;
    if(i===17)h.h3=-1;
    if([1,3,5].includes(wd)&&R()<.75)h.h4=1;
    x.h=h;
    x.mood=Math.max(1,Math.min(5,Math.round(2.1+(tr?.8:0)+(sl>=7?.7:0)+(h.h2>=20?.3:0)+R()*1.3)));
    if(R()<.3)x.note=notes[Math.floor(R()*notes.length)];
    if(R()<.22)x.breath=4;
    if(!tr&&i%3===1)x.w=Math.round((83.3-(41-i)*.036+(R()-.5)*.5)*10)/10;
    if(i===0){delete x.mood;delete x.note;delete x.breath;x.h={h1:5}}
  }
  const M=[['Haferflocken mit Beeren',420,18,62,10],['Skyr mit Banane',260,24,34,2],['Hähnchen mit Reis und Brokkoli',650,48,72,14],['Vollkornbrot mit Käse',380,18,40,16],['Linsencurry mit Reis',560,24,78,14],['Lachs mit Kartoffeln',610,38,48,26],['Apfel',80,0,19,0],['Proteinshake',180,30,6,3],['Pasta mit Tomatensauce',640,22,108,12],['Omelett mit Gemüse',340,24,6,24]];
  const times=['07:40','12:30','16:00','19:10'];
  for(let i=6;i>=0;i--){const x=day(D(-i)),n=i===0?2:3+Math.floor(R()*2),f=[];
    for(let j=0;j<n;j++){const m=M[Math.floor(R()*M.length)];f.push({id:'f'+i+j,t:times[j],n:m[0],k:m[1],p:m[2],c:m[3],f:m[4]})}
    x.food=f}
  day(D(-40)).meas={taille:89,brust:104,huefte:101,arm:35,bein:58};
  day(D(-20)).meas={taille:87.6,brust:104.5,huefte:100.1,arm:35.4,bein:58.3};
  day(D(-2)).meas={taille:86.5,brust:105,huefte:99.4,arm:35.8,bein:58.6};
  const goals=[{id:'g1',type:'weight',target:80,start:83.2,until:D(60),created:D(-42)},
    {id:'g2',type:'lift',exId:'e1',target:115,start:82,created:D(-42)},
    {id:'g3',type:'habit',habitId:'h2',target:30,created:D(-35)}];
  return {habits,days,goals,photos:[],favs:[{n:'Skyr mit Banane',k:260,p:24,c:34,f:2},{n:'Proteinshake',k:180,p:30,c:6,f:3}],mods:{food:true,mind:true,body:true},
    nutri:{sex:'m',age:'32',height:'181',pal:'1.4',goal:'ab',diet:'normal',target:'80',_demo:1}};
}

/* ======================= Daten löschen mit Rückgängig =======================
   Vor dem Löschen kommt der komplette Stand als Schnappschuss in IndexedDB (kv 'geloescht').
   S.wiped {at, day, scope:'all'|'entries', until, hide, photoIds, tpl} merkt sich, dass es etwas zum Zurückholen gibt.
   Gelöschte Fotos bleiben bis zum endgültigen Löschen auf dem Gerät. Nach 30 Tagen wird automatisch endgültig gelöscht.
   Rückgängig führt zusammen: Der alte Stand kommt zurück, was seitdem neu eingetragen wurde, bleibt. */

const kvDel=k=>tx('kv','readwrite',st=>st.delete(k));

/* ---------- Rückgängig: alten Stand zurückholen und mit allem Neuen zusammenführen ---------- */
function wipeDays(Od,Cd,hmap){const R={};
  for(const k of Object.keys(Cd||{})){const c=JSON.parse(JSON.stringify(Cd[k]));if(c.h&&hmap){const h={};for(const id in c.h)h[hmap[id]||id]=c.h[id];c.h=h}R[k]=c}
  for(const k of Object.keys(Od||{})){const o=Od[k],c=R[k];if(!c){R[k]=o;continue}
    for(const f of Object.keys(o)){const ov=o[f],cv=c[f];
      if(cv==null||cv===''){c[f]=ov;continue}
      if(Array.isArray(ov)&&Array.isArray(cv)){const ids=new Set(cv.map(x=>x&&x.id));c[f]=ov.filter(x=>!(x&&ids.has(x.id))).concat(cv);continue}
      if(f==='breath'){c.breath=num(ov)+num(cv);continue}
      if(f==='note'){const a=String(ov).trim(),b=String(cv).trim();if(a&&a!==b)c.note=(a+'\n\n'+b).slice(0,4000);continue}
      if(ov&&typeof ov==='object'&&cv&&typeof cv==='object'){c[f]={...ov,...cv};continue}}}
  return R}
/* Liste zusammenführen: der alte Stand gewinnt; Neues mit gleichem Namen wird dem Alten zugeordnet */
function wipeById(O,C,key){const ids=new Set(O.map(x=>x.id)),nm=new Map(),map={},out=O.slice();
  if(key)for(const x of O){const k=String(x[key]||'').trim().toLowerCase();if(k&&!nm.has(k))nm.set(k,x.id)}
  for(const x of C){if(ids.has(x.id))continue;const k=key?String(x[key]||'').trim().toLowerCase():'',hit=k&&nm.get(k);if(hit){map[x.id]=hit;continue}out.push(x)}
  return {out,map}}
function wipeMerge(O,C,W){const R=JSON.parse(JSON.stringify(C)),A=a=>Array.isArray(a)?a:[];let hmap={};
  if(W.scope==='all'){const T=W.tpl||{},has=(L,id)=>A(L).some(x=>x.id===id),tpl=(k,id)=>A(T[k]).includes(id);
    /* Vorlagen, die nur das Löschen mitgebracht hat und die seitdem nicht benutzt wurden, fallen weg */
    const usedPl=new Set([...A(R.sessions).map(s=>s.planId),R.draft&&R.draft.planId].filter(Boolean));
    const plans=A(R.plans).filter(p=>!tpl('pl',p.id)||has(O.plans,p.id)||usedPl.has(p.id));
    const usedEx=new Set();for(const s of A(R.sessions))for(const e of A(s.entries))usedEx.add(e.exId);
    if(R.draft)for(const e of A(R.draft.entries))usedEx.add(e.exId);for(const g of A(R.goals))if(g.exId)usedEx.add(g.exId);
    for(const p of plans)for(const it of A(p.items))usedEx.add(it.exId);
    const exs=A(R.exercises).filter(x=>!tpl('ex',x.id)||has(O.exercises,x.id)||usedEx.has(x.id));
    const usedHb=new Set();for(const k in R.days||{}){const h=R.days[k].h;if(h)for(const id in h)usedHb.add(id)}for(const g of A(R.goals))if(g.habitId)usedHb.add(g.habitId);
    const hbs=A(R.habits).filter(x=>!tpl('hb',x.id)||has(O.habits,x.id)||usedHb.has(x.id));
    const ex=wipeById(A(O.exercises),exs,'name'),pl=wipeById(A(O.plans),plans,'name'),hb=wipeById(A(O.habits),hbs,'name');hmap=hb.map;
    const rx=id=>ex.map[id]||id,rp=id=>pl.map[id]||id;
    for(const s of A(R.sessions)){for(const e of A(s.entries))e.exId=rx(e.exId);if(s.planId)s.planId=rp(s.planId)}
    if(R.draft){for(const e of A(R.draft.entries))e.exId=rx(e.exId);if(R.draft.planId)R.draft.planId=rp(R.draft.planId)}
    for(const p of pl.out)if(!has(O.plans,p.id))for(const it of A(p.items))it.exId=rx(it.exId);
    for(const g of A(R.goals)){if(g.exId)g.exId=rx(g.exId);if(g.habitId)g.habitId=hmap[g.habitId]||g.habitId}
    if(R.ui)for(const f of ['progEx','anaEx'])if(R.ui[f]&&ex.map[R.ui[f]])R.ui[f]=ex.map[R.ui[f]];
    R.exercises=ex.out;R.plans=pl.out;R.habits=hb.out;
    R.goals=wipeById(A(O.goals),A(R.goals)).out;
    const fn=new Set(A(O.favs).map(f=>String(f.n||'').trim().toLowerCase()));R.favs=A(O.favs).concat(A(R.favs).filter(f=>!fn.has(String(f.n||'').trim().toLowerCase()))).slice(0,30);
    const pc=new Set(A(O.products).map(p=>p.code).filter(Boolean));R.products=wipeById(A(O.products),A(R.products).filter(p=>!p.code||!pc.has(p.code))).out;
    R.recipes=wipeById(A(O.recipes),A(R.recipes)).out;
    if(!R.recDraft&&O.recDraft)R.recDraft=O.recDraft;
    /* Tagesbedarf: die App füllt leere Angaben selbst mit Standardwerten, deshalb gelten die alten Angaben */
    R.nutri={...(R.nutri||{}),...(O.nutri||{})};
    for(const f of ['mods','goal','restSec','restOn','mode','bkEvery'])if(O[f]!==undefined)R[f]=O[f];
    for(const k in O)if(R[k]===undefined&&k!=='wiped'&&k!=='ui')R[k]=O[k];
    /* Stand von vor dem Übungskatalog: Vorlagen beim nächsten migrate() noch anpassen */
    if(!num(O.libV))R.libV=0}
  else{/* nur Einträge: die beim Löschen zurückgesetzten Startdaten der Gewohnheiten zurückholen */
    for(const h of A(R.habits)){const o=A(O.habits).find(x=>x.id===h.id);if(!o)continue;
      if(h.created===W.day&&o.created)h.created=o.created;
      if(h.kind==='quit'&&o.kind==='quit'&&h.since===W.day&&h.start===W.day){h.since=o.since;h.start=o.start;if(o.prevSince)h.prevSince=o.prevSince;else delete h.prevSince}}}
  R.sessions=wipeById(A(O.sessions),A(R.sessions)).out;
  R.days=wipeDays(O.days,R.days,hmap);
  R.photos=wipeById(A(O.photos),A(R.photos)).out;
  if(!R.draft&&O.draft&&!O.draft.id)R.draft=O.draft;
  if(num(O.since))R.since=Math.min(num(O.since),num(R.since)||Infinity);
  const lb=Math.max(num(O.lastBackup),num(R.lastBackup));R.lastBackup=lb||null;
  R.demo=false;delete R.wiped;return R}
async function wipeUndo(){const W=S.wiped;if(!W||wipeBusy)return;wipeBusy=true;render();let O=null;
  try{const t=await kvGet('geloescht');O=t?JSON.parse(t):null}catch(e){}
  if(!O||!Array.isArray(O.sessions)){wipeBusy=false;delete S.wiped;userActed=true;toast('Die gelöschten Daten sind leider nicht mehr auf dem Gerät.');render();return}
  try{await kvSet('vor-rueckgaengig',JSON.stringify(S))}catch(e){}
  let R;try{R=wipeMerge(O,S,W)}catch(e){wipeBusy=false;toast('Zurückholen hat nicht geklappt. Deine gelöschten Daten bleiben gesichert.');render();return}
  S=R;migrate();wipeUiReset();userActed=true;wipeBusy=false;
  try{await kvDel('geloescht')}catch(e){}
  render();storeFlush();toast('Deine Daten sind wieder da')}
/* Endgültig löschen: Schnappschuss, Fotos und alte Sicherheitskopien entfernen */
async function wipePurge(silent){const W=S.wiped;if(!W||wipeBusy)return;wipeBusy=true;
  await wipeDropPhotos(W);
  try{await kvDel('geloescht')}catch(e){}
  try{const keys=await tx('kv','readonly',st=>st.getAllKeys());for(const k of keys||[])if(/^vor-/.test(String(k)))await kvDel(k)}catch(e){}
  delete S.wiped;if(realBak&&realBak.wiped)delete realBak.wiped;wipeBusy=false;userActed=true;

    case 'tEditSave':{if(!timeEdit)break;const st=d.entries[timeEdit.e]&&d.entries[timeEdit.e].sets[timeEdit.s];
      if(st){const tv=(k,d,mx)=>{const el=document.getElementById(k),v=el?String(el.value).trim():'';return Math.min(mx,Math.max(0,Math.round(v===''?d:num(v))))},h=tv('teH',timeEdit.h,9),m=tv('teM',timeEdit.m,59),x=tv('teS',timeEdit.x,59);
        delete st.t0;st.sec=h*3600+m*60+x;st[st.tk||'a']=st.sec?Math.round(st.sec/60*100)/100:'';toast('Zeit geändert')}
      timeEdit=null;break}
    case 'toggleDone':{const i=+el.dataset.e;const en=d.entries[i];const st=en.sets[+el.dataset.s];if(!st.done&&timeEdit&&timeEdit.e===i&&timeEdit.s===+el.dataset.s)timeEdit=null;if(!st.done&&st.t0)stopTimer(st);st.done=!st.done;
      if(st.done){startRest();if(entryDone(en)&&d.cur===i){d.cur=i+1;timeEdit=null;toTop();const nx=d.entries[i+1]&&exById(d.entries[i+1].exId);toast(nx?'Weiter mit '+nx.name:'Alle Übungen geschafft')}}break}
    case 'allDone':d.entries.forEach(e=>e.sets.forEach(x=>{if(setFilled(x))x.done=true}));break;
    case 'delLastSet':{const en=d.entries[+el.dataset.e];if(en.sets.length>1)en.sets.pop();break}
    case 'restToggle':S.restOn=S.restOn===false;if(!S.restOn&&S.draft)S.draft.restEnd=null;break;
    case 'restSec':S.restSec=Math.min(600,Math.max(15,(S.restSec||90)+ +el.dataset.d));break;
    case 'restAdj':if(d&&d.restEnd){d.restEnd=Math.max(Date.now()+1000,d.restEnd+ +el.dataset.d*1000);d.restTotal=Math.max(d.restTotal||90,Math.ceil((d.restEnd-Date.now())/1000));d.restAlerted=false}break;
    case 'restSkip':if(d){d.restEnd=null;d.restAlerted=false}break;
    case 'endSession':timeEdit=null;d.entries.forEach(e=>e.sets.forEach(x=>{if(x.t0){stopTimer(x);x.done=true}}));d.restEnd=null;d.finishing=true;toTop();break;
    case 'durEdit':durOpen=!durOpen;break;
    case 'durNudge':{const c=finDur(d);d.dur=Math.min(600,Math.max(1,(c||0)+ +el.dataset.d));d.durSet=true;break}
    case 'backToLive':durOpen=false;d.finishing=false;toTop();break;
    case 'mode':S.mode=el.dataset.v==='perf'?'perf':'basic';toast(S.mode==='perf'?'Analysis-Ansicht':'Essential-Ansicht');break;
    case 'openCal':goRoot('training');openFold.cal=true;break;
    case 'nudge':{const st=d.entries[+el.dataset.e].sets[+el.dataset.s];const key=el.dataset.k||'a';const step=+el.dataset.d;const cur=num(st[key]);
      const reps=Math.abs(step)===1;const lo=el.dataset.lo?+el.dataset.lo:reps?1:2.5,hi=el.dataset.hi?+el.dataset.hi:reps?50:202.5;
      if(!cur&&step<0){st[key]='';break}
      st[key]=Math.round(Math.min(hi,Math.max(lo,(cur||0)+step))*100)/100;break}
    case 'newPlan':planEdit={id:null,name:'',items:[]};flash='';toTop();break;
    case 'editPlan':{const pl=S.plans.find(p=>p.id===el.dataset.id);if(pl)planEdit=JSON.parse(JSON.stringify(pl));toTop();break}
    case 'cancelPlan':planEdit=null;break;
    case 'peAdd':{const id=document.getElementById('peEx').value;if(id)planEdit.items.push({exId:id,sets:(exById(id)||{}).kind==='distanz'?1:3});break}
    case 'peDel':planEdit.items.splice(+el.dataset.i,1);break;
    case 'peSets':{const it=planEdit.items[+el.dataset.i];it.sets=Math.min(10,Math.max(1,it.sets+ +el.dataset.d));break}
    case 'peMove':{const i=+el.dataset.i,j=i+ +el.dataset.d;if(j>=0&&j<planEdit.items.length){const t=planEdit.items[i];planEdit.items[i]=planEdit.items[j];planEdit.items[j]=t}break}
    case 'savePlan':{const n=(planEdit.name||'').trim();if(!n){flash='Gib dem Plan einen Namen.';break}if(!planEdit.items.length){flash='Füge mindestens eine Übung hinzu.';break}
      const pl={id:planEdit.id||uid(),name:n,items:planEdit.items,pinned:!!planEdit.pinned};const i=S.plans.findIndex(p=>p.id===pl.id);if(i>=0)S.plans[i]=pl;else S.plans.push(pl);
      planEdit=null;flash='';toast('Plan gespeichert');break}
    case 'delPlan':S.plans=S.plans.filter(p=>p.id!==el.dataset.id);toast('Plan gelöscht');break;
    case 'startPlan':{const pl=S.plans.find(p=>p.id===el.dataset.id);if(!pl)break;
      if(S.draft&&!S.draft.id&&(S.draft.started||S.draft.entries.length)){toast('Beende zuerst dein laufendes Training');goRoot('training',['session']);break}
      S.draft={id:null,date:today(),feel:null,bw:'',note:'',entries:[],started:false,planId:pl.id};prefillBw(S.draft);goRoot('training',['session']);break}
    case 'bwNudge':{ensureDraft();const dr=S.draft;let cur=num(dr.bw);
      if(!cur){const lw=weightAt(dr.date||today())||lastWeight();cur=lw?Math.round(lw.v*10)/10:75;dr.bw=String(cur);break}
      dr.bw=String(Math.round(Math.min(200,Math.max(30,cur+ +el.dataset.d))*10)/10);break}
    case 'pinPlan':{const pl=S.plans.find(x=>x.id===el.dataset.id);if(pl){pl.pinned=!pl.pinned;toast(pl.pinned?'Unter Heute und Training angeheftet':'Nicht mehr angeheftet')}break}
    case 'startSession':if(!d.date){flash='Bitte wähle ein Datum.';break}beginSession(d);break;
    case 'quickPlan':{ensureDraft();S.draft.planId=el.dataset.id;act('startSession',el);return}
    case 'editSetup':d.started=false;d.reSetup=true;break;
    case 'demoToggle':{if(S.demo){const had=!!realBak;exitDemo();toast(had?'Demo beendet – deine Daten sind zurück':'Beispieldaten gelöscht')}else{enterDemo();toast('Beispieldaten aktiv – deine Daten sind sicher beiseitegelegt')}break}
    case 'loadDemo':{const d=demo();S.exercises=d.exercises;S.sessions=d.sessions;S.plans=d.plans;for(const f of ['habits','days','goals','favs','mods','nutri'])S[f]=d[f];S.demo=true;S.draft=null;S.ui.progEx='e1';toast('Beispieldaten geladen');break}
    case 'fold':openFold[el.dataset.v]=!openFold[el.dataset.v];break;
    case 'okIssue':{const x=S.sessions.find(q=>q.id===el.dataset.id);if(x){for(const e of x.entries||[]){const ex=exById(e.exId);for(const st of e.sets||[])if(setIssue(ex,st))st.ok=1}x.ok=1;toast('Als korrekt bestätigt')}break}
    case 'anaTab':S.ui.anaTab=el.dataset.v;break;
    case 'anaRange':S.ui.anaRange=el.dataset.v;break;
    case 'anaEx':S.ui.anaEx=el.dataset.id;break;
    case 'anaRun':S.ui.anaRun=el.dataset.id;break;
    case 'anaRel':S.ui.anaRel=el.dataset.v==='1';break;
    case 'anaRecAll':S.ui.anaRecAll=!S.ui.anaRecAll;break;
    case 'toggleImport':showImport=!showImport;break;
    case 'import':{let p;try{p=JSON.parse(importText);bkCheck(p)}catch(e){toast('Das ist kein gültiges Backup');break}importText='';bkApply(p);return}
  }
  render();
}
document.addEventListener('click',e=>{if(Date.now()<noClickUntil){e.preventDefault();e.stopPropagation();return}unlockAudio();const t=e.target.closest('[data-act]');if(t){e.preventDefault();act(t.dataset.act,t)}});
document.addEventListener('input',e=>{
  userActed=true;
  if(e.target.dataset&&e.target.dataset.nf){nutriInput(e.target);return}
  {const T=e.target,ds=T.dataset||{};if(trainInput(T)||foodInput(T))return;
   if(ds.hab){const h=S.habits.find(x=>x.id===ds.hab);if(h){const v=String(T.value).trim();habSet(h,hDate(),v===''?0:Math.max(0,Math.min(100000,num(v))));save()}return}
   if(ds.note){const k=ds.note,D=dayMut(k);D.note=String(T.value).slice(0,4000);dayTidy(k);save();return}
   if(ds.hf){if(habEdit)habEdit[ds.hf]=T.value;return}
   if(ds.gf){if(goalEdit)goalEdit[ds.gf]=T.value;return}
   if(ds.goalv){const g=S.goals.find(x=>x.id===ds.goalv);if(g&&String(T.value).trim()!==''){g.cur=num(T.value);save()}return}
   if(ds.meas){const k=today(),D=dayMut(k),m=D.meas||(D.meas={}),v=num(T.value);if(v>0&&v<400)m[ds.meas]=Math.round(v*10)/10;else delete m[ds.meas];dayTidy(k);save();return}
   if(ds.w){const k=ds.w,v=num(T.value);if(String(T.value).trim()===''){if(S.days[k]){delete S.days[k].w;dayTidy(k)}}else if(bwOk(v))dayMut(k).w=Math.round(v*10)/10;WL=null;save();return}
   if(ds.mf){if(meal&&meal.res)meal.res[ds.mf]=T.value;return}
   if(ds.fe){if(foodEdit)foodEdit[ds.fe]=T.value;return}
   if(T.id==='mealText'){if(meal)meal.text=T.value;return}
   if(T.id==='mealNote'){if(meal)meal.note=T.value;return}
   if(T.id==='importBox'){importText=T.value;return}}
  {const id=e.target.id||'';const m={newName:'name',newKind:'kind',newCat:'cat',newCatName:'catName',newMet:'met',newSport:'sport'};
   if(m[id]){newForm[m[id]]=e.target.value;return}if(id==='edCat')edForm.cat=e.target.value;if(id==='edCatName')edForm.catName=e.target.value}
  const t=e.target,f=t.dataset.f;if(!f)return;if(f==='planName'){if(planEdit)planEdit.name=t.value;return}ensureDraft();
  if(f==='set'){const en=S.draft.entries[+t.dataset.e];if(en&&en.sets[+t.dataset.s])en.sets[+t.dataset.s][t.dataset.k]=t.value;
    if(en&&t.dataset.k==='a'){const pe=document.getElementById('pred-'+t.dataset.e+'-'+t.dataset.s),ex=exById(en.exId);if(pe&&ex)pe.innerHTML=predHtml(curRm(ex.id,S.draft),num(t.value))}}
  else if(f==='planName'){if(planEdit)planEdit.name=t.value;return}
  else S.draft[f]=t.value;
  save();
});
document.addEventListener('change',e=>{const id=e.target.id;
  {const T=e.target,ds=T.dataset||{};if(trainChange(T)||foodChange(T))return;
   if(ds.hab||ds.goalv||ds.w){userActed=true;softRender();return}
   if(ds.gf){if(goalEdit)goalEdit[ds.gf]=T.value;if(T.tagName==='SELECT')render();return}
   if(ds.hf){if(habEdit)habEdit[ds.hf]=T.value;return}
   if(id==='mealFav'){if(meal)meal.fav=T.checked;return}
   if(id==='photoUp'){const f=T.files&&T.files[0];if(f){userActed=true;photoUpload(f)}T.value='';return}
   if(id==='bkFile'){const f=T.files&&T.files[0];T.value='';if(f)bkRead(f);return}}
  {const m={newKind:'kind',newCat:'cat',newSport:'sport'};if(m[id])newForm[m[id]]=e.target.value;if(id==='edCat')edForm.cat=e.target.value}
  if(id==='newCat'||id==='edCat'){const pre=id.slice(0,-3);const inp=document.getElementById(pre+'CatName');if(inp){inp.hidden=e.target.value!=='__new';if(!inp.hidden)inp.focus()}}
  if(id==='progSel'){S.ui.progEx=e.target.value;render();return}
  if((id==='durH'||id==='durM')&&S.draft){userActed=true;const v=num(document.getElementById('durH').value)*60+num(document.getElementById('durM').value);S.draft.dur=v;S.draft.durSet=true;render();return}
  if(id==='newKind'||id==='newSport'){updMetFields('new',document.getElementById('newKind').value)}
  else if(id==='edSport'){const ex=exById(editEx);if(ex)updMetFields('ed',ex.kind)}});
document.addEventListener('keydown',e=>{if(foodKey(e))return;if(e.key==='Enter'&&e.target.id==='newName'){e.preventDefault();act('addEx',e.target)}
  const ds=e.target.dataset||{};if(e.key==='Enter'&&e.target.tagName==='INPUT'&&(ds.hab||ds.w||ds.goalv||ds.meas)){e.preventDefault();e.target.blur()}
  if(e.key==='Escape'&&photoOpen){photoOpen=null;render()}});
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG')t.classList.add('broken')},true);
/* App-Gefühl: Antippen sichtbar machen, Tastatur blendet die Tab-Leiste aus, nur der Inhalt lässt sich ziehen */
document.addEventListener('touchstart',()=>{},{passive:true});
document.addEventListener('touchmove',e=>{const t=e.target;if(e.cancelable&&t&&t.closest&&!t.closest('main.scr'))e.preventDefault()},{passive:false});
const isText=el=>!!el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!/^(date|checkbox|radio|range|button|submit)$/i.test(el.type||'')));
const coarse=(()=>{try{return matchMedia('(pointer: coarse)').matches}catch(e){return false}})();
document.addEventListener('focusin',e=>{if(coarse&&isText(e.target))document.body.classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!isText(document.activeElement))document.body.classList.remove('kb')},60));
(function(){const st=stage();
  st.addEventListener('touchstart',e=>{if(trans||drag||e.touches.length!==1)return;const sc=curScr;if(!sc||sc.depth<1||!sc.back)return;
    const t=e.touches[0],r=st.getBoundingClientRect();if(t.clientX-r.left>28)return;
    drag={x0:t.clientX,y0:t.clientY,dx:0,w:r.width||360,on:false,pts:[[t.clientX,e.timeStamp]]}},{passive:true});
  st.addEventListener('touchmove',e=>{const g=drag;if(!g||g.settling)return;const t=e.touches[0],dx=t.clientX-g.x0,dy=t.clientY-g.y0;
    if(!g.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){drag=null;return}if(dx<8)return;dragStart()}
    if(e.cancelable)e.preventDefault();g.dx=Math.max(0,Math.min(g.w,dx));g.pts.push([t.clientX,e.timeStamp]);if(g.pts.length>6)g.pts.shift();dragMove()},{passive:false});
  const fin=e=>{const g=drag;if(!g||g.settling)return;if(!g.on){drag=null;return}noClickUntil=Date.now()+400;
    const a=g.pts[0],b=g.pts[g.pts.length-1],v=(b[0]-a[0])/Math.max(16,b[1]-a[1]);
    dragEnd(e.type!=='touchcancel'&&(g.dx>g.w*.35||(v>.45&&g.dx>24)))};
  st.addEventListener('touchend',fin);st.addEventListener('touchcancel',fin)})();
render();
storeInit();
})();
