  const rc=recs.length?`<div class="card section"><div class="sec-h"><b>Bestwerte</b><span class="small muted">alle Zeiten</span></div>
    <div class="recs">${vis.map(({e,r})=>`<div class="rec"><b>${esc(e.name)}${r.some(c=>isNew(c.d))?'<span class="prbadge">NEU</span>':''}</b><div class="rec-g">${r.map(c=>`<div class="rec-c"><span>${c.k}</span><b class="num">${c.v}</b><span>${c.s?esc(c.s)+' · ':''}${dmy(c.d)}</span></div>`).join('')}</div></div>`).join('')}</div>
    ${recs.length>4?`<button class="btn small ghost" data-act="anaRecAll">${allR?'Weniger anzeigen':'Alle '+recs.length+' Übungen anzeigen'}</button>`:''}</div>`:'';
  // Sätze pro Muskelgruppe
  const cnt={};for(const x of R.list)for(const e of x.entries){const ex=exById(e.exId);if(!ex||isAusd(ex))continue;const n=cleanSets(ex,e.sets).length;if(!n)continue;const k=ex.cat||'Ohne Kategorie';cnt[k]=(cnt[k]||0)+n}
  const base=['Beine','Brust','Rücken','Schultern','Arme','Bauch & Core'];
  const cats=base.concat(Object.keys(cnt).filter(k=>!base.includes(k)).sort((a,b)=>a.localeCompare(b,'de')));
  const per=k=>(cnt[k]||0)/R.weeks,mx=Math.max(25,...cats.map(per))*1.05,pc=v=>(v/mx*100).toFixed(1);
  const rows=cats.map(k=>{const v=per(k);return `<div class="hbar"><span>${esc(k)}</span><div class="tr"><i class="band" style="left:${pc(10)}%;width:${pc(10)}%"></i><i class="fill ${v<10?'lo':v<=20?'ok':'hi'}" style="width:${pc(v)}%"></i></div><span class="v num">${fmt(v,1)}</span></div>`}).join('');
  const hints=[],bb=per('Brust'),rr=per('Rücken'),up=bb+rr+per('Schultern')+per('Arme'),lg=per('Beine'),tot=cats.reduce((t,k)=>t+per(k),0),none=base.filter(k=>!cnt[k]);
  if(Math.max(bb,rr)>=3&&Math.max(bb,rr)>1.5*Math.min(bb,rr))hints.push(bb>rr?`Deutlich mehr Brust als Rücken (${fmt(bb,1)} zu ${fmt(rr,1)} Sätze). Ein ähnliches Verhältnis von Druck- und Zugübungen entlastet die Schultern.`:`Deutlich mehr Rücken als Brust (${fmt(rr,1)} zu ${fmt(bb,1)} Sätze). Ein ähnliches Verhältnis von Zug- und Druckübungen gilt als ausgewogen.`);
  if(up>=8&&lg<up/4)hints.push(`Beine kommen im Verhältnis zum Oberkörper kurz (${fmt(lg,1)} zu ${fmt(up,1)} Sätze pro Woche).`);
  if(tot>=8&&none.length)hints.push('Im Zeitraum nicht trainiert: '+none.join(', ')+'.');
  const ms=tot?`<div class="card section"><div class="lbl-row"><b>Sätze pro Muskelgruppe</b>${infoBtn('aiMs','Sätze pro Muskelgruppe')}</div>${iBox('aiMs',MS_INFO)}
    <div class="small muted">Ø pro Woche im Zeitraum · grüner Bereich: 10–20 Sätze</div><div class="hbars">${rows}</div>${hints.map(h=>`<div class="note">${h}</div>`).join('')}</div>`:'';
  // Bewegtes Gewicht
  const vol=R.bk.map(b=>{let v=0;for(const x of R.list)if(inBk(b,x.date))for(const e of x.entries){const ex=exById(e.exId);if(ex&&ex.kind==='kraft')v+=volume(cleanEntry(ex,e),'kraft')}return {label:b.label,parts:[v/1000]}});
  const vc=vol.some(b=>b.parts[0]>0)?`<div class="card section"><div><b>Bewegtes Gewicht</b><div class="small muted">Tonnen pro ${R.weekly?'Woche':'Monat'}, Summe aus Gewicht × Wiederholungen</div></div>${sBars(vol,{cur:true,label:'Bewegtes Gewicht in Tonnen'})}</div>`:'';
  const any=plH||det||rc||ms||vc;
  if(!any)return '<div class="card empty"><b style="color:var(--ink)">Noch keine Kraftübungen</b>Sobald du Kraft- oder Körpergewichtsübungen einträgst, siehst du hier Bestwerte und Verläufe.</div>';
  return `${plH}${det}${rc}${ms}${vc}${pl.length?'':'<div class="small muted" style="text-align:center">Kein Plateau erkannt.</div>'}`;
}

/* Ausdauer */
function anaAusd(R){
  const ds=S.exercises.filter(e=>e.kind==='distanz'&&S.sessions.some(x=>x.entries.some(en=>en.exId===e.id&&cleanSets(e,en.sets).some(st=>num(st.a)>0))));
  if(!ds.length)return '<div class="card empty"><b style="color:var(--ink)">Noch keine Ausdauer-Einträge</b>Leg eine Übung mit „Distanz und Zeit“ an, zum Beispiel Laufen. Dann siehst du hier Tempo und Kilometer.</div>';
  if(!ds.find(e=>e.id===S.ui.anaRun))S.ui.anaRun=ds[0].id;
  const ex=exById(S.ui.anaRun),rad=(ex.sport||'laufen')==='rad';
  const spd=(km,m)=>rad?km/(m/60):m/km,sf=v=>rad?fmt(v,1):paceTxt(v),su=rad?'km/h':'min/km',better=(a,b)=>rad?a>b:a<b;
  const agg=x=>{let km=0,kT=0,mT=0;for(const e of x.entries){if(e.exId!==ex.id)continue;for(const st of cleanSets(ex,e.sets)){const k=num(st.a),m=setMin(ex,st);km+=k;if(k>0&&m>0){kT+=k;mT+=m}}}return {km,kT,mT}};
  const ses=R.list.map(x=>({x,...agg(x)})).filter(s=>s.km>0);
  const km=ses.reduce((t,s)=>t+s.km,0),kT=ses.reduce((t,s)=>t+s.kT,0),mT=ses.reduce((t,s)=>t+s.mT,0);
  const tiles=`<div class="tiles"><div class="tile"><div class="v num">${fmt(km,1)}<small>km</small></div><div class="k">im Zeitraum</div></div>
    <div class="tile"><div class="v num">${fmt(km/R.weeks,1)}<small>km</small></div><div class="k">Ø pro Woche</div></div>
    <div class="tile"><div class="v num">${ses.length}</div><div class="k">Einheiten</div></div>
    <div class="tile"><div class="v num">${kT?sf(spd(kT,mT)):'–'}<small>${su}</small></div><div class="k">Ø Tempo</div></div></div>`;
  const pts=ses.filter(s=>s.kT>0).map(s=>({t:dayN(s.x.date),v:spd(s.kT,s.mT)}));
  let best=null;for(const p of pts)if(!best||better(p.v,best.v))best=p;
  const pc=pts.length>=2?tChart([{pts,dots:true}],{invert:!rad,fy:sf,best,last:pts[pts.length-1],lastTxt:sf(pts[pts.length-1].v),label:'Tempo '+ex.name}):`<div class="small muted">${pts.length?'Noch eine Einheit mit Zeit im Zeitraum mehr, dann erscheint hier die Kurve.':'Miss beim Training die Zeit mit, dann siehst du hier dein Tempo.'}</div>`;
  const kmB=R.bk.map(b=>({label:b.label,parts:[ses.filter(s=>inBk(b,s.x.date)).reduce((t,s)=>t+s.km,0)]}));
  const L=sortedSessions().filter(x=>x.date<=today());let lg=null,fs=null;const wk={};
  for(const x of L)for(const e of x.entries){if(e.exId!==ex.id)continue;for(const st of cleanSets(ex,e.sets)){const k=num(st.a),m=setMin(ex,st);
    if(k>0&&(!lg||k>lg.v))lg={v:k,d:x.date};
    if(k>=1&&m>0){const v=spd(k,m);if(!fs||better(v,fs.v))fs={v,k,d:x.date}}
    if(k>0){const w=ymd(monday(parseD(x.date)));wk[w]=(wk[w]||0)+k}}}
  let bw=null;for(const w in wk)if(!bw||wk[w]>bw.v)bw={v:wk[w],d:w};
  const rec=[lg&&{k:'Längste Strecke',v:fmt(lg.v,1)+'<small> km</small>',s:dmy(lg.d)},fs&&{k:rad?'Schnellste Fahrt':'Schnellstes Tempo',v:sf(fs.v)+'<small> '+su+'</small>',s:fmt(fs.k,1)+' km · '+dmy(fs.d)},bw&&{k:'Beste Woche',v:fmt(bw.v,1)+'<small> km</small>',s:'KW '+isoWeek(parseD(bw.d))+' · '+dmy(bw.d)}].filter(Boolean);
  return `${ds.length>1?`<div class="chips">${ds.map(e=>`<button class="chip" data-act="anaRun" data-id="${e.id}" aria-pressed="${e.id===ex.id}">${esc(e.name)}</button>`).join('')}</div>`:''}
   ${tiles}
   <div class="card section"><div><b>Tempo</b><div class="small muted">${rad?'km/h pro Einheit, höher ist schneller':'min/km pro Einheit, weiter oben ist schneller'}</div></div>${pc}</div>
   <div class="card section"><div><b>Kilometer pro ${R.weekly?'Woche':'Monat'}</b></div>${sBars(kmB,{cur:true,label:'Kilometer'})}</div>
   ${rec.length?`<div class="card section"><div class="sec-h"><b>Bestwerte</b><span class="small muted">alle Zeiten</span></div><div class="rec-g">${rec.map(c=>`<div class="rec-c"><span>${c.k}</span><b class="num">${c.v}</b><span>${c.s}</span></div>`).join('')}</div></div>`:''}`;
}

/* Körper */
function anaKoerper(R){
  const pts=weightLog().filter(p=>p.date>=R.start&&p.date<=R.end).map(p=>({t:dayN(p.date),v:p.v}));
  const av=pts.map(p=>({t:p.t,v:avgOf(pts.filter(q=>q.t>p.t-7&&q.t<=p.t).map(q=>q.v))}));
  let bwH;
  if(pts.length>=2){const a0=av[0],a1=av[av.length-1],ch=a1.v-a0.v,wks=(a1.t-a0.t)/7;
    bwH=`<div class="tiles t3"><div class="tile"><div class="v num">${fmt(a1.v,1)}<small>kg</small></div><div class="k">Wochenschnitt aktuell</div></div>
     <div class="tile"><div class="v num">${sgnF(ch)}<small>kg</small></div><div class="k">im Zeitraum</div></div>
     <div class="tile"><div class="v num">${wks>=1?sgnF(ch/wks,2)+'<small>kg</small>':'–'}</div><div class="k">Ø pro Woche</div></div></div>
     ${tChart([{pts,line:false,dots:true,dcls:'dt',r:3.2},{pts:av,cls:'ln'}],{fy:v=>fmt(v,1),label:'Körpergewicht'})}
     <div class="legend"><span><i class="lg-dt"></i>gewogen</span><span><i class="lg-ln"></i>Wochenschnitt (7 Tage)</span></div>`}
  else bwH='<div class="small muted">Trag dein Körpergewicht unter Heute oder beim Training ein. Ab zwei Werten im Zeitraum siehst du hier den Verlauf.</div>';
  const kb=R.bk.map(b=>{let k=0,a=0;for(const x of R.list)if(inBk(b,x.date)){const p=kcd(x).parts||{};k+=p.kraft||0;a+=p.ausd||0}return {label:b.label,parts:[k,a]}});
  const K=kb.reduce((t,b)=>t+b.parts[0],0),A=kb.reduce((t,b)=>t+b.parts[1],0),T=K+A;
  const kc=T?`<div class="tiles t3"><div class="tile"><div class="v num">${fmt(Math.round(T),0)}</div><div class="k">kcal im Zeitraum</div></div>
     <div class="tile"><div class="v num">${fmt(Math.round(T/R.weeks),0)}</div><div class="k">kcal Ø pro Woche</div></div>
     <div class="tile"><div class="v num">${Math.round(A/T*100)}<small>%</small></div><div class="k">davon Ausdauer</div></div></div>
     ${sBars(kb,{cls:['bar','bar2'],label:'Verbrannte Kalorien'})}
     <div class="legend"><span><i class="lg-k"></i>Kraft</span><span><i class="lg-a"></i>Ausdauer</span></div>`:'<div class="small muted">Für die Kalorien braucht die App dein Körpergewicht.</div>';
  return `<div class="card section"><div><b>Körpergewicht</b><div class="small muted">Einzelne Messungen und Wochenschnitt, damit Wasserschwankungen nicht täuschen</div></div>${bwH}</div>
   <div class="card section"><div><b>Verbrannte Kalorien</b><div class="small muted">pro ${R.weekly?'Woche':'Monat'}, aufgeteilt in Kraft und Ausdauer</div></div>${kc}</div>`;
}

/* ---------- Ernährung ----------
   Grundumsatz: Mifflin-St-Jeor. Alltag: PAL-Faktor ohne Sport (angelehnt an die DGE-Werte).
   Training: Kalorien aus den eingetragenen Einheiten (MET-Schätzung oben) abzüglich des Ruheanteils, gemittelt über bis zu 4 Wochen.
   Ziel: Abnehmen −20 % (max. 750 kcal, nie unter Grundumsatz), Zunehmen +10 % (max. 500 kcal).
   Eiweiß: g/kg je nach Trainingsart und -häufigkeit, +0,4 beim Abnehmen (max. 2,4). High-Carb: Fett 20 %.
   Fett: 30 % der Kalorien (mind. 0,7 g/kg), ketogen: Rest nach Eiweiß und 30 g Kohlenhydraten. Kohlenhydrate: Rest. */
const N_GOALS=[['ab','Abnehmen'],['halten','Halten'],['zu','Zunehmen']];
const N_DIETS=[['normal','Ausgewogen'],['keto','Ketogen'],['highcarb','High-Carb']];
const N_PAL=[['1.4','Überwiegend sitzend','z. B. Büro, Homeoffice, kaum Wege zu Fuß'],['1.6','Sitzend, zwischendurch auf den Beinen','z. B. Studium, Schule, Labor, Fahrdienst'],['1.8','Überwiegend stehend oder gehend','z. B. Verkauf, Pflege, Gastronomie, Handwerk'],['2','Körperlich schwer','z. B. Bau, Landwirtschaft, Lager']];
const KETO_C=30;
const r10=v=>Math.round(v/10)*10,r5=v=>Math.round(v/5)*5;
const listJoin=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' und '+a[a.length-1];
const dm=s=>{const d=parseD(s);return d.getDate()+'.'+(d.getMonth()+1)+'.'};
function nut(){if(!S.nutri||typeof S.nutri!=='object')S.nutri={};const n=S.nutri;if(!n.goal)n.goal='halten';if(!n.diet||!N_DIETS.some(d=>d[0]===n.diet))n.diet='normal';if(!n.pal)n.pal='1.4';return n}

function dayTidy(k){const d=S.days[k];if(!d)return;for(const f of Object.keys(d)){const v=d[f];if(v==null||v===''||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length))delete d[f]}if(!Object.keys(d).length)delete S.days[k]}
function offFrom(k,n){const d=parseD(k);d.setDate(d.getDate()+n);return ymd(d)}
function offDate(off){return offFrom(today(),off)}
function dayTitle(k){const t=today();if(k===t)return 'Heute';const n=dayN(t)-dayN(k);if(n===1)return 'Gestern';const d=parseD(k);return WD[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'}
function dayLong(k){const d=parseD(k);return WDLONG[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]}
function hhmm(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmtH(h){const m=Math.round(num(h)*60);return Math.floor(m/60)+':'+pad(m%60)}
const rnd1=v=>Math.round(num(v)*10)/10;
function rangeDays(n){const o=[];for(let i=n-1;i>=0;i--)o.push(offDate(-i));return o}
function trainDates(){const m={};for(const x of S.sessions)(m[x.date]=m[x.date]||[]).push(x);return m}

/* Gewicht aus allen Quellen: Training, Körper-Modul, Angaben zur Ernährung */
let WL=null;
function weightLog(){if(WL)return WL;const m={};
  for(const x of S.sessions)if(bwUse(x))(m[x.date]=m[x.date]||[]).push(num(x.bw));
  for(const k in S.days){const w=num(S.days[k].w);if(bwOk(w))(m[k]=m[k]||[]).push(w)}
  const n=S.nutri||{};if(bwOk(n.weight)&&n.wDate)(m[n.wDate]=m[n.wDate]||[]).push(num(n.weight));
  WL=Object.keys(m).sort().map(d=>({date:d,v:avgOf(m[d])}));return WL}
function weightAt(k){let b=null;for(const p of weightLog()){if(p.date<=k)b=p;else break}return b}
function lastWeight(){const L=weightLog();return L.length?L[L.length-1]:null}
function trendTxt(){const L=weightLog();if(L.length<2)return '';const t=dayN(today());
  const a=L.filter(p=>t-dayN(p.date)<7),b=L.filter(p=>t-dayN(p.date)>=7&&t-dayN(p.date)<21);if(!a.length||!b.length)return '';
  const av=avgOf(a.map(p=>p.v));return 'Ø letzte 7 Tage '+fmt(av,1)+' kg · '+sgnF(av-avgOf(b.map(p=>p.v)))+' kg zu den 2 Wochen davor'}

/* ---------- Gewohnheiten ---------- */
function habitDue(h,k){if(h.created&&k<h.created)return false;if(h.kind==='quit'){const s=h.start||h.since;return !s||k>=s}
  const dw=parseD(k).getDay();return !Array.isArray(h.days)||!h.days.length||h.days.includes(dw)}
function habVal(h,k){const v=(dayGet(k).h||{})[h.id];return v==null?0:v}
function habDone(h,k){if(!habitDue(h,k))return false;if(h.kind==='quit')return habVal(h,k)!==-1;const v=Math.max(0,num(habVal(h,k)));return h.kind==='check'?v>0:v>=Math.max(1,num(h.target)||1)}
function habSet(h,k,v){const D=dayMut(k);if(!D.h)D.h={};if(v===0||v===''||v==null)delete D.h[h.id];else D.h[h.id]=v;dayTidy(k)}
function quitDays(h,k){return h.since?Math.max(0,dayN(k)-dayN(h.since)):0}
function habSub(h){if(h.kind==='check')return 'einmal am Tag';if(h.kind==='quit')return h.since?'ohne seit '+dmy(h.since):'Abstinenz';return 'Ziel '+fmt(num(h.target)||1)+' '+(h.unit||(h.kind==='count'?'mal':''))}
function habDaysTxt(h){if(h.kind==='quit'||!Array.isArray(h.days)||!h.days.length||h.days.length===7)return '';return ' · '+[1,2,3,4,5,6,0].filter(d=>h.days.includes(d)).map(d=>WD[d]).join(', ')}
function habRow(h,k){
  const v=habVal(h,k),done=habDone(h,k),id=h.id,name=esc(h.name);
  if(h.kind==='check')return `<div class="hrow${done?' done':''}"><div class="hr-l"><b>${name}</b><span>${done?'Erledigt':'Offen'}</span></div><button class="hchk${done?' on':''}" data-act="habTog" data-id="${id}" aria-pressed="${done}" aria-label="${name} ${done?'zurücknehmen':'abhaken'}">${CHECK_IC}</button></div>`;
  if(h.kind==='quit'){const rel=v===-1,n=rel?0:quitDays(h,k),ck='habRelapse:'+id;
    return `<div class="hrow${rel?'':' done'}"><div class="hr-l"><b>${name}</b><span>${rel?'Rückfall an diesem Tag':h.since?'ohne seit '+dmy(h.since):''}</span>
      ${k===today()?(rel?`<button class="lnk" data-act="habUnrelapse" data-id="${id}">Zurücknehmen</button>`:`<button class="lnk lnk-bad" data-act="habRelapse" data-id="${id}">${confirmKey===ck?'Wirklich Rückfall eintragen?':'Rückfall eintragen'}</button>`):''}</div>
      <div class="qcount"><b class="num">${n}</b><span>${n===1?'Tag':'Tage'}</span></div></div>`}
  const t=Math.max(1,num(h.target)||1),u=esc(h.unit||(h.kind==='count'?'mal':'')),val=Math.max(0,num(v)),pct=Math.min(100,val/t*100).toFixed(1);
  if(h.kind==='count'){const vis=t<=12?`<div class="hsq" aria-hidden="true">${Array.from({length:t},(_,i)=>`<i class="${i<val?'on':''}"></i>`).join('')}</div>`:`<div class="pbar" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
    return `<div class="hrow${done?' done':''}"><div class="hr-l"><b>${name}</b><span class="num">${fmt(val)} von ${fmt(t)} ${u}</span>${vis}</div>
      <div class="hamt"><button class="nudge" data-act="habInc" data-id="${id}" data-d="-1" aria-label="${name}: eins weniger">−</button><button class="nudge plus" data-act="habInc" data-id="${id}" data-d="1" aria-label="${name}: eins mehr">+</button></div></div>`}
  const st=num(h.step)||Math.max(1,Math.round(t/4));
  return `<div class="hrow${done?' done':''}"><div class="hr-l"><b>${name}</b><span class="num">${fmt(val)} von ${fmt(t)} ${u}</span><div class="pbar" aria-hidden="true"><i style="width:${pct}%"></i></div></div>
    <div class="hamt"><button class="nudge" data-act="habInc" data-id="${id}" data-d="${-st}" aria-label="${name}: ${fmt(st)} weniger">−</button><input class="hin num" type="text" inputmode="decimal" id="hv-${id}" data-hab="${id}" value="${val?fmt(val):''}" placeholder="0" aria-label="${name} in ${u}"><button class="nudge plus" data-act="habInc" data-id="${id}" data-d="${st}" aria-label="${name}: ${fmt(st)} mehr">+</button></div></div>`;
}
function habitsCard(k){
  const act=S.habits.filter(h=>!h.arch),due=act.filter(h=>habitDue(h,k));
  if(!act.length)return `<div class="card pane"><div class="pane-h"><span class="eyebrow">Gewohnheiten</span></div>
    <div class="small muted">Alles Kleine läuft hier: Wasser, Lesen, Lernen oder Tage ohne Zucker. Tippe eine Vorlage an oder leg eine eigene an.</div>
    <div class="sugg">${H_SUGG.slice(0,6).map((s,i)=>`<button data-act="habAddSugg" data-i="${i}">+ ${esc(s.name)}</button>`).join('')}</div>
    <button class="btn small" data-act="tab" data-v="gewohnheiten">Eigene Gewohnheit</button></div>`;
  const dn=due.filter(h=>habDone(h,k)).length;
  return `<div class="card pane"><div class="pane-h"><span class="eyebrow">Gewohnheiten <span class="cnt num">${dn}/${due.length}</span></span><button class="lnk" data-act="tab" data-v="gewohnheiten">Verwalten</button></div>
    ${due.length?`<div class="hlist">${due.map(h=>habRow(h,k)).join('')}</div>`:'<div class="small muted">An diesem Tag steht keine Gewohnheit an.</div>'}</div>`;
}
let habEdit=null;
function viewHabits(){
  if(habEdit)return habForm();
  const act=S.habits.filter(h=>!h.arch),arch=S.habits.filter(h=>h.arch),names=new Set(S.habits.map(h=>h.name.toLowerCase()));

  return `<button class="btn primary block big" data-act="newHab">+ Neue Gewohnheit</button>
   ${sug.length?`<div class="grp"><span class="eyebrow">Vorlagen</span><div class="sugg">${sug.map(o=>`<button data-act="habAddSugg" data-i="${o.i}">+ ${esc(o.s.name)}</button>`).join('')}</div></div>`:''}
   ${act.length?`<div class="card pane"><div class="pane-h"><span class="eyebrow">Deine Gewohnheiten <span class="cnt">${act.length}</span></span></div><div class="plist">${act.map((h,i)=>`<div class="pitem"><div class="pmove"><button class="iconbtn" data-act="habMove" data-id="${h.id}" data-d="-1" aria-label="Nach oben"${i===0?' disabled':''}>↑</button><button class="iconbtn" data-act="habMove" data-id="${h.id}" data-d="1" aria-label="Nach unten"${i===act.length-1?' disabled':''}>↓</button></div>
     <div class="nm"><b>${esc(h.name)}</b><span class="small muted">${HKIND[h.kind][0]} · ${esc(habSub(h))}${habDaysTxt(h)}</span></div><button class="btn small ghost" data-act="editHab" data-id="${h.id}">Bearbeiten</button></div>`).join('')}</div></div>`
     :'<div class="card empty"><b>Noch keine Gewohnheiten</b>Tippe oben eine Vorlage an oder leg eine eigene an. Sie erscheinen dann jeden Tag unter Heute.</div>'}
   ${arch.length?`<div class="card pane"><div class="pane-h"><span class="eyebrow">Pausiert</span></div><div class="plist">${arch.map(h=>`<div class="pitem"><div class="nm"><b>${esc(h.name)}</b><span class="small muted">${HKIND[h.kind][0]}</span></div><button class="btn small ghost" data-act="unarchHab" data-id="${h.id}">Fortsetzen</button></div>`).join('')}</div></div>`:''}`;
}
function habForm(){const h=habEdit,k=h.kind||'check',days=Array.isArray(h.days)&&h.days.length?h.days:[0,1,2,3,4,5,6];
  return `<section class="section"><div class="card section">
   <label class="field"><span class="eyebrow">Name</span><input class="in" id="hfName" data-hf="name" maxlength="40" value="${esc(h.name||'')}" placeholder="z. B. Wasser, Lesen, Kein Zucker"></label>
   <div class="field"><span class="eyebrow">Art</span><div class="seg" role="group" aria-label="Art">${Object.entries(HKIND).map(([v,l])=>`<button data-act="habKind" data-v="${v}" aria-pressed="${k===v}">${l[0]}</button>`).join('')}</div><span class="small muted">${HKIND[k][1]}</span></div>
   ${k==='count'||k==='amount'?`<div class="row"><label class="field"><span class="eyebrow">Ziel pro Tag</span><input class="in num" id="hfTarget" data-hf="target" inputmode="decimal" value="${esc(h.target??'')}" placeholder="${k==='count'?'8':'20'}"></label>
     <label class="field"><span class="eyebrow">Einheit</span><input class="in" id="hfUnit" data-hf="unit" maxlength="12" value="${esc(h.unit||'')}" placeholder="${k==='count'?'Gläser':'Seiten'}"></label>
     ${k==='amount'?`<label class="field"><span class="eyebrow">Schritt für + und −</span><input class="in num" id="hfStep" data-hf="step" inputmode="decimal" value="${esc(h.step??'')}" placeholder="5"></label>`:''}</div>`:''}
   ${k==='quit'?`<label class="field"><span class="eyebrow">Ohne seit</span><input class="in" type="date" id="hfSince" data-hf="since" value="${esc(h.since||today())}"></label>`:
     `<div class="field"><span class="eyebrow">An diesen Tagen</span><div class="wdays" role="group" aria-label="Wochentage">${[1,2,3,4,5,6,0].map(d=>`<button data-act="habDay" data-v="${d}" aria-pressed="${days.includes(d)}">${WD[d]}</button>`).join('')}</div></div>`}
  </div>${flash?`<div class="err">${flash}</div>`:''}
  <button class="btn primary block big" data-act="saveHab">Speichern</button>
  ${h.id?`<div class="row"><button class="btn ghost" data-act="archHab" data-id="${h.id}">Pausieren</button><button class="btn danger" data-act="delHab" data-id="${h.id}">${confirmKey==='delHab:'+h.id?'Mit allen Einträgen löschen?':'Löschen'}</button></div>`:''}
  </section>`}

/* ---------- Ziele ---------- */
let goalEdit=null;
const G_TYPES=[['weight','Gewicht'],['lift','Übung'],['habit','Gewohnheit'],['custom','Eigenes']];
function liftNow(exId){const ex=exById(exId);if(!ex)return 0;let m=0;
  for(const x of S.sessions)for(const e of x.entries){if(e.exId!==exId)continue;const ss=cleanSets(ex,e.sets);m=Math.max(m,ex.kind==='kraft'?e1rmOf(ss):Math.max(0,...ss.map(s=>num(s.a))))}
  return Math.round(m*10)/10}
function goalName(g){if(g.type==='custom')return g.name||'Eigenes Ziel';if(g.type==='weight')return 'Zielgewicht '+fmt(g.target,1)+' kg';
  if(g.type==='lift'){const ex=exById(g.exId);return (ex?ex.name:'Übung')+': '+fmt(g.target)+' '+(ex&&ex.kind==='wdh'?'Wdh.':'kg 1RM')}
  const h=S.habits.find(x=>x.id===g.habitId);return (h?h.name:'Gewohnheit')+' an '+fmt(g.target)+' Tagen'}
function goalState(g){
  let cur=0,start=num(g.start),target=num(g.target),unit='';
  if(g.type==='weight'){const lw=lastWeight();cur=lw?lw.v:start;unit='kg'}
  else if(g.type==='lift'){cur=liftNow(g.exId);const ex=exById(g.exId);unit=ex&&ex.kind==='wdh'?'Wdh.':'kg'}
  else if(g.type==='habit'){start=0;unit='Tage';const h=S.habits.find(x=>x.id===g.habitId);if(h){const t=today();let k=g.created||t,n=0;for(let i=0;i<4000&&k<=t;i++){if(habDone(h,k))n++;k=offFrom(k,1)}cur=n}}
  else{cur=num(g.cur);unit=g.unit||''}
  const span=target-start;let pct=span===0?(cur>=target?1:0):(cur-start)/span;pct=Math.max(0,Math.min(1,pct));
  const done=span>=0?cur>=target:cur<=target,left=g.until?dayN(g.until)-dayN(today()):null;
  return {cur,start,target,unit,pct,done,left}}
function goalRow(g,s,compact){const u=s.unit?' '+esc(s.unit):'';
  return `<div class="gitem${s.done?' done':''}"><div class="goal-h"><b>${esc(goalName(g))}</b><span class="num">${Math.round(s.pct*100)} %</span></div>
   <div class="pbar" aria-hidden="true"><i style="width:${(s.pct*100).toFixed(1)}%"></i></div>
   <div class="goal-n num"><span>${g.type==='habit'?fmt(s.cur)+' von '+fmt(s.target)+u:'Jetzt '+fmt(s.cur,1)+u+' · Ziel '+fmt(s.target,1)+u}</span><span>${s.done?'Erreicht':s.left!=null?(s.left>=0?'noch '+s.left+(s.left===1?' Tag':' Tage'):'Frist vorbei'):''}</span></div>
   ${compact?'':`<div class="goal-up">${g.type==='custom'&&!s.done?`<label class="goal-cur"><span class="small muted">Stand</span><input class="hin num" type="text" inputmode="decimal" autocomplete="off" id="gv-${g.id}" data-goalv="${g.id}" value="${fmt(s.cur,2)}" aria-label="Aktueller Stand für ${esc(goalName(g))}"></label>`:'<span></span>'}<button class="lnk" data-act="editGoal" data-id="${g.id}" aria-label="${esc(goalName(g))} bearbeiten">Bearbeiten</button></div>`}</div>`}
function goalsCardToday(){const gs=S.goals.map(g=>({g,s:goalState(g)})).filter(o=>!o.s.done).slice(0,3);if(!gs.length)return '';
  return `<div class="card pane"><div class="pane-h"><span class="eyebrow">Ziele</span><button class="lnk" data-act="tab" data-v="ziele">Alle</button></div><div class="glist">${gs.map(o=>goalRow(o.g,o.s,true)).join('')}</div></div>`}
function viewGoals(){
  if(goalEdit)return goalForm();
  const all=S.goals.map(g=>({g,s:goalState(g)})),open=all.filter(o=>!o.s.done),done=all.filter(o=>o.s.done);
  return `<button class="btn primary block big" data-act="newGoal">+ Neues Ziel</button>
   ${open.length?`<div class="card pane"><div class="pane-h"><span class="eyebrow">Aktiv</span></div><div class="glist">${open.map(o=>goalRow(o.g,o.s)).join('')}</div></div>`:
     '<div class="card empty"><b>Noch keine Ziele</b>Setz dir ein Ziel für dein Gewicht, eine Übung, eine Gewohnheit oder einen eigenen Wert. Den Fortschritt rechnet die App aus deinen Einträgen aus.</div>'}
   ${done.length?`<div class="card pane"><div class="pane-h"><span class="eyebrow">Erreicht</span></div><div class="glist">${done.map(o=>goalRow(o.g,o.s)).join('')}</div></div>`:''}`}

  if(ty==='weight')f=`<label class="field"><span class="eyebrow">Zielgewicht (kg)</span><input class="in num" id="gfTarget" data-gf="target" inputmode="decimal" value="${esc(g.target??'')}" placeholder="z. B. 78"></label>
    <div class="small muted">${lw?'Start: '+fmt(lw.v,1)+' kg, zuletzt gewogen am '+dmy(lw.date):'Trag zuerst dein Gewicht ein, dann rechnet die App den Fortschritt aus.'}</div>`;
  else if(ty==='lift'){const sel=exById(g.exId)||exs[0];f=exs.length?`<div class="field"><span class="eyebrow">Übung</span><div class="chips wrap" role="group" aria-label="Übung">${exs.map(e=>`<button class="chip" data-act="gfPick" data-f="exId" data-v="${e.id}" aria-pressed="${!!sel&&sel.id===e.id}">${esc(e.name)}</button>`).join('')}<button class="chip add" data-act="exPick" data-to="goal">Andere …</button></div></div>
    <label class="field"><span class="eyebrow">${sel.kind==='wdh'?'Ziel: Wiederholungen in einem Satz':'Ziel: geschätztes 1RM in kg'}</span><input class="in num" id="gfTarget" data-gf="target" inputmode="decimal" value="${esc(g.target??'')}"></label>
    <div class="small muted">Aktuell: ${fmt(liftNow(sel.id),1)} ${sel.kind==='wdh'?'Wdh.':'kg'}</div>`:'<div class="small muted">Leg zuerst eine Kraft- oder Wiederholungsübung an.</div>'}
  else if(ty==='habit')f=hs.length?`<div class="field"><span class="eyebrow">Gewohnheit</span><div class="chips wrap" role="group" aria-label="Gewohnheit">${hs.map(h=>`<button class="chip" data-act="gfPick" data-f="habitId" data-v="${h.id}" aria-pressed="${(g.habitId||hs[0].id)===h.id}">${esc(h.name)}</button>`).join('')}</div></div>
    <label class="field"><span class="eyebrow">An wie vielen Tagen erledigen?</span><input class="in num" id="gfTarget" data-gf="target" inputmode="numeric" value="${esc(g.target??'')}" placeholder="z. B. 30"></label><div class="small muted">Gezählt wird ab dem Tag, an dem du das Ziel anlegst.</div>`:'<div class="small muted">Leg zuerst eine Gewohnheit an.</div>';
  else f=`<label class="field"><span class="eyebrow">Name</span><input class="in" id="gfName" data-gf="name" maxlength="50" value="${esc(g.name||'')}" placeholder="z. B. 5 km laufen in Minuten"></label>
    <div class="row"><label class="field"><span class="eyebrow">Einheit</span><input class="in" id="gfUnit" data-gf="unit" maxlength="12" value="${esc(g.unit||'')}" placeholder="z. B. Min"></label>
    <label class="field"><span class="eyebrow">Start</span><input class="in num" id="gfStart" data-gf="start" inputmode="decimal" value="${esc(g.start??'')}"></label>
    <label class="field"><span class="eyebrow">Ziel</span><input class="in num" id="gfTarget" data-gf="target" inputmode="decimal" value="${esc(g.target??'')}"></label></div>`;
  return `<section class="section"><div class="card section">
    <div class="field"><span class="eyebrow">Worauf bezieht sich das Ziel?</span><div class="seg" role="group" aria-label="Art des Ziels">${G_TYPES.map(([v,l])=>`<button data-act="goalType" data-v="${v}" aria-pressed="${ty===v}">${l}</button>`).join('')}</div></div>
    ${f}
    <label class="field"><span class="eyebrow">Bis (optional)</span><input class="in" type="date" id="gfUntil" data-gf="until" value="${esc(g.until||'')}"></label></div>
    ${flash?`<div class="err">${flash}</div>`:''}
    <button class="btn primary block big" data-act="saveGoal">Ziel speichern</button>
    ${g.id?`<button class="btn danger block" data-act="delGoal" data-id="${g.id}">${confirmKey==='delGoal:'+g.id?'Wirklich löschen?':'Ziel löschen'}</button>`:''}
  </section>`}

/* ---------- Heute ---------- */
let dayOff=0,bannerOff=false;
function hDate(){return offDate(dayOff)}
function defSleep(){const ks=Object.keys(S.days).sort().reverse();for(const k of ks){const s=S.days[k].sleep;if(s&&num(s.h))return num(s.h)}return 7.5}
function scaleHtml(act,cur,labels,lbl){return `<div class="scale" role="group" aria-label="${lbl}">${labels.map((l,i)=>`<button data-act="${act}" data-v="${i+1}" aria-pressed="${cur===i+1}"><b>${i+1}</b><span>${l}</span></button>`).join('')}</div>`}
function foodCardToday(k){
  const items=dayGet(k).food||[],t=sumFood(items),r=nCalc(),tg=r.miss?null:foodTarget(r,k);
  return `<div class="card pane"><div class="pane-h"><span class="eyebrow">Ernährung</span><button class="lnk" data-act="goFood" data-date="${k}">Tagebuch</button></div>
   <div class="kc-big"><b class="num">${fmt(Math.round(t.k),0)}</b><span>${tg?'von '+fmt(r10(tg.k),0)+' kcal':'kcal gegessen'}</span></div>

/* ---------- Strichcodes lesen: EAN-13, EAN-8 und UPC-A (als EAN-13 mit führender 0).
   Verfahren wie in ZXing: Zeile in Schwarz/Weiß umwandeln, Randzeichen mit Ruhezone suchen,
   Ziffern über Breitenverhältnisse erkennen, Prüfziffer kontrollieren. ---------- */
const EAN=(()=>{
  const L=[[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
  const LG=L.concat(L.map(p=>p.slice().reverse()));
  const FIRST=[0x00,0x0B,0x0D,0x0E,0x13,0x19,0x1C,0x15,0x16,0x1A];
  const SE=[1,1,1],MID=[1,1,1,1,1],AVG=0.48,IND=0.7;let MAXV=0.3,MAXV8=0.3;
  function pmv(c,p,maxInd){let t=0,pl=0;for(let i=0;i<c.length;i++){t+=c[i];pl+=p[i]}if(t<pl)return Infinity;
    const u=t/pl;maxInd*=u;let tv=0;for(let i=0;i<c.length;i++){const s=p[i]*u,v=c[i]>s?c[i]-s:s-c[i];if(v>maxInd)return Infinity;tv+=v}return tv/t}
  /* row: 1 = schwarz, 0 = weiß */
  function guard(row,off,whiteFirst,pat){const n=row.length,len=pat.length,c=new Array(len).fill(0);
    const want=whiteFirst?0:1;while(off<n&&row[off]!==want)off++;
    let pos=0,start=off,isWhite=whiteFirst;
    for(let x=off;x<n;x++){
      if((row[x]===1)!==isWhite)c[pos]++;
      else{
        if(pos===len-1){
          if(pmv(c,pat,IND)<AVG)return [start,x];
          start+=c[0]+c[1];for(let y=2;y<len;y++)c[y-2]=c[y];c[len-2]=0;c[len-1]=0;pos--;
        }else pos++;
        c[pos]=1;isWhite=!isWhite;
      }
    }
    return null}
  function rec(row,start,c){const n=row.length;c.fill(0);if(start>=n)return false;let isWhite=row[start]===0,pos=0,i=start;
    while(i<n){if((row[i]===1)!==isWhite)c[pos]++;else{if(++pos===c.length)break;c[pos]=1;isWhite=!isWhite}i++}
    return pos===c.length||(pos===c.length-1&&i===n)}
  let dv=0;const dw=[];
  function digit(row,c,off,pats){if(!rec(row,off,c))return -1;let best=AVG,bm=-1;
    for(let i=0;i<pats.length;i++){const v=pmv(c,pats[i],IND);if(v<best){best=v;bm=i}}if(bm>=0){dv+=best;dw.push(c[0]+c[1]+c[2]+c[3])}return bm}
  const sum4=c=>c[0]+c[1]+c[2]+c[3];
  function mid13(row,off){const c=[0,0,0,0];let lg=0,s='';
    for(let x=0;x<6;x++){const m=digit(row,c,off,LG);if(m<0)return null;s+=m%10;off+=sum4(c);if(m>=10)lg|=1<<(5-x)}
    const f=FIRST.indexOf(lg);if(f<0)return null;s=f+s;
    const g=guard(row,off,true,MID);if(!g)return null;off=g[1];
    for(let x=0;x<6;x++){const m=digit(row,c,off,L);if(m<0)return null;s+=m;off+=sum4(c)}
    return {s,off}}
  function mid8(row,off){const c=[0,0,0,0];let s='';
    for(let x=0;x<4;x++){const m=digit(row,c,off,L);if(m<0)return null;s+=m;off+=sum4(c)}
    const g=guard(row,off,true,MID);if(!g)return null;off=g[1];
    for(let x=0;x<4;x++){const m=digit(row,c,off,L);if(m<0)return null;s+=m;off+=sum4(c)}
    return {s,off}}
  function white(row,a,b){for(let i=a;i<b;i++)if(row[i])return false;return true}
  function tailEnd(row,off){const e=guard(row,off,false,SE);if(!e)return -1;const end=e[1],q=end+(end-e[0]);return q<row.length&&white(row,end,q)?end:-1}
  function check(s){if(!/^\d{8}$|^\d{13}$/.test(s))return false;let sum=0;for(let i=s.length-2,w=3;i>=0;i--,w=4-w)sum+=w*(+s[i]);return (10-sum%10)%10===+s[s.length-1]}
  /* Plausibel? Ziffern dürfen im Schnitt nur wenig vom Idealmuster abweichen und müssen gleich breit sein */
  function sane(nd,a,end){const u=(end-a)/(nd===12?95:67);if(u<1.45||dv/nd>(nd===8?MAXV8:MAXV))return false;for(const w of dw)if(Math.abs(w-7*u)>Math.max(2,u*2.4))return false;return true}
  function decodeRow(row){let next=0;
    for(let t=0;t<12;t++){const g=guard(row,next,false,SE);if(!g)return null;const a=g[0],b=g[1];next=b;
      const qs=a-(b-a);if(qs<0||!white(row,qs,a))continue;
      for(const mid of [mid13,mid8]){dv=0;dw.length=0;const r=mid(row,b);if(!r)continue;const e=tailEnd(row,r.off);if(e<0||!check(r.s))continue;
        if(sane(mid===mid13?12:8,a,e))return r.s}}
    return null}
  /* Schwellwert aus dem Helligkeits-Histogramm der Zeile (wie ZXing GlobalHistogramBinarizer) */
  function ghBlack(lum,n){const B=new Int32Array(32);for(let i=0;i<n;i++)B[lum[i]>>3]++;
    let first=0,maxC=0;for(let x=0;x<32;x++)if(B[x]>maxC){first=x;maxC=B[x]}
    let second=0,sc2=0;for(let x=0;x<32;x++){const d=x-first,sc=B[x]*d*d;if(sc>sc2){second=x;sc2=sc}}
    if(first>second){const t=first;first=second;second=t}
    if(second-first<=2)return -1;
    let best=second-1,bs=-1;for(let x=second-1;x>first;x--){const ff=x-first,sc=ff*ff*(second-x)*(maxC-B[x]);if(sc>bs){best=x;bs=sc}}
    return best<<3}
  function binGH(lum,n,out){const bp=ghBlack(lum,n);if(bp<0)return false;out.fill(0);let l=lum[0],c=lum[1];
    for(let x=1;x<n-1;x++){const r=lum[x+1];if((c*4-l-r)/2<bp)out[x]=1;l=c;c=r}return true}
  /* Schwellwert aus dem örtlichen Mittel, hilft bei Schatten und Verläufen */
  function binLocal(lum,n,out){let mn=255,mx=0;for(let i=0;i<n;i++){const v=lum[i];if(v<mn)mn=v;if(v>mx)mx=v}if(mx-mn<24)return false;
    const P=new Float64Array(n+1);for(let i=0;i<n;i++)P[i+1]=P[i]+lum[i];
    const h=Math.max(16,n>>4),off=Math.max(3,(mx-mn)*.06);
    for(let i=0;i<n;i++){const a=i-h<0?0:i-h,b=i+h+1>n?n:i+h+1;out[i]=lum[i]<(P[b]-P[a])/(b-a)-off?1:0}return true}
  const BIN=[binGH,binLocal];
  function decodeLum(lum,n){const row=new Uint8Array(n),rev=new Uint8Array(n);
    for(const bin of BIN){if(!bin(lum,n,row))continue;let r=decodeRow(row);if(r)return r;
      for(let i=0;i<n;i++)rev[i]=row[n-1-i];r=decodeRow(rev);if(r)return r}
    return null}
  /* Bildausschnitt (ImageData) zeilen- oder spaltenweise lesen; liefert {code: Anzahl Treffer} */
  function scan(img,cols,step){const d=img.data,w=img.width,h=img.height,n=cols?h:w,m=cols?w:h,lum=new Uint8Array(n),hits={};step=step||1;
    for(let k=0;k<m;k+=step){
      if(cols){let o=k*4;const st=w*4;for(let y=0;y<h;y++,o+=st)lum[y]=(d[o]+2*d[o+1]+d[o+2])>>2}
      else{let o=k*w*4;for(let x=0;x<w;x++,o+=4)lum[x]=(d[o]+2*d[o+1]+d[o+2])>>2}
      const r=decodeLum(lum,n);if(r)hits[r]=(hits[r]||0)+1}
    return hits}
  /* 12-stellige UPC-A als 13-stellige EAN schreiben */
  function norm(s){s=String(s||'').replace(/\D/g,'');if(s.length===12)s='0'+s;return s}
  return {decodeLum,scan,check,norm,set maxv(v){MAXV=v}};
})();

    k:Math.max(0,Math.round(num(p.k))),p:Math.max(0,rnd1(p.p)),c:Math.max(0,rnd1(p.c)),f:Math.max(0,rnd1(p.f)),sv:num(p.sv)>0?rnd1(p.sv):null,svt:String(p.svt||'').slice(0,30),

function words(q){return String(q||'').toLowerCase().split(/\s+/).filter(Boolean)}
function localMatches(q){const W=words(q);if(!W.length)return [];

/* ---------- Open Food Facts ---------- */
async function offGet(url,ms){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||9000);
  try{return await fetch(url,{signal:ctl.signal,credentials:'omit',mode:'cors'})}finally{clearTimeout(t)}}
function pickName(o){for(const v of [o.product_name_de,o.product_name,o.generic_name_de,o.generic_name]){
    if(v&&typeof v==='object'){const s=v.de||v.main||v.en||Object.values(v).find(x=>typeof x==='string'&&x.trim());if(s)return String(s).trim()}
    else if(v&&String(v).trim())return String(v).trim()}return ''}
function offNorm(o){if(!o||typeof o!=='object')return null;const N=o.nutriments||{};
  const nv=k=>{const v=N[k];return v==null||v===''||!isFinite(parseFloat(String(v).replace(',','.')))?null:num(v)};
  let k=nv('energy-kcal_100g');if(k==null){const kj=nv('energy-kj_100g')!=null?nv('energy-kj_100g'):nv('energy_100g');if(kj!=null)k=kj/4.184}
  const qt=String(o.quantity||''),u=/\d\s*(ml|cl|dl|l)\b/i.test(qt)&&!/\d\s*(g|kg)\b/i.test(qt)?'ml':'g';
  const br=(Array.isArray(o.brands)?o.brands.join(','):String(o.brands||'')).split(',')[0].trim();
  return {code:String(o.code||'').replace(/\D/g,''),n:pickName(o).slice(0,80),b:br.slice(0,40),q:qt.slice(0,30),u,
    k:k==null?null:Math.round(k),p:nv('proteins_100g'),c:nv('carbohydrates_100g'),f:nv('fat_100g'),
    sv:num(o.serving_quantity)>0?num(o.serving_quantity):null,svt:String(o.serving_size||'').slice(0,30),
    img:String(o.image_front_small_url||o.image_small_url||''),de:Array.isArray(o.countries_tags)&&o.countries_tags.includes('en:germany'),src:'off'}}
/* Ein Produkt per Barcode: {ok:true,p} oder {ok:false,why:'notfound'|'incomplete'|'offline'|'limit'|'error',p?}
   'limit': HTTP 429. Open Food Facts erlaubt 15 Produktabrufe pro Minute und Gerät (Doku, Stand Okt. 2026); dann nicht nachhaken,
   sonst verlängert jeder weitere Versuch die Sperre.
   Open Food Facts hat immer wieder kurze Störungen (Fehler 502/503, z. B. am 27.10.2026 für 14 Minuten). Deshalb bei Fehlern
   ein zweiter Versuch mit API v2, danach einer mit API v3 (v2 gilt als veraltet, läuft aber weiter). „Nicht gefunden“ zählt nicht als Fehler. */
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
async function offOne(c,ver,ms){const r=await offGet(OFF+(ver===3?'/api/v3/product/'+c+'?fields=':'/api/v2/product/'+c+'.json?fields=')+OFF_FIELDS,ms);
  if(r.status===404)return {nf:true};if(r.status===429){const e=new Error('limit');e.limit=true;throw e}if(!r.ok)throw new Error('http '+r.status);
  let j;try{j=await r.json()}catch(e){throw new Error('kein json')}
  if(ver===3){if(j&&j.product&&/^success/.test(String(j.status||'success')))return {p:j.product};if(j&&j.status==='failure')return {nf:true};throw new Error('v3 '+(j&&j.status))}
  if(j&&j.status==1&&j.product)return {p:j.product};if(j&&j.status==0)return {nf:true};throw new Error('v2 ohne status')}
async function offProduct(code,onWait){if(navigator.onLine===false)return {ok:false,why:'offline'};
  const codes=[code];if(code.length===13&&code[0]==='0')codes.push(code.slice(1));let err=false;
  for(const c of codes){let res=null;
    for(const [ver,wait,ms] of [[2,0,7000],[2,1200,7000],[3,800,6000]]){
      if(wait){if(onWait)onWait();await sleepMs(wait)}
      try{res=await offOne(c,ver,ms);break}catch(e){res=null;if(e&&e.limit)return {ok:false,why:'limit'};if(navigator.onLine===false)return {ok:false,why:'offline'}}}
    if(!res){err=true;continue}
    if(res.nf)continue;
    const p=offNorm({...res.p,code});if(!p)continue;
    if(!p.n||p.k==null)return {ok:false,why:'incomplete',p};
    return {ok:true,p}}
  return {ok:false,why:err?'error':'notfound'}}
/* Textsuche. Search-a-licious (search.openfoodfacts.org) sendet keine CORS-Kopfzeilen und ist aus dem Browser nicht nutzbar.
   Deshalb: klassische Suche, bei Störung (503, Zeitüberschreitung, HTML-Seite statt JSON) ein zweiter Versuch, danach die v2-Suche. */
async function offTry(url,key,ms){const r=await offGet(url,ms);if(!r.ok)throw new Error('http '+r.status);
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw new Error('kein json')}
  return (j&&Array.isArray(j[key])?j[key]:[]).map(offNorm).filter(p=>p&&p.n&&p.code)}
async function offSearch(q){const enc=encodeURIComponent(q),F='&fields='+OFF_FIELDS,wait=ms=>new Promise(r=>setTimeout(r,ms));
  const tries=[()=>offTry(OFF+'/cgi/search.pl?search_terms='+enc+'&search_simple=1&action=process&json=1&page_size=24&sort_by=unique_scans_n'+F,'products',12000),
    ()=>wait(1500).then(()=>offTry(OFF+'/cgi/search.pl?search_terms='+enc+'&search_simple=1&action=process&json=1&page_size=24'+F,'products',12000)),
    ()=>offTry(OFF+'/api/v2/search?search_terms='+enc+'&page_size=24&sort_by=unique_scans_n'+F,'products',12000)];
  let L=null,err=null;
  for(const t of tries){try{L=await t();if(L.length)break}catch(e){err=e}}
  if(!L){throw err||new Error('fehler')}
  const seen=new Set();L=L.filter(p=>!seen.has(p.code)&&seen.add(p.code));
  return L.map((p,i)=>({p,s:i+(p.de?0:6)})).sort((a,b)=>a.s-b.s).map(o=>o.p)}

function offSearchRun(){const m=fctx();if(!m)return;const q=m.q.trim();
  if(q.length<2){toast('Gib mindestens zwei Buchstaben ein');return}
  if(navigator.onLine===false){m.off={q,status:'offline',items:[]};resUpdate();return}
  const now=Date.now();while(offTimes.length&&now-offTimes[0]>60000)offTimes.shift();
  if(offTimes.length>=5){toast('Kurz warten: Open Food Facts erlaubt nur wenige Suchen pro Minute');return}
  offTimes.push(now);m.off={q,status:'loading',items:[]};resUpdate();
  const a=document.activeElement;if(a&&a.id==='foodQ')a.blur();
  offSearch(q).then(items=>{if(m.off.q===q&&m.off.status==='loading'){m.off={q,status:'done',items};if(fctx()===m)resUpdate()}},
    ()=>{if(m.off.q===q&&m.off.status==='loading'){m.off={q,status:navigator.onLine===false?'offline':'error',items:[]};if(fctx()===m)resUpdate()}})}

/* ---------- Kamera und Strichcode ---------- */
const SCAN={video:null,stream:null,track:null,raf:0,last:0,on:false,starting:false,frame:0,cv:null,cx:null,seen:{},tries:0,t0:0,lastSum:-1,lastChange:0,darkSince:0,bdBusy:false};

const BDET=(()=>{try{return 'BarcodeDetector' in window?new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a']}):null}catch(e){return null}})();
/* iOS-Fehler bei Apps auf dem Home-Bildschirm (WebKit-Bug 252465, auch unter iOS 26): Das Kamerabild bleibt schwarz oder steht still,
   video.play() kehrt manchmal nie zurück. Wächter: Kommt 4 s lang kein neues Bild (oder 5 s lang nur Schwarz), startet die Kamera
   einmal neu mit frischem Video-Element und einfacheren Vorgaben. Hilft das nicht, empfiehlt die App das Foto:
   Das öffnet die normale Kamera-App, die von dem Fehler nicht betroffen ist. */
function scanVideoDrop(){const v=SCAN.video;if(v&&v.parentNode)v.parentNode.removeChild(v);SCAN.video=null}
function scanStall(){if(!scan)return;scanStop();
  if(SCAN.tries<1){SCAN.tries++;scanVideoDrop();scan.status='start';scanMsg();setTimeout(()=>{if(scan&&curView()==='scan'&&scan.status==='start'&&!scan.code)scanStart(true)},250)}
  else{scan.status='stuck';render()}}
function scanVideoEl(){if(!SCAN.video){const v=document.createElement('video');v.setAttribute('playsinline','');v.setAttribute('muted','');v.muted=true;v.autoplay=true;SCAN.video=v}return SCAN.video}
function scanCanvas(w,h){if(!SCAN.cv){SCAN.cv=document.createElement('canvas');SCAN.cx=SCAN.cv.getContext('2d',{willReadFrequently:true})}
  if(SCAN.cv.width!==w)SCAN.cv.width=w;if(SCAN.cv.height!==h)SCAN.cv.height=h;try{SCAN.cx.imageSmoothingQuality='high'}catch(e){}return SCAN.cx}
async function scanStart(simple){if(SCAN.on||SCAN.starting||!scan)return;SCAN.starting=true;

    const st=await navigator.mediaDevices.getUserMedia({audio:false,video:simple?{facingMode:'environment'}:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    if(curView()!=='scan'||!scan||scan.code){st.getTracks().forEach(t=>t.stop());SCAN.starting=false;return}
    SCAN.stream=st;SCAN.track=st.getVideoTracks()[0];const v=scanVideoEl();v.srcObject=st;
    const box=document.getElementById('scanBox');if(box&&v.parentNode!==box)box.insertBefore(v,box.firstChild);
    /* play() kann auf dem iPhone hängen bleiben: höchstens 2,5 s warten, den Rest erledigt der Wächter */
    try{await Promise.race([v.play(),sleepMs(2500)])}catch(e){}
    if(!scan||curView()!=='scan'||scan.code){scanStop();SCAN.starting=false;return}
    try{SCAN.track.addEventListener('ended',()=>{if(SCAN.on&&scan&&!scan.code)scanStall()})}catch(e){}
    SCAN.on=true;SCAN.seen={};scan.status='run';SCAN.t0=SCAN.lastChange=Date.now();SCAN.lastSum=-1;SCAN.darkSince=0;
    /* Neues Bild erkennen: requestVideoFrameCallback (Safari ab 15.4, Chrome) und zusätzlich jedes veränderte Bild (Rauschen der Kamera) */
    if(v.requestVideoFrameCallback){const cb=()=>{if(!SCAN.on||SCAN.video!==v)return;SCAN.lastChange=Date.now();v.requestVideoFrameCallback(cb)};try{v.requestVideoFrameCallback(cb)}catch(e){}}

    SCAN.raf=requestAnimationFrame(scanFrame)}
  catch(e){if(scan)scan.status=e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'denied':'nocam'}
  SCAN.starting=false;if(curView()==='scan')scanMsg()}
function scanStop(){SCAN.on=false;cancelAnimationFrame(SCAN.raf);
  if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>{try{t.stop()}catch(e){}});SCAN.stream=null;SCAN.track=null}
  if(SCAN.video){try{SCAN.video.pause()}catch(e){}SCAN.video.srcObject=null}}
/* Nach jedem Zeichnen: Kamera an, solange die Scan-Seite offen ist, sonst aus */
function scanSync(){if(curView()==='scan'&&scan&&document.visibilityState!=='hidden'){
    const box=document.getElementById('scanBox'),v=scanVideoEl();
    if(box&&v.parentNode!==box){box.insertBefore(v,box.firstChild);if(SCAN.on)v.play().catch(()=>{})}
    if(!SCAN.on&&!SCAN.starting&&(scan.status==='start'||scan.status==='run'))scanStart()}
  else if(SCAN.on||SCAN.stream)scanStop()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')scanStop();else if(curView()==='scan'&&scan&&scan.status==='run'){scan.status='start';render()}});
/* Je Bild ein Band in der Mitte lesen: meist waagerecht, jedes dritte Bild senkrecht.
   Ein Code gilt erst, wenn er in zwei verschiedenen Bildern gelesen wurde. */
function scanHit(code,f){const now=Date.now(),s=SCAN.seen[code]=SCAN.seen[code]||{frames:new Set(),t:now};if(now-s.t>2500){s.frames=new Set();s.t=now}
  s.frames.add(f);if(s.frames.size>=2){scanFound(code);return true}return false}
function scanFrame(t){if(!SCAN.on)return;SCAN.raf=requestAnimationFrame(scanFrame);if(t-SCAN.last<70)return;SCAN.last=t;
  const v=SCAN.video,now=Date.now();
  /* Wächter: 4 s kein neues Bild oder 5 s nur Schwarz → Kamera neu starten */
  if(now-SCAN.lastChange>4000||(SCAN.darkSince&&now-SCAN.darkSince>5000)){scanStall();return}
  if(!v||v.readyState<2||!v.videoWidth)return;const vw=v.videoWidth,vh=v.videoHeight,f=SCAN.frame++;let hits,d;
  try{if(f%2===0){const cw=Math.min(vw,1920),ch=48,cx=scanCanvas(cw,ch);cx.drawImage(v,0,vh*.3,vw,vh*.4,0,0,cw,ch);d=cx.getImageData(0,0,cw,ch);hits=EAN.scan(d,false,1)}
    else{const ch=Math.min(vh,1920),cw=48,cx=scanCanvas(cw,ch);cx.drawImage(v,vw*.3,0,vw*.4,vh,0,0,cw,ch);d=cx.getImageData(0,0,cw,ch);hits=EAN.scan(d,true,1)}}catch(e){return}
  /* Neues Bild? (Prüfsumme ändert sich durch das Rauschen der Kamera) Nur Schwarz? (Kamera läuft, liefert aber kein Bild) */
  let sum=0,n=0,ck=0;for(let i=0;i<d.data.length;i+=16){const g=d.data[i]+d.data[i+1]+d.data[i+2];sum+=g;n++;ck=(ck*31+g)%1000000007}
  if(ck!==SCAN.lastSum){SCAN.lastSum=ck;SCAN.lastChange=now}
  if(n&&sum/n/3<5){if(!SCAN.darkSince)SCAN.darkSince=now}else SCAN.darkSince=0;
  for(const code in hits)if(scanHit(code,f))return;
  if(BDET&&!SCAN.bdBusy&&f%4===1){SCAN.bdBusy=true;BDET.detect(v).then(rs=>{SCAN.bdBusy=false;if(!SCAN.on)return;
      for(const r of rs||[]){const c=EAN.norm(String(r.rawValue||''));if((c.length===13||c.length===8)&&EAN.check(c)&&scanHit(c,'bd'+f))return}},()=>{SCAN.bdBusy=false})}}
function scanBeep(){try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
  try{if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=1650;g.gain.value=.05;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.08)}catch(e){}}
function scanFound(code){if(!scan||scan.code)return;scan.code=code;scanStop();scanBeep();scan.status='look';scanMsg();lookupCode(code)}
async function lookupCode(code){if(!scan)return;code=EAN.norm(code);scan.code=code;scan.status='look';scan.slow=false;scanMsg();
  const local=S.products.find(p=>p.code===code);
  if(local){openProduct(local,{replace:true,date:scan.date,to:scan.to});return}
  const r=await offProduct(code,()=>{if(scan&&scan.code===code){scan.slow=true;scanMsg()}});
  if(!scan||scan.code!==code||curView()!=='scan')return;scan.slow=false;
  if(r.ok){openProduct(saveProduct(r.p),{replace:true,date:scan.date,to:scan.to});return}
  if(r.why==='notfound'||r.why==='incomplete'){openOwnForm({...(r.p||{}),code},{replace:true,why:r.why,date:scan.date,to:scan.to});return}
  scan.status='err';scan.err=r.why==='offline'?'Keine Internetverbindung. Leg das Produkt selbst an oder versuch es später.':r.why==='limit'?'Open Food Facts lässt nur 15 Abfragen pro Minute zu, die sind gerade aufgebraucht. Warte eine Minute und tipp dann auf „Nochmal versuchen“, oder leg das Produkt selbst an.':'Open Food Facts antwortet gerade nicht, auch nach drei Versuchen. Das liegt an Open Food Facts, nicht an der App. Versuch es gleich noch einmal oder leg das Produkt selbst an.';render()}
async function scanPhoto(file){if(!scan)return;scan.status='photo';scanMsg();let best=null;
  try{const url=URL.createObjectURL(file);
    try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const s=Math.min(1,1600/Math.max(img.naturalWidth||1,img.naturalHeight||1)),w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));

      for(const cols of [false,true]){const hs=EAN.scan(d,cols,3);for(const c in hs)tally[c]=(tally[c]||0)+hs[c]}
      for(const c in tally)if(!best||tally[c]>tally[best])best=c;
      if(!best){/* weit weg fotografiert: Mitte in voller Auflösung */const nw=img.naturalWidth||1,nh=img.naturalHeight||1,cs=Math.min(1,2000/Math.max(nw*.6,nh*.6)),

        const d2=cx2.getImageData(0,0,w2,h2),t2={};for(const cols of [false,true]){const hs=EAN.scan(d2,cols,3);for(const c in hs)t2[c]=(t2[c]||0)+hs[c]}

  nocam:'Keine Kamera verfügbar. Tipp die Zahlen unter dem Strichcode ein oder nimm ein Foto.',err:s.err||''})[s.status]||''}

  if(recInput(T))return true;

  if(id==='prodG'){if(prod&&prod.p){prod.g=T.value;const el=document.getElementById('prodTot');if(el)el.innerHTML=totHtml(prodTotals(prod.p,num(T.value)))}return true}
  if(ds.pf){if(prod&&prod.form)prod.form[ds.pf]=T.value;return true}
  if(ds.pk){if(pick&&pick.res)pick.res[ds.pk]=T.value;return true}
  if(id==='scanCode'){if(scan)scan.typed=String(T.value).replace(/\D/g,'');return true}
  if(ds.fe==='g'&&foodEdit&&foodEdit.per){foodEdit.g=T.value;feFill(prodTotals(foodEdit.per,num(T.value)));return true}
  if(ds.fe==='por'&&foodEdit&&foodEdit.pp){foodEdit.por=T.value;feFill(rTot(foodEdit.pp,num(T.value)));return true}
  return false}
/* Tagebuch-Eintrag bearbeiten: neue Menge oder Portionen rechnen die Werte neu */
function feFill(T2){for(const k of ['k','p','c','f']){foodEdit[k]=T2[k];const inp=document.getElementById('fe-'+k);if(inp)inp.value=k==='k'?String(T2.k):vIn(T2[k],1)}}
function foodChange(T){const id=T.id;
  if(recChange(T))return true;
  if(id==='prodFav'){if(prod)prod.fav=T.checked;return true}
  if(id==='scanPhoto'){const f=T.files&&T.files[0];T.value='';if(f){scanStop();scanPhoto(f)}return true}
  if(id==='prodG'){if(prod&&prod.p)prod.g=num(T.value);return true}
  return false}
function foodKey(e){const t=e.target;if(e.key!=='Enter'||!t)return false;
  if(t.id==='foodQ'){e.preventDefault();offSearchRun();return true}
  if(t.id==='scanCode'){e.preventDefault();act('scanLookup',t);return true}
  if(t.id==='prodG'||t.id==='rvAmt'||/^(exQ|exPQ|exN|exMet|exCatN|teH|teM|teS|durH|durM)$/.test(t.id)||(t.dataset&&(t.dataset.ri||t.dataset.rf==='por'||t.dataset.rf==='w'||t.dataset.f==='set'||t.dataset.f==='bw'))){e.preventDefault();t.blur();return true}
  return false}
/* Ein Eintrag im Tagebuch. Mit g/u/per lässt sich die Menge später ändern, mit por/pp die Portionen eines Rezepts */
function addFood(k,x){const D=dayMut(k);const e={id:uid(),t:k===today()?hhmm():'12:00',n:String(x.n||'Mahlzeit').trim().slice(0,60)||'Mahlzeit',k:Math.round(num(x.k)),p:rnd1(x.p),c:rnd1(x.c),f:rnd1(x.f)};
  if(num(x.g)>0){e.g=rnd1(x.g);e.u=x.u==='ml'?'ml':'g'}
  if(x.per&&x.per.k!=null&&isFinite(num(x.per.k)))e.per={k:rnd2(x.per.k),p:rnd2(x.per.p),c:rnd2(x.per.c),f:rnd2(x.per.f)};
  if(!e.g&&num(x.por)>0&&x.pp&&isFinite(num(x.pp.k))){e.por=rnd2(x.por);e.pp={k:rnd2(x.pp.k),p:rnd2(x.pp.p),c:rnd2(x.pp.c),f:rnd2(x.pp.f)}}
  if(x.code)e.code=String(x.code);
  if(x.rec)e.rec=String(x.rec);
  (D.food=D.food||[]).push(e);return e}
/* ======================= Rezepte: anlegen, bearbeiten und portionsweise eintragen =======================
   S.recipes  [{id,n,por,w,note,items,used,uses,last,created}]
              por = Portionen, die das Rezept ergibt; w = Gewicht fertig gekocht in g (optional)
     items:   {id,n,b,g,u,per:{k,p,c,f},code,pid}  Zutat mit Werten pro 100 g/ml und einer Menge
              {id,n,k,p,c,f}                       Zutat mit festen Werten
   S.recDraft das Rezept, das gerade bearbeitet wird. Es bleibt erhalten, auch wenn die App zwischendurch zugeht.
   Im Tagebuch: {..., rec, por, pp} (pp = Werte pro Portion) oder {..., rec, g, u, per} beim Eintragen nach Gewicht. */
ICONS.rezepte=SV('<path d="M4.5 10.5h15V19h-15z"/><path d="M2 10.5h20M9 3.5v3.5M12 3v4M15 3.5v3.5"/>');
const PLUS_IC=SV('<path d="M12 4.5v15M4.5 12h15"/>',2.2);
let rv=null,recDate=null,recResumed=false;
function recById(id){return id?S.recipes.find(r=>r.id===id):null}
function recPor(r){const p=num(r&&r.por);return p>0?p:1}
function porTxt(v){v=rnd2(v);return fmt(v,2)+' '+(v===1?'Portion':'Portionen')}
function ingRaw(x){if(x&&x.per&&x.per.k!=null){const f=Math.max(0,num(x.g))/100;return {k:num(x.per.k)*f,p:num(x.per.p)*f,c:num(x.per.c)*f,f:num(x.per.f)*f}}
  return {k:num(x&&x.k),p:num(x&&x.p),c:num(x&&x.c),f:num(x&&x.f)}}
function recSum(r){const t={k:0,p:0,c:0,f:0};for(const x of (r&&r.items)||[]){const v=ingRaw(x);t.k+=v.k;t.p+=v.p;t.c+=v.c;t.f+=v.f}return t}
function rTot(t,s){s=Math.max(0,num(s));return {k:Math.round(num(t.k)*s),p:rnd1(num(t.p)*s),c:rnd1(num(t.c)*s),f:rnd1(num(t.f)*s)}}
function kLine(v){return fmt(v.k,0)+' kcal · '+foodLine(v)}
function recMatches(q){const W=words(q);if(!W.length)return [];return S.recipes.filter(r=>{const t=String(r.n||'').toLowerCase();return W.every(w=>t.includes(w))}).slice(0,8)}
function recCount(){const n=S.recipes.length;return recDirty()?'Ein Entwurf ist noch nicht gespeichert':n?n+(n===1?' Rezept':' Rezepte'):'Eigene Gerichte anlegen und eintragen'}
/* Für welchen Tag eingetragen wird: Tag der offenen Mahlzeit oder der Rezeptliste */
function recCtxDate(){const st=S.ui.stack;for(let i=st.length-1;i>=0;i--){if(st[i]==='mahlzeit'&&meal)return meal.date;if(st[i]==='rezepte')return recDate||today()}return today()}

/* ---------- Entwurf ---------- */
function recSig(R){return JSON.stringify([String(R.n||'').trim(),rnd2(R.por),Math.round(num(R.w)),String(R.note||'').trim(),(R.items||[]).map(x=>[x.n,rnd1(x.g),num(x.k),num(x.p),num(x.c),num(x.f)])])}
function recDirty(){const R=S.recDraft;return !!R&&recSig(R)!==R.sig0}
function recBlank(){return {id:'',n:'',por:1,w:'',note:'',items:[]}}
function recFrom(r){return {id:r.id,n:r.n,por:recPor(r),w:num(r.w)>0?num(r.w):'',note:r.note||'',items:JSON.parse(JSON.stringify(r.items||[]))}}
function recFresh(id){const r=recById(id),R=r?recFrom(r):recBlank();R.sig0=recSig(R);S.recDraft=R;return R}
/* Editor öffnen. Ein nicht gespeicherter Entwurf für dasselbe Rezept geht weiter. */
function recEditOpen(id){const R0=S.recDraft;
  if(R0&&(R0.id||'')===(id||'')&&recDirty())recResumed=true;else{recResumed=false;recFresh(id)}
  flash='';push('rezeptEdit')}
function recOtherDraft(id){const R=S.recDraft;return !!R&&recDirty()&&(R.id||'')!==(id||'')}
function recBack(){recResumed=false;if(recDirty())toast('Nicht gespeichert. Der Entwurf bleibt erhalten.');else S.recDraft=null;pop()}
function recClean(x){const n=String(x.n||'Zutat').trim().slice(0,80)||'Zutat',id=x.id||uid();
  if(x.per&&x.per.k!=null)return {id,n,b:String(x.b||'').slice(0,40),g:Math.max(0,rnd1(x.g)),u:x.u==='ml'?'ml':'g',per:{k:rnd2(x.per.k),p:rnd2(x.per.p),c:rnd2(x.per.c),f:rnd2(x.per.f)},code:String(x.code||''),pid:String(x.pid||'')};
  return {id,n,k:Math.max(0,Math.round(num(x.k))),p:Math.max(0,rnd1(x.p)),c:Math.max(0,rnd1(x.c)),f:Math.max(0,rnd1(x.f))}}

/* ---------- Liste ---------- */
function recRow(r){const pp=rTot(recSum(r),1/recPor(r));
  return `<button class="frow prow" data-act="recOpen" data-id="${esc(r.id)}"><span class="pthumb ph rthumb" aria-hidden="true">${ICONS.rezepte}</span><span class="fn"><b>${esc(r.n)}</b><span class="num">${fmt(pp.k,0)} kcal pro Portion · ergibt ${porTxt(recPor(r))}</span></span>${CHR}</button>`}
function recDraftCard(){const R=S.recDraft;if(!R||!recDirty())return '';const n=(R.items||[]).length,nm=String(R.n||'').trim();
  return `<div class="card pane rdraft"><div class="pane-h"><span class="eyebrow">Nicht gespeichert</span></div>
   <div class="rd-t"><b>${esc(nm||'Neues Rezept')}</b><span class="small muted">${R.id&&recById(R.id)?'Änderungen an einem Rezept':'Entwurf'} · ${n} ${n===1?'Zutat':'Zutaten'}</span></div>
   <div class="row"><button class="btn small ghost" data-act="recDiscard" data-id="d">${confirmKey==='recDiscard:d'?'Wirklich verwerfen?':'Verwerfen'}</button><button class="btn small primary" data-act="recResume">Weiter bearbeiten</button></div></div>`}
function recListHtml(){const L=S.recipes.slice().sort((a,b)=>(b.used||0)-(a.used||0)||String(a.n).localeCompare(String(b.n),'de'));
  return `<div class="foodres">${recDraftCard()}
   <button class="btn block scanbtn" data-act="recNew">${PLUS_IC}<span>${confirmKey==='recNew:'?'Entwurf verwerfen und neu anfangen?':'Neues Rezept'}</span></button>
   ${L.length?`<div class="card pane"><div class="pane-h"><span class="eyebrow">Deine Rezepte <span class="cnt">${L.length}</span></span><span class="small muted">Antippen zum Eintragen</span></div><div class="flist">${L.map(recRow).join('')}</div></div>`
    :`<div class="card empty"><b>Noch keine Rezepte</b>Leg dein erstes Rezept an: Zutaten suchen oder scannen, Mengen eintragen und festlegen, wie viele Portionen es ergibt. Danach ist eine Portion schnell eingetragen.</div>`}</div>`}
function viewRecipes(){return recListHtml()}

/* ---------- Rezept ansehen und eintragen ---------- */
/* Gewicht des ganzen Rezepts für das Eintragen in Gramm: gewogen, sonst die Summe der Zutaten (roh, ml zählt wie g) */
function recWt(r){const w=num(r.w);if(w>0)return {w,est:false};let g=0;for(const x of r.items||[])if(x.per&&num(x.g)>0)g+=num(x.g);return {w:Math.round(g),est:true}}
function rvOpen(id){const r=recById(id);if(!r)return false;const L=r.last||{},w=recWt(r).w,P=recPor(r),mode=L.m==='g'&&w>0?'g':'por';
  rv={id,date:recCtxDate(),mode,v:num(L.v)>0&&L.m===mode?num(L.v):mode==='g'?Math.round(w/P):1};return true}
function rvShare(r){const v=num(rv.v),w=recWt(r).w;return rv.mode==='g'&&w>0?v/w:v/recPor(r)}
function rvTotHtml(r){return totHtml(rTot(recSum(r),rvShare(r)))}
function viewRecipe(){const r=rv&&recById(rv.id);if(!r)return '<div class="card empty"><b>Kein Rezept gewählt</b>Geh zurück und wähl ein Rezept.</div>';
  const t=recSum(r),P=recPor(r),pp=rTot(t,1/P),W=recWt(r),w=W.w,byG=rv.mode==='g'&&w>0,v=num(rv.v),ps=w>0?Math.round(w/P):0;
  const opts=byG?[[ps,'1 Portion '+(W.est?'≈ ':'· ')+fmt(ps,0)+' g']].concat([200,250,300,400].filter(x=>x!==ps).map(x=>[x,x+' g'])):[[.5,'½'],[1,'1'],[1.5,'1½'],[2,'2'],[3,'3']];
  const dr=!!(S.recDraft&&S.recDraft.id===r.id&&recDirty());
  return `${dr?`<div class="infobox">An diesem Rezept gibt es nicht gespeicherte Änderungen. <button class="lnk inl" data-act="recResume">Weiter bearbeiten</button></div>`:''}
   <div class="card pane prodcard"><div class="prod-h"><span class="pimg rthumb" aria-hidden="true">${ICONS.rezepte}</span><div class="prod-t"><b>${esc(r.n)}</b><span class="small muted">Ergibt ${porTxt(P)}${w?(W.est?' · Zutaten ':' · fertig ')+fmt(w,0)+' g':''}</span></div></div>
    <div class="small muted num">pro Portion: ${kLine(pp)}</div></div>
   <div class="card pane"><div class="pane-h"><span class="eyebrow">Menge</span></div>
    ${w>0?`<div class="seg sm" role="group" aria-label="Menge angeben in"><button data-act="rvMode" data-v="por" aria-pressed="${!byG}">Portionen</button><button data-act="rvMode" data-v="g" aria-pressed="${byG}">Gramm</button></div>`:''}
    <div class="amt"><button class="nudge" data-act="rvStep" data-d="-1" aria-label="Weniger">−</button><input class="hin num amt-in" type="text" inputmode="decimal" autocomplete="off" id="rvAmt" value="${vIn(v)}" aria-label="${byG?'Menge in Gramm':'Anzahl Portionen'}"><span class="amt-u" id="rvU">${byG?'g':v===1?'Portion':'Portionen'}</span><button class="nudge plus" data-act="rvStep" data-d="1" aria-label="Mehr">+</button></div>
    <div class="sugg amts${byG?'':' pors'}">${opts.map(([x,l])=>`<button data-act="rvAmt" data-v="${x}" aria-pressed="${v===x}"${byG?'':` aria-label="${porTxt(x)}"`}>${esc(l)}</button>`).join('')}</div>
    ${byG&&W.est?`<div class="small muted">Gerechnet mit dem Gewicht der Zutaten, zusammen ${fmt(w,0)} g. Wiegst du das fertige Essen und trägst es im Rezept ein, wird es genauer.</div>`:''}
    <div id="rvTot">${rvTotHtml(r)}</div>
    <button class="btn primary block big" data-act="recEat">Eintragen: ${dayTitle(rv.date)}</button></div>
   <div class="card pane"><div class="pane-h"><span class="eyebrow">Zutaten <span class="cnt">${r.items.length}</span></span><span class="small muted">für ${porTxt(P)}</span></div>
    <div class="flist">${r.items.map(x=>`<div class="frow"><span class="fn"><b>${esc(x.n)}</b><span class="num">${x.per?fmt(num(x.g),1)+' '+(x.u||'g')+' · ':''}${fmt(Math.round(ingRaw(x).k),0)} kcal</span></span></div>`).join('')}</div></div>
   ${r.note?`<div class="card pane"><div class="pane-h"><span class="eyebrow">Zubereitung</span></div><div class="rnote">${esc(r.note)}</div></div>`:''}
   <div class="row"><button class="btn small ghost" data-act="recEdit" data-id="${esc(r.id)}">${confirmKey==='recEdit:'+r.id?'Anderen Entwurf verwerfen?':'Rezept bearbeiten'}</button></div>`}

/* ---------- Rezept bearbeiten ---------- */
function recTotHtml(R){const t=recSum(R),P=num(R.por)>0?num(R.por):1;
  return totHtml(rTot(t,1/P))+`<div class="small muted num rtot-all">Ganzes Rezept: ${kLine(rTot(t,1))}</div>`}
function recTotUpd(){const el=document.getElementById('recTot');if(el&&S.recDraft)el.innerHTML=recTotHtml(S.recDraft)}
function ingRow(x,i){const v=rTot(ingRaw(x),1),del=confirmKey==='recIngDel:'+x.id,u=x.u||'g';
  return `<div class="ingrow" id="ing-${i}"><span class="fn"><b>${esc(x.n)}</b><span class="num" id="ingv-${i}">${kLine(v)}</span></span>
   ${x.per?`<span class="ing-a"><input class="hin num ingv" id="ri-${i}" data-ri="${i}" type="text" inputmode="decimal" autocomplete="off" value="${vIn(x.g)}" aria-label="Menge ${esc(x.n)} in ${u}"><span>${u}</span></span>`:'<span class="ing-fix">feste Werte</span>'}
   <button class="${del?'btn small danger':'iconbtn'}" data-act="recIngDel" data-id="${esc(x.id)}" aria-label="${del?'Wirklich entfernen':esc(x.n)+' entfernen'}">${del?'Entfernen?':'✕'}</button></div>`}
function viewRecipeEdit(){const R=S.recDraft;if(!R)return '<div class="card empty"><b>Kein Rezept offen</b>Geh zurück und leg ein Rezept an.</div>';
  const n=R.items.length,P=num(R.por);
  return `${recResumed?`<div class="infobox">Hier geht es mit deinen nicht gespeicherten Änderungen weiter. <button class="lnk inl" data-act="recDiscard" data-id="e">${confirmKey==='recDiscard:e'?'Wirklich verwerfen?':'Verwerfen'}</button></div>`:''}
  <div class="card section">
   <label class="field"><span class="eyebrow">Name</span><input class="in" id="recN" data-rf="n" maxlength="60" autocomplete="off" value="${esc(R.n||'')}" placeholder="z. B. Chili con Carne"></label>
   <div class="field"><span class="eyebrow">Ergibt</span>
    <div class="amt sm"><button class="nudge" data-act="recPorStep" data-d="-1" aria-label="Eine Portion weniger">−</button><input class="hin num amt-in" id="recPor" data-rf="por" type="text" inputmode="decimal" autocomplete="off" value="${vIn(R.por)}" aria-label="Anzahl Portionen"><span class="amt-u" id="recPorU">${P===1?'Portion':'Portionen'}</span><button class="nudge plus" data-act="recPorStep" data-d="1" aria-label="Eine Portion mehr">+</button></div></div></div>
  <div class="card pane"><div class="pane-h"><span class="eyebrow">Zutaten <span class="cnt">${n}</span></span></div>
   ${n?`<div class="flist">${R.items.map(ingRow).join('')}</div>`:'<div class="small muted">Noch keine Zutaten. Such sie, scanne den Barcode oder trag feste Werte ein.</div>'}
   <div class="addrow"><button class="btn" data-act="recIngAdd">+ Zutat hinzufügen</button><button class="btn scanq" data-act="scanOpen" data-to="rec" aria-label="Zutat per Barcode scannen">${SCAN_IC}</button></div></div>
  <div class="card pane"><div class="pane-h"><span class="eyebrow">Pro Portion</span></div><div id="recTot">${recTotHtml(R)}</div></div>
  <div class="card section">
   <label class="field"><span class="eyebrow">Gewicht fertig gekocht in g (optional)</span><input class="in num" id="recW" data-rf="w" type="text" inputmode="decimal" autocomplete="off" value="${vIn(R.w)}" placeholder="z. B. 1400"><span class="small muted">Nach Gramm eintragen geht immer. Ohne diese Angabe rechnet die App mit dem Gewicht der Zutaten. Gewogen ist es genauer, etwa wenn Nudeln oder Reis beim Kochen Wasser aufnehmen.</span></label>
   <label class="field"><span class="eyebrow">Zubereitung (optional)</span><textarea class="in jnote" id="recNote" data-rf="note" maxlength="4000" rows="4" placeholder="Schritte, Zeiten, Tipps">${esc(R.note||'')}</textarea></label></div>
  ${flash?`<div class="err">${flash}</div>`:''}
  <button class="btn primary block big" data-act="recSave">Rezept speichern</button>
  ${R.id&&recById(R.id)?`<button class="btn small danger" data-act="recDel" data-id="${esc(R.id)}">${confirmKey==='recDel:'+R.id?'Rezept wirklich löschen?':'Rezept löschen'}</button>`:''}`}

/* ---------- Aktionen und Eingaben ---------- */
function recAct(a,el,ck){const ds=el&&el.dataset||{};switch(a){
  case 'recList':recDate=ds.date||today();push('rezepte');render();return true;
  case 'recOpen':if(rvOpen(ds.id))push('rezept');render();return true;
  case 'recNew':if(recDirty()&&ck!=='recNew:'){confirmKey='recNew:';render();return true}
    S.recDraft=null;recEditOpen('');render();return true;
  case 'recEdit':{const id=ds.id;if(recOtherDraft(id)&&ck!=='recEdit:'+id){confirmKey='recEdit:'+id;render();return true}
    recEditOpen(id);render();return true}
  case 'recResume':if(S.recDraft){recResumed=recDirty();flash='';push('rezeptEdit')}render();return true;
  case 'recDiscard':{const R=S.recDraft;
    if(ds.id==='e'&&R){recFresh(R.id&&recById(R.id)?R.id:'');recResumed=false}else S.recDraft=null;
    toast('Entwurf verworfen');render();return true}
  case 'recPorStep':{const R=S.recDraft;if(R){const v=num(R.por)||1,d=+ds.d;R.por=Math.min(100,Math.max(1,d>0?Math.floor(v)+1:Math.ceil(v)-1))}render();return true}
  case 'recIngAdd':if(S.recDraft&&S.recDraft.items.length>=60){toast('Ein Rezept hat höchstens 60 Zutaten');return true}
    pick=newMeal(today());push('zutat');render();return true;
  case 'recIngDel':{const R=S.recDraft;if(R)R.items=R.items.filter(x=>x.id!==ds.id);render();return true}
  case 'recSave':{const R=S.recDraft;if(!R)return true;const n=String(R.n||'').trim().slice(0,60),P=num(R.por);
    const fail=m=>{flash=m;render();return true};
    if(!n)return fail('Gib dem Rezept einen Namen.');
    if(!R.items.length)return fail('Füge mindestens eine Zutat hinzu.');
    if(!(P>0)||P>100)return fail('Gib an, wie viele Portionen das Rezept ergibt.');
    if(S.recipes.some(r=>r.id!==R.id&&String(r.n).toLowerCase()===n.toLowerCase()))return fail('Ein Rezept mit diesem Namen gibt es schon.');
    const old=recById(R.id);if(!old&&S.recipes.length>=200)return fail('Du hast schon 200 Rezepte. Lösch eines, bevor du ein neues anlegst.');
    const w=num(R.w);if(w>0&&w<10)return fail('Das Gewicht wirkt zu klein. Gib das ganze fertige Essen in Gramm an.');
    const r={id:old?old.id:(R.id||uid()),n,por:rnd2(P),w:w>0?Math.round(w):null,note:String(R.note||'').trim().slice(0,4000),items:R.items.map(recClean),
      used:old?old.used||0:Date.now(),uses:old?old.uses||0:0,last:old?old.last||null:null,created:old?old.created||today():today()};
    if(old)S.recipes[S.recipes.indexOf(old)]=r;else S.recipes.unshift(r);
    S.recDraft=null;recResumed=false;flash='';
    if(belowIs('rezept')){pop();const d=rv&&rv.date;rvOpen(r.id);if(d)rv.date=d}
    else{S.ui.stack[S.ui.stack.length-1]='rezept';rvOpen(r.id)}
    toast('Rezept gespeichert');render();return true}
  case 'recDel':{const id=ds.id;S.recipes=S.recipes.filter(r=>r.id!==id);
    if(S.recDraft&&S.recDraft.id===id)S.recDraft=null;recResumed=false;flash='';

/* ---------- Übungen: Gruppen nach Kategorie, Filter, Suche auch nach Muskel und englischem Namen ---------- */
function exStats(){const c={},l={};for(const s of S.sessions)for(const e of s.entries){c[e.exId]=(c[e.exId]||0)+1;if(!l[e.exId]||l[e.exId]<s.date)l[e.exId]=s.date}return {c,l}}
/* Für die Schnellauswahl: zuletzt trainierte, dann eigene, dann die üblichsten Standardübungen */
function exRecent(excl,n){const {l}=exStats(),P=EX_POP,pi=e=>{const i=P.indexOf(e.id);return i<0?999:i},rk=e=>l[e.id]?0:!isLib(e.id)?1:P.includes(e.id)?2:3;
  return S.exercises.filter(e=>!excl.has(e.id)).sort((a,b)=>rk(a)-rk(b)||(l[b.id]||'').localeCompare(l[a.id]||'')||pi(a)-pi(b)||a.name.localeCompare(b.name,'de')).slice(0,n)}
function exGroups(list){const g={};for(const e of list){const c=e.cat||'';(g[c]=g[c]||[]).push(e)}
  return allCats().filter(c=>g[c]).concat(g['']?['']:[]).map(c=>({c,list:g[c].sort((a,b)=>a.name.localeCompare(b.name,'de'))}))}
function exHay(e){const n=e.name.toLowerCase();return n+' '+n.replace(/[^a-zäöüß]/g,'')+' '+(e.cat||'').toLowerCase()+' '+(KIND_SHORT[e.kind]||'').toLowerCase()+' '+(LIB_ALIAS.get(libId(e.id))||'')}
function exMatch(q){const W=words(q);return W.length?S.exercises.filter(e=>{const t=exHay(e);return W.every(w=>t.includes(w))}):S.exercises}
function exFilt(list,c){return !c?list:c==='-'?list.filter(e=>!e.cat):list.filter(e=>e.cat===c)}
function catChips(cur,to){const cats=allCats().filter(c=>S.exercises.some(e=>e.cat===c));if(S.exercises.some(e=>!e.cat))cats.push('-');
  return `<div class="chips excats" id="${to}Cats" role="group" aria-label="Nach Kategorie filtern">${[''].concat(cats).map(c=>`<button class="chip" data-act="exCatF" data-to="${to}" data-v="${esc(c)}" aria-pressed="${cur===c}">${esc(c===''?'Alle':c==='-'?'Ohne Kategorie':c)}</button>`).join('')}</div>`}

function chipSync(){for(const r of document.querySelectorAll('#main .excats')){const b=r.querySelector('[aria-pressed="true"]');if(b&&b.offsetLeft+b.offsetWidth>r.clientWidth)r.scrollLeft=Math.max(0,b.offsetLeft-12)}}

/* Varianten einer Übung („Bizeps-Curl (Kurzhantel)“, „Bizeps-Curl (Kabelzug)“) teilen sich eine Zeile, die Geräte sind Knöpfe.
   Jede Variante bleibt eine eigene Übung mit eigenem Verlauf. Reihenfolge wie im Katalog: die übliche Variante zuerst. */
const LIB_ORD=new Map(EX_LIB.map((r,i)=>[r[0],i]));
const VCHK=SV('<path d="M4.5 12.5l4.5 4.5 10-10"/>',2.6);
function exVar(e){const m=String(e.name||'').match(/^(.+?)\s*\(([^()]+)\)\s*$/);return m?{base:m[1].trim(),v:m[2].trim()}:null}
function exRows(list){const fam=new Map();
  for(const e of list){const p=exVar(e);if(!p)continue;const k=p.base.toLowerCase();if(!fam.has(k))fam.set(k,[]);fam.get(k).push(e)}
  const out=[],seen=new Set(),ord=e=>{const i=LIB_ORD.get(libId(e.id));return i==null?999:i};
  for(const e of list){const p=exVar(e),k=p&&p.base.toLowerCase(),F=k?fam.get(k):null;
    if(F&&F.length>1){if(seen.has(k))continue;seen.add(k);out.push({base:p.base,list:F.slice().sort((a,b)=>ord(a)-ord(b)||a.name.localeCompare(b.name,'de'))})}
    else out.push({ex:e})}
  return out}
function famRow(F,act,st,badge){const L=F.list,k0=L[0].kind,same=L.every(e=>e.kind===k0),last=L.map(e=>st.l[e.id]||'').sort().pop();

     return `<button class="vchip${b?' on':''}" data-act="${act}" data-id="${e.id}" aria-label="${esc(e.name)}${c?', '+c+'× trainiert':''}${b?', '+esc(b):''}">${b?VCHK:''}${esc(exVar(e).v)}${c?`<small>${c}×</small>`:''}</button>`}).join('')}</span></span></div>`}

/* ---------- Übung wählen: für das laufende Training und für Pläne ---------- */
let exPick=null;

function peDepth(){return (planEdit&&S.ui.stack.includes('plaene'))||(goalEdit&&S.ui.stack.includes('ziele'))?1:0}

  if(!top&&free){const rec=pool(S.exercises.filter(e=>l[e.id])).sort((a,b)=>l[b.id].localeCompare(l[a.id])).slice(0,5);if(rec.length&&list.length>rec.length+6){top=rec.map(e=>exRow(e,'exPickDo',st,bd)).join('');tl='Zuletzt trainiert'}}
